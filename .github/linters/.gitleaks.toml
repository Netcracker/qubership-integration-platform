title = "QIP gitleaks config"

# Keep gitleaks' full default ruleset; we only add the allowlists below.
[extend]
useDefault = true

[[allowlists]]
description = "Local-dev-only Consul ACL bootstrap token (qip-dev stack, next to postgres/postgres). Not a production secret."
regexes = [
  '''556339d5-f6a3-ff3b-ce1d-98e5b70d4a13''',
]

[[allowlists]]
description = "Test TLS key of the Kafka listeners, generated by infrastructure/docker/kafka-ssl/generate.sh. Not a production secret."
paths = [
  '''(^|/)infrastructure/docker/kafka-ssl/server/''',
]

[[allowlists]]
description = "Fake GCP service account key in the Pub/Sub fixtures of the e2e suite and the build-pipeline tests, which the e2e suite sends to the Pub/Sub emulator (project sandbox, key id of zeros). Not a production secret."
paths = [
  '''(^|/)e2e/fixtures/brokers/pubsub-[^/]+/''',
  '''(^|/)integration-build-pipeline/src/test/resources/testConfigurations/senders/pubsub-sender/''',
]

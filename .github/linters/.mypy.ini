[mypy]
# Match Super-Linter's dependency policy and resolve the three independent source roots.
ignore_missing_imports = True
mypy_path = $MYPY_CONFIG_FILE_DIR/../../ai-service/e2e/evaluator/src:$MYPY_CONFIG_FILE_DIR/../../ai-service/knowledge-sidecar/src:$MYPY_CONFIG_FILE_DIR/../../ai-service/knowledge-sidecar/vendor/cip-runtime

[mypy-knowledge_sdk.*]
# The vendored SDK is checked by its upstream project; retain its type information for callers.
ignore_errors = True

---
name: Maven Module Build (reusable)

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
        description: Module directory name.
      sonar-project-key:
        type: string
        default: ""
        description: Sonar project key. Leave empty to skip analysis.
      force-update:
        type: boolean
        default: false
        description: Recheck external SNAPSHOT dependencies during the build.
      ensure-openapi-spec:
        type: boolean
        default: false
        description: Compare the generated OpenAPI specification with Git.
      use-cache:
        type: boolean
        default: true
        description: Restore and save the dependency cache.
      save-cache:
        type: boolean
        default: false
        description: Save dependencies from the trusted main build.
      runner:
        type: string
        default: ubuntu-latest
        description: Runner image for toolchain qualification.
    secrets:
      SONAR_TOKEN:
        required: false
        description: SonarCloud token for analysis.

concurrency:
  group: ${{ github.workflow }}-${{ inputs.module }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Restore the Maven repository
        id: maven-cache
        if: ${{ inputs.use-cache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-v2-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}-${{ inputs.module }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-v2-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}-${{ inputs.module }}-
            maven-v2-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}-

      - name: Build and verify (no publish)
        env:
          MODULE_NAME: ${{ inputs.module }}
          MAVEN_GITHUB_USERNAME: ${{ github.actor }}
          MAVEN_GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          FORCE_UPDATE: ${{ inputs.force-update }}
          OPENAPI_CHECK: ${{ inputs.ensure-openapi-spec }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          MAVEN_ANALYSIS_MODULE: ${{ inputs.module }}
          MAVEN_ANALYSIS_DIRECTORY: ${{ runner.temp }}/${{ inputs.module }}-analysis
        run: |
          set -eu
          if [ "$OPENAPI_CHECK" = true ]; then
            rm -f -- "$MODULE_NAME/api-spec/openapi.yaml"
          fi
          update_args=()
          if [ "$FORCE_UPDATE" = true ]; then update_args=(-U); fi
          build_goal=verify
          if [ -n "$SONAR_PROJECT_KEY" ]; then build_goal=install; fi
          "$GITHUB_WORKSPACE/scripts/maven-ci.sh" "$build_goal" "${update_args[@]}" \
            -pl "$MODULE_NAME" -am -Dgpg.skip=true
          if [ -n "$SONAR_PROJECT_KEY" ]; then
            # shellcheck disable=SC2016 # Maven expands the project expressions.
            "$GITHUB_WORKSPACE/scripts/maven-ci.sh" -pl "$MODULE_NAME" -am \
              org.codehaus.mojo:exec-maven-plugin:3.5.0:exec \
              "-Dexec.executable=$GITHUB_WORKSPACE/scripts/maven_analysis.py" \
              '-Dexec.args=export "${project.groupId}" "${project.artifactId}" "${project.version}" "${project.packaging}" "${project.build.directory}/${project.build.finalName}.${project.artifact.artifactHandler.extension}" "${project.file}"'
            python3 scripts/maven_analysis.py seal
          fi

      - name: Save the Maven repository
        if: ${{ inputs.use-cache && inputs.save-cache && inputs.sonar-project-key == '' && github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Upload Sonar inputs
        if: ${{ inputs.sonar-project-key != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.module }}-analysis
          path: ${{ runner.temp }}/${{ inputs.module }}-analysis
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload generated OpenAPI
        if: ${{ inputs.ensure-openapi-spec }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.module }}-openapi
          path: ${{ inputs.module }}/api-spec/openapi.yaml
          if-no-files-found: error
          retention-days: 1

  sonar:
    needs: build
    if: ${{ inputs.sonar-project-key != '' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Restore the Maven repository
        if: ${{ inputs.use-cache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-v2-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}-${{ inputs.module }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-v2-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}-${{ inputs.module }}-
            maven-v2-${{ runner.os }}-${{ runner.arch }}-java21-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}-

      - name: Download Sonar inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.module }}-analysis
          path: ${{ runner.temp }}/${{ inputs.module }}-analysis

      - name: Restore reactor artifacts and analysis inputs
        env:
          MAVEN_GITHUB_USERNAME: ${{ github.actor }}
          MAVEN_GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_ANALYSIS_DIRECTORY: ${{ runner.temp }}/${{ inputs.module }}-analysis
        run: python3 scripts/maven_analysis.py restore

      - name: Sonar scan (blocks on red Quality Gate)
        working-directory: ${{ inputs.module }}
        env:
          MAVEN_GITHUB_USERNAME: ${{ github.actor }}
          MAVEN_GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PLUGIN_VERSION: ${{ vars.SONAR_PLUGIN_VERSION }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          "$GITHUB_WORKSPACE/scripts/maven-ci.sh" \
            "org.sonarsource.scanner.maven:sonar-maven-plugin:${SONAR_PLUGIN_VERSION}:sonar" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.qualitygate.wait=true

  ensure-openapi-spec:
    needs: build
    if: ${{ inputs.ensure-openapi-spec }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download generated OpenAPI
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.module }}-openapi
          path: ${{ inputs.module }}/api-spec

      - name: Verify the specifications have no changes
        working-directory: ${{ inputs.module }}
        run: |
          if [ -n "$(git status --porcelain api-spec)" ]; then
            echo "Error: The OpenAPI specifications are out-of-date:"
            git status api-spec
            exit 1
          fi
          echo "OpenAPI specifications are up-to-date."

---
# Reusable Maven module release workflow.
#
# Model (bump-before): the pom <revision> (+ <changelist>-SNAPSHOT for services)
# holds the last released version. On release we bump it per release-type, publish
# that (changelist stripped), write the bumped <revision> back, and tag the bump
# commit. Deciding the version at release time keeps forked release lines from
# colliding on a shared pending version; `version` overrides for edge cases.
# flatten-maven-plugin inlines the parent, so the published POM has no SNAPSHOT.
#
# The tag rides the bump commit, so <revision> matches the released version and
# `git checkout <tag>` reproduces it. commit-and-push.sh pushes the tag before the
# branch (tags aren't protected), so it survives a rejected bump push — the
# recovery sentinel: tag exists => a prior run published but the bump didn't land,
# so recover=true skips deploy and only re-applies the bump.
#
# The bump push needs a GitHub App token on the branch-protection bypass list
# (vars.GH_BUMP_VERSION_APP_ID + secrets.GH_BUMP_VERSION_APP_KEY); without it
# GITHUB_TOKEN can't bypass and recovery retries on the next run.

name: Maven Module Release (reusable)

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
        description: "Module directory name (e.g. engine, runtime-catalog)"
      release-type:
        description: "patch | minor | major — how to bump <revision> to the released version"
        required: false
        type: string
        default: "patch"
      version:
        description: "Explicit release version (X.Y.Z) override. Empty = bump the current <revision> per release-type."
        required: false
        type: string
        default: ""
      profile:
        description: "Maven profile to use (central | github)"
        type: string
        required: false
        default: "central"
      build-docker:
        description: "Build Docker image"
        required: false
        default: true
        type: boolean
      mvn-args:
        description: "Additional maven arguments (e.g. -DskipTests=true)"
        required: false
        default: ""
        type: string
      tag-prefix:
        description: "Tag prefix, when it differs from the module dir (e.g. schemas-maven for the Maven schemas line)."
        required: false
        default: ""
        type: string
      sync-property:
        description: "Property in sync-poms to rewrite with the released version (e.g. qip-integration-build-pipeline.version)."
        required: false
        default: ""
        type: string
      sync-poms:
        description: "Space-separated POMs whose sync-property is rewritten and committed alongside the version bump."
        required: false
        default: ""
        type: string
    secrets:
      MAVEN_USER:
        required: false
        description: "Username for the non-github Maven repository (e.g. Central). Unused when profile=github."
      MAVEN_PASSWORD:
        required: false
        description: "Password/token for the non-github Maven repository. Unused when profile=github."
      MAVEN_GPG_PRIVATE_KEY:
        required: false
        description: "GPG private key used to sign release artifacts."
      MAVEN_GPG_PASSPHRASE:
        required: false
        description: "Passphrase for MAVEN_GPG_PRIVATE_KEY."
      GH_BUMP_VERSION_APP_KEY:
        required: false
        description: "Private key of the GitHub App that bypasses branch protection for the version-bump push. Falls back to GITHUB_TOKEN if unset."

concurrency:
  # Key on the module, not github.workflow (the caller's name in a reusable), so
  # every release path for a module serialises instead of racing.
  group: qip-release-${{ inputs.module }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Preflight: bump <revision> per release-type (or the override); recover if the
  # tag already exists.
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-version: ${{ steps.compute.outputs.release-version }}
      release-tag: ${{ steps.compute.outputs.release-tag }}
      recover: ${{ steps.compute.outputs.recover }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The branch tip, not the dispatch SHA: an earlier job in the same wave
          # may already have pushed a version bump this one has to read.
          ref: ${{ github.ref }}
          # The tag check queries the remote via ls-remote, so shallow is fine.
          fetch-depth: 1
          persist-credentials: false

      - name: Compute the release version
        id: compute
        env:
          ECOSYSTEM: maven
          MODULE: ${{ inputs.module }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          VERSION_OVERRIDE: ${{ inputs.version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: bash scripts/compute-release-version.sh

  # Build, sign, publish, then bump <revision>, commit, and tag. Recovery skips
  # deploy/upload and only re-applies the bump.
  build-and-publish:
    # run-name can't see a computed value (github/inputs/vars only), but a job
    # name can read `needs` — so the released version shows up here. This job has
    # no job-level if, so the name always evaluates; a job that can be skipped
    # would render the raw expression instead.
    name: publish ${{ needs.check-version.outputs.release-version }}
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      MODULE: ${{ inputs.module }}
      RELEASE_VERSION: ${{ needs.check-version.outputs.release-version }}
      # Gate the app-token step on the App key being present (secrets are not
      # allowed in `if:`, env derived from them is).
      APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}
    steps:
      # Mint a GitHub App token so the version-bump push can bypass branch
      # protection. Skipped when the App key is unset; checkout then falls back
      # to GITHUB_TOKEN.
      - name: Prepare app token
        id: app-token
        if: ${{ env.APP_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Without this, checkout takes github.sha — the commit the wave was
          # dispatched at — so a library released earlier in the same wave has
          # moved its consumer's pin on the branch, and this job cannot see it.
          # commit-and-push.sh already rebases onto the tip, so building from the
          # tip is also what makes the build and the commit agree.
          ref: ${{ github.ref }}
          fetch-depth: 0
          # Persist credentials: the tag and the version-bump commit are pushed
          # at the end via the App token (or GITHUB_TOKEN if the App is unset).
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: "21"
          distribution: "temurin"
          # Creds come from .github/maven-settings.xml (setup-java takes one
          # server-id; a Central release needs github + central). GPG key here.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      # setup-java's built-in maven cache restores on an exact pom-hash key only.
      # Every release rewrites the poms in a [skip ci] commit, so the tree the
      # next run checks out was never cached and the restore always missed. A
      # prefix fallback gives a warm start, and keying per module stops the Java
      # jobs in a wave from racing for one entry — only the first to finish could
      # save it, and the rest logged "Unable to reserve cache".
      - name: Cache the Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ inputs.module }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ inputs.module }}-

      # Pre-install the parent pom (deploy needs it; `-pl parent -N` is broken).
      - name: Install qip-monorepo-parent locally
        if: ${{ needs.check-version.outputs.recover != 'true' }}
        env:
          MAVEN_GITHUB_USERNAME: ${{ github.actor }}
          MAVEN_GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode -s "$GITHUB_WORKSPACE/.github/maven-settings.xml" -f parent/pom.xml install -N -DskipTests

      - name: Build and deploy module
        if: ${{ needs.check-version.outputs.recover != 'true' }}
        env:
          MODULE_NAME: ${{ inputs.module }}
          # From .github/maven-settings.xml: github resolves BOMs, central takes
          # the deploy (empty for profile=github).
          MAVEN_GITHUB_USERNAME: ${{ github.actor }}
          MAVEN_GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MVN_PROFILE: ${{ inputs.profile }}
          EXTRA_ARGS: ${{ inputs.mvn-args }}
          SKIP_GPG: ${{ inputs.profile == 'github' && '-Dgpg.skip=true' || '' }}
        run: |
          set -eu
          # No -am: the parent is pre-installed above, and an in-repo library
          # dependency (integration-build-pipeline) must come from its published
          # release, not from a reactor build this job would then deploy twice.
          # -Drevision publishes the computed version; -Dchangelist= strips -SNAPSHOT.
          # shellcheck disable=SC2086
          mvn --batch-mode deploy \
            -s "$GITHUB_WORKSPACE/.github/maven-settings.xml" \
            -pl $MODULE_NAME \
            -P "$MVN_PROFILE" \
            -Drevision="$RELEASE_VERSION" \
            -Dchangelist= \
            $SKIP_GPG \
            $EXTRA_ARGS

      - name: Write released version back to revision, tag, and commit
        env:
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ needs.check-version.outputs.release-tag }}
          SYNC_PROPERTY: ${{ inputs.sync-property }}
          SYNC_POMS: ${{ inputs.sync-poms }}
        run: |
          set -eu
          POM="$MODULE/pom.xml"
          # Write the released version into <revision> (<changelist> untouched).
          # TAG tags this bump commit and pushes it first (see the script). Runs
          # in recovery too — commit-and-push.sh no-ops if unchanged.
          sed -i -E "s#<revision>[0-9]+\.[0-9]+\.[0-9]+</revision>#<revision>${RELEASE_VERSION}</revision>#" "$POM"
          grep -q "<revision>${RELEASE_VERSION}</revision>" "$POM" || { echo "::error::Failed to write <revision> in $POM"; exit 1; }

          # Consumers pin this module by property; move them onto the release in
          # the same commit, so a later job in the wave builds against it.
          files="$POM"
          if [ -n "$SYNC_PROPERTY" ]; then
            # shellcheck disable=SC2086
            files="$POM $(bash scripts/sync-consumer-pins.sh "$SYNC_PROPERTY" "$RELEASE_VERSION" $SYNC_POMS | tr '\n' ' ')"
          fi
          # shellcheck disable=SC2086
          bash scripts/commit-and-push.sh "chore: $MODULE $RELEASE_VERSION released [skip ci]" $files

      - name: Upload build output
        if: ${{ inputs.build-docker == true && needs.check-version.outputs.recover != 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.module }}-jar
          # Upload the whole target/ dir: selective globs make upload-artifact
          # strip the `target/` prefix, breaking the Dockerfile's `COPY target/...`.
          path: ${{ inputs.module }}/target
          if-no-files-found: error

  # Docker image build (workflow-hub action). Skipped in recovery — no jar built.
  publish-image:
    if: ${{ inputs.build-docker == true && needs.check-version.outputs.recover != 'true' }}
    needs: [check-version, build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # The docker-action checks out later, so the tag script needs its own.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compute image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.check-version.outputs.release-version }}
        run: bash scripts/compute-image-tags.sh

      - name: "Docker Build"
        id: docker_build
        uses: netcracker/qubership-workflow-hub/actions/docker-action@ac0b35120b940eaa644cdcfee7d4957038998ec2 # v2.0.9
        with:
          ref: ${{ github.ref }}
          download-artifact: true
          download-artifact-name: ${{ inputs.module }}-jar
          # Reconstruct <module>/target/... so the Dockerfile's `COPY target/...`
          # resolves against the per-module build context set in `component`.
          download-artifact-path: ${{ inputs.module }}/target
          # Per-module image (the action otherwise defaults to the repo name,
          # colliding). All images are qubership-integration-<module> → derive it.
          custom-image-name: qubership-integration-${{ inputs.module }}
          # The default branch publishes only :latest (infra pulls :latest);
          # release branches publish the immutable version plus their branch
          # tag (:0.5.7, :release-0.5). The action's metadata-action alone
          # would emit only the branch tag.
          tags: ${{ steps.tags.outputs.list }}
          component: '[{"name": "${{ inputs.module }}", "dockerfile": "./${{ inputs.module }}/Dockerfile", "build_context": "./${{ inputs.module }}"}]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # No GitHub Release here — cut once per drop by release-all.

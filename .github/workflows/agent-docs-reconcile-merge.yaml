name: Reconcile merged documentation

on:
  # Both jobs check out the base-context SHA and verify the PR through GitHub.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]

permissions: {}

jobs:
  route:
    if: >-
      ${{ vars.AGENT_DOCS_ENABLED == 'true' && vars.AGENT_DOCS_PUBLISHER_LOGIN != '' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.user.login == vars.AGENT_DOCS_PUBLISHER_LOGIN &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'agent/docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue: ${{ steps.route.outputs.issue }}
      plan_id: ${{ steps.route.outputs.plan_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/autonomous-fixer/go.mod
          cache: false
      - name: Verify the merged documentation publication
        id: route
        working-directory: tools/autonomous-fixer
        env:
          GOTOOLCHAIN: local
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER: ${{ vars.AGENT_DOCS_PUBLISHER_LOGIN }}
        run: |
          route=$(go run ./cmd/docs-agent route-merge --repository "$GITHUB_REPOSITORY" --publisher-login "$PUBLISHER")
          jq -r '"issue=\(.issue)", "plan_id=\(.plan_id)"' <<< "$route" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: route
    if: needs.route.outputs.issue != '' && needs.route.outputs.plan_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: qip-docs-publish-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/autonomous-fixer/go.mod
          cache: false
      - name: Build documentation agent
        working-directory: tools/autonomous-fixer
        env:
          GOTOOLCHAIN: local
        run: go build -trimpath -o "$RUNNER_TEMP/docs-agent" ./cmd/docs-agent
      - name: Create a GitHub App reconciliation token
        id: app-token
        if: vars.AGENT_DOCS_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        env:
          INPUT_PERMISSION-VARIABLES: read
        with:
          app-id: ${{ vars.AGENT_DOCS_APP_ID }}
          private-key: ${{ secrets.AGENT_DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
          permission-organization-projects: write
      - name: Complete the documentation issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.AGENT_DOCS_GITHUB_TOKEN }}
          ISSUE: ${{ needs.route.outputs.issue }}
          PLAN_ID: ${{ needs.route.outputs.plan_id }}
        run: |
          "$RUNNER_TEMP/docs-agent" reconcile-merge --repository "$GITHUB_REPOSITORY" \
            --issue "$ISSUE" --plan-id "$PLAN_ID" --apply |
            jq '{status, plan_id, pr_number, merged_head_sha, updated_after_publication}' |
            tee "$RUNNER_TEMP/reconcile-merge.log"
      - name: Save reconciliation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-reconcile-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reconcile-merge.log
          if-no-files-found: ignore

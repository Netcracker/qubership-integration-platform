name: QIP agent PR outcome

on:
  # The recorder reads candidate Git objects without checking them out.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]

permissions: {}

jobs:
  record:
    if: >-
      ${{ vars.AGENT_ENABLED == 'true' && vars.AGENT_MODE == 'hosted' &&
          github.workflow_ref == format('{0}/.github/workflows/agent-outcome.yaml@refs/heads/{1}', github.repository, github.event.repository.default_branch) &&
          github.event.pull_request.head.repo.id == github.event.repository.id &&
          github.event.pull_request.base.repo.id == github.event.repository.id &&
          startsWith(github.event.pull_request.head.ref, 'agent/fix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    concurrency:
      group: qip-agent-outcome-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/autonomous-fixer/go.mod
          cache: false
      - name: Build the outcome recorder
        working-directory: tools/autonomous-fixer
        env:
          GOTOOLCHAIN: local
        run: go build -trimpath -o "$RUNNER_TEMP/agent-outcome" ./cmd/agent-outcome
      - name: Record the engineering pull request outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_USE_ORG_BOT: ${{ vars.AGENT_USE_ORG_BOT }}
          AGENT_ORG_BOT_LOGIN: ${{ vars.AGENT_ORG_BOT_LOGIN }}
          GH_ACCESS_TOKEN: ${{ vars.AGENT_USE_ORG_BOT == 'true' && secrets.GH_ACCESS_TOKEN || '' }}
          AGENT_CI_REQUIRED_CHECKS: ${{ vars.AGENT_CI_REQUIRED_CHECKS }}
          AGENT_OUTCOME_DIR: ${{ runner.temp }}/agent-outcome-report
        run: '"$RUNNER_TEMP/agent-outcome"'
      - name: Save the outcome report and normalized patches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-outcome-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-outcome-report
          if-no-files-found: ignore

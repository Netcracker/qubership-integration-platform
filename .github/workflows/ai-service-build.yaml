name: AI Service Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ai-service/**'
      - 'schemas/**'
      - 'pom.xml'
      - '.github/workflows/ai-service-build.yaml'

permissions: {}

jobs:
  test-system:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test runner and native report adapters
        env:
          PYTHONPATH: ai-service/e2e
        run: python -m unittest discover -s ai-service/e2e/test_system/tests -v
      - name: Test recovery evidence classifiers
        run: python -m unittest discover -s ai-service/e2e/product-pipeline -p 'test_*.py'
      - name: Test evaluator without a provider
        working-directory: ai-service/e2e/evaluator
        run: |
          pip install -e '.[dev]'
          pytest

  build:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_maven-module-build.yaml
    with:
      module: ai-service
      sonar-project-key: ${{ vars.SONAR_AI_SERVICE_PROJECT_KEY }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  knowledge-sidecar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies and test
        working-directory: ai-service/knowledge-sidecar
        run: |
          pip install -e ".[dev]"
          pytest

      - name: Verify Dockerfile builds
        run: docker build -t qip-knowledge-sidecar:ci ai-service/knowledge-sidecar

name: AI Service Build

on:
  workflow_dispatch:
    inputs:
      cold-cache:
        type: boolean
        default: false
        description: Run without restoring or saving the Maven cache.
      qualification-pr:
        type: number
        default: 0
        description: PR number for manual analysis on a feature branch.
      runner:
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]
        description: Runner image for toolchain qualification.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ai-service-build.yaml'
      - '.github/workflows/_maven-module-build.yaml'
      - '.github/maven-settings.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'scripts/maven-ci.sh'
      - 'scripts/maven_analysis.py'
      - 'ai-service/**'
      - 'schemas/**'
      - 'pom.xml'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/_maven-module-build.yaml
    with:
      qualification-pr: ${{ fromJSON(format('{0}', inputs.qualification-pr || 0)) }}
      use-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.cold-cache }}
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
      module: ai-service
      sonar-project-key: ${{ vars.SONAR_AI_SERVICE_PROJECT_KEY }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  knowledge-sidecar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies and test
        working-directory: ai-service/knowledge-sidecar
        run: |
          pip install -e ".[dev]"
          pytest

      - name: Verify Dockerfile builds
        run: docker build -t qip-knowledge-sidecar:ci ai-service/knowledge-sidecar

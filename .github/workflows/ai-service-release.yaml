---
name: AI Service Release

run-name: AI Service Release (${{ inputs.release-type }})

on:
  workflow_call:
    inputs:
      release-type:
        description: "patch | minor | major"
        required: false
        type: string
        default: "patch"
      build-docker:
        description: "Build Docker image"
        required: false
        default: true
        type: boolean
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string
    secrets:
      MAVEN_USER:
        required: false
      MAVEN_PASSWORD:
        required: false
      MAVEN_GPG_PRIVATE_KEY:
        required: false
      MAVEN_GPG_PASSPHRASE:
        required: false
      GH_BUMP_VERSION_APP_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release-type:
        description: "patch | minor | major"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
        required: false
        default: "patch"
      build-docker:
        description: "Build Docker image"
        required: false
        default: true
        type: boolean
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_maven-module-release.yaml
    with:
      module: ai-service
      release-type: ${{ inputs.release-type }}
      profile: github
      build-docker: ${{ inputs.build-docker }}
      mvn-args: ${{ inputs.mvn-args }}
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  publish-knowledge-sidecar-image:
    if: ${{ inputs.build-docker == true && needs.release.outputs.recover != 'true' }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compute image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.release.outputs.release-version }}
        run: bash scripts/compute-image-tags.sh

      - name: Docker Build
        uses: netcracker/qubership-workflow-hub/actions/docker-action@ac0b35120b940eaa644cdcfee7d4957038998ec2 # v2.0.9
        with:
          ref: ${{ github.ref }}
          custom-image-name: qubership-integration-knowledge-sidecar
          tags: ${{ steps.tags.outputs.list }}
          component: '[{"name": "knowledge-sidecar", "dockerfile": "./ai-service/knowledge-sidecar/Dockerfile", "build_context": "."}]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

---

# Label a pull request by the Conventional Commits type of its title.
#
# The drop release notes (.github/release.yml) file a PR under the first category
# its labels match, so the PR carries one type label, taken from the title it is
# merged under. Commit types inside the PR do not count: a `fix:` PR with one
# `feat:` commit is still a fix.

name: Automatic PR Labeler

on:
  pull_request:
    branches:
      - main
      - 'release/*'
      - 'feature/**'
    # `edited` covers a retitled PR; the job skips other edits.
    types:
      [opened, reopened, edited]

permissions: {}

jobs:
  assign-labels:
    if: (github.event.pull_request.merged == false) && (github.event.pull_request.user.login != 'dependabot[bot]') && (github.event.pull_request.user.login != 'github-actions[bot]') && (github.event.action != 'edited' || github.event.changes.title != null)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Assign the type label
        if: ${{ github.event.pull_request.base.repo.id == github.event.pull_request.head.repo.id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          declare -A by_type=([feat]=enhancement [fix]=bug [refactor]=refactor [docs]=documentation [build]=build)
          managed=("${by_type[@]}")

          wanted=" "
          if [[ "$TITLE" =~ ^([a-z]+)(\([^\)]*\))?!?: ]]; then
            wanted+="${by_type[${BASH_REMATCH[1]}]:-} "
          fi

          current=",$LABELS,"
          changes=()
          for label in "${managed[@]}"; do
            if [[ "$wanted" == *" $label "* ]]; then
              [[ "$current" == *",$label,"* ]] || changes+=(--add-label "$label")
            else
              [[ "$current" != *",$label,"* ]] || changes+=(--remove-label "$label")
            fi
          done

          if [ "${#changes[@]}" -eq 0 ]; then
            echo "The labels already match the title."
          else
            gh pr edit "$PR" "${changes[@]}"
          fi

      - name: "Drop warning if PR from fork"
        if: ${{ github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id }}
        run: |
          {
            echo "⚠️ Pull request from fork! ⚠️";
            echo "Labels are not applied to a fork's PR. Assign the type label for the title by hand (see automatic-pr-labeler.yaml).";
            echo "Title: $TITLE";
          } >> "$GITHUB_STEP_SUMMARY"

---
name: Checkstyle Release

run-name: Checkstyle Release (${{ inputs.release-type }})

on:
  workflow_call:
    inputs:
      release-type:
        description: "patch | minor | major"
        required: false
        type: string
        default: "patch"
      profile:
        description: "Maven profile to use"
        type: string
        required: false
        default: "central"
      build-docker:
        description: "Build Docker image"
        required: false
        default: false
        type: boolean
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string
    secrets:
      MAVEN_USER:
        required: false
      MAVEN_PASSWORD:
        required: false
      MAVEN_GPG_PRIVATE_KEY:
        required: false
      MAVEN_GPG_PASSPHRASE:
        required: false
      GH_BUMP_VERSION_APP_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release-type:
        description: "patch | minor | major"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
        required: false
        default: "patch"
      profile:
        description: "Maven profile to use"
        type: choice
        options:
          - "github"
          - "central"
        required: false
        default: "central"
      build-docker:
        description: "Build Docker image"
        required: false
        default: false
        type: boolean
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_maven-module-release.yaml
    with:
      module: checkstyle
      release-type: ${{ inputs.release-type }}
      profile: ${{ inputs.profile }}
      build-docker: ${{ inputs.build-docker }}
      mvn-args: ${{ inputs.mvn-args }}
      # Every POM that pins the released rules moves in the same bump commit;
      # otherwise the repo keeps compiling against the previous checkstyle.
      sync-property: qip-checkstyle-revision
      sync-poms: parent/pom.xml micro-engine/pom.xml schemas/pom.xml sessions-management/pom.xml
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

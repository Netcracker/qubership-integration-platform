---
name: End-to-End Host Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/e2e-host-compatibility.yaml'
      - '.gitattributes'
      - 'e2e/package*.json'
      - 'e2e/playwright.config.ts'
      - 'e2e/tsconfig*.json'
      - 'e2e/env/**'
      - 'e2e/k8s/**'
      - 'e2e/portable/**'
      - 'e2e/scripts/**'
      - 'e2e/suites/**'
      - 'e2e/fixtures/archives/**'
      - 'e2e/support/build-*.ts'
      - 'e2e/support/poll.ts'
      - 'e2e/support/process-group.ts'
      - 'e2e/support/resource-sampler.mjs'
      - 'e2e/support/run.ts'
      - 'e2e/support/run-token.ts'
      - 'e2e/support/*-server.ts'
      - 'e2e/support/schemas-build.ts'
      - 'e2e/support/state-file.ts'
      - 'e2e/specs/harness/bootstrap-host.spec.ts'
      - 'e2e/specs/harness/build-lock.spec.ts'
      - 'e2e/specs/harness/host-process.spec.ts'
      - 'e2e/specs/harness/process-group.spec.ts'
  workflow_dispatch:

permissions: {}

jobs:
  package-smoke:
    name: Installed package host checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check native host behavior from the tarball
        run: npm run test:package -- --host-smoke

---

name: E2E K8s

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: Playwright workers (E2E_WORKERS); empty uses the nightly value
        required: false
        type: string
      email:
        description: Email the run to vars.EMAIL_TO, as the nightly run does
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  # The steps live in _e2e-kind.yaml, which the pull request jobs of e2e-pr.yaml call per lane.
  e2e:
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/_e2e-kind.yaml
    with:
      name: Full suite on kind
      workers: ${{ inputs.workers }}
      email: ${{ github.event_name == 'schedule' || inputs.email }}
      timeout-minutes: 180
      global-timeout: 140
    secrets:
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

---

# Stack-free e2e checks: the type check and the `schema` and `harness` projects.
# No `paths` filter: the projects read trees outside `e2e/`, and a required check that never starts blocks the merge.

name: E2E PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  stack-free:
    name: Stack-free checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci

      - name: Check types
        run: npm run check-types

      - name: Run the schema and harness projects
        env:
          E2E_WORKERS: "4"
        run: npx playwright test --project=schema --project=harness

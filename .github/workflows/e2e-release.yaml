name: E2E Release

run-name: E2E Release (patch)

on:
  workflow_call:
    inputs:
      release-type:
        type: string
        default: patch
      npm-dist-tag:
        type: string
        default: latest
    secrets:
      GH_BUMP_VERSION_APP_KEY:
        required: false
  workflow_dispatch:
    inputs:
      npm-dist-tag:
        description: NPM distribution tag
        type: string
        default: latest

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_npm-module-release.yaml
    with:
      module: e2e
      standalone: true
      release-type: ${{ inputs.release-type }}
      npm-dist-tag: ${{ inputs.npm-dist-tag }}
    secrets:
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

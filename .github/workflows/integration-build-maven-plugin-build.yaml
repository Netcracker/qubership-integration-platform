---
name: Integration Build Maven Plugin Build

on:
  workflow_dispatch:
    inputs:
      cold-cache:
        type: boolean
        default: false
        description: Run without restoring or saving the Maven cache.
      qualification-pr:
        type: number
        default: 0
        description: PR number for manual analysis on a feature branch.
      runner:
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]
        description: Runner image for toolchain qualification.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/integration-build-maven-plugin-build.yaml'
      - '.github/workflows/_maven-module-build.yaml'
      - '.github/maven-settings.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'scripts/maven-ci.sh'
      - 'scripts/maven_analysis.py'
      - 'integration-build-maven-plugin/**'
      - 'integration-build-pipeline/**'
      - 'parent/**'
      - 'pom.xml'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/_maven-module-build.yaml
    with:
      qualification-pr: ${{ fromJSON(format('{0}', inputs.qualification-pr || 0)) }}
      use-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.cold-cache }}
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
      module: integration-build-maven-plugin
      sonar-project-key: ${{ vars.SONAR_INTEGRATION_BUILD_MAVEN_PLUGIN_PROJECT_KEY }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

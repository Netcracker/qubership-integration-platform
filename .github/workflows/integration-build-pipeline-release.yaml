---
name: Integration Build Pipeline Release

run-name: Integration Build Pipeline Release (patch)

on:
  workflow_call:
    inputs:
      release-type:
        description: "patch | minor | major"
        required: false
        type: string
        default: "patch"
      profile:
        description: "Maven profile to use"
        type: string
        required: false
        default: "central"
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string
    secrets:
      MAVEN_USER:
        required: false
      MAVEN_PASSWORD:
        required: false
      MAVEN_GPG_PRIVATE_KEY:
        required: false
      MAVEN_GPG_PASSPHRASE:
        required: false
      GH_BUMP_VERSION_APP_KEY:
        required: false
  # Patch only: minor and major go through release-all.
  workflow_dispatch:
    inputs:
      profile:
        description: "Maven profile to use"
        type: choice
        options:
          - "github"
          - "central"
        required: false
        default: "central"
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  snapshot-flow:
    name: Check Snapshot Flow
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Wait for Snapshot Flow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-snapshot-flow.sh

  release:
    needs: snapshot-flow
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_maven-module-release.yaml
    with:
      module: integration-build-pipeline
      release-type: ${{ inputs.release-type }}
      profile: ${{ inputs.profile }}
      build-docker: false
      mvn-args: ${{ inputs.mvn-args }}
      # runtime-catalog and the Maven plugin pin this library by property; move
      # them onto the release in the same bump commit, before their jobs check out.
      sync-property: qip-integration-build-pipeline.version
      sync-poms: runtime-catalog/pom.xml integration-build-maven-plugin/pom.xml
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

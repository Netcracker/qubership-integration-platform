name: Micro Engine Build

on:
  workflow_dispatch:
    inputs:
      cold-cache:
        type: boolean
        default: false
        description: Run without restoring or saving the Maven cache.
      qualification-pr:
        type: number
        default: 0
        description: PR number for manual analysis on a feature branch.
      runner:
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]
        description: Runner image for toolchain qualification.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/micro-engine-build.yaml'
      - '.github/workflows/_maven-module-build.yaml'
      - '.github/maven-settings.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'scripts/maven-ci.sh'
      - 'scripts/maven_analysis.py'
      - 'micro-engine/**'
      - 'pom.xml'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/_maven-module-build.yaml
    with:
      qualification-pr: ${{ fromJSON(format('{0}', inputs.qualification-pr || 0)) }}
      use-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.cold-cache }}
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
      module: micro-engine
      sonar-project-key: ${{ vars.SONAR_MICRO_ENGINE_PROJECT_KEY }}
      # Its com.netcracker.cloud BOMs import 1.0.0-SNAPSHOT BOMs from GitHub
      # Packages; -U fetches their current metadata instead of the cached copy.
      force-update: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

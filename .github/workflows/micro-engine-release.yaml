---
# micro-engine is the only module with private com.netcracker.cloud.* deps
# (pulled from maven.pkg.github.com/netcracker/*). They are not on Maven Central,
# so micro-engine is published to GitHub Packages: the `github` profile both
# authenticates the read of those private deps (server-id=github + GITHUB_TOKEN)
# and targets the github distributionManagement. There is therefore no profile
# choice here — it is fixed to `github`.

name: Micro Engine Release

run-name: Micro Engine Release (patch)

on:
  workflow_call:
    inputs:
      release-type:
        description: "patch | minor | major"
        required: false
        type: string
        default: "patch"
      build-docker:
        description: "Build Docker image"
        required: false
        default: true
        type: boolean
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string
    secrets:
      GH_BUMP_VERSION_APP_KEY:
        required: false
  # Patch only: minor and major go through release-all.
  workflow_dispatch:
    inputs:
      build-docker:
        description: "Build Docker image"
        required: false
        default: true
        type: boolean
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  snapshot-flow:
    name: Check Snapshot Flow
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Wait for Snapshot Flow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-snapshot-flow.sh

  release:
    needs: snapshot-flow
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_maven-module-release.yaml
    with:
      module: micro-engine
      release-type: ${{ inputs.release-type }}
      # Fixed to github: private com.netcracker.cloud deps are not on Central.
      profile: github
      build-docker: ${{ inputs.build-docker }}
      mvn-args: ${{ inputs.mvn-args }}
    secrets:
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

name: Release All

# run-name is fixed before any job runs and can only read github/inputs/vars, so
# it cannot carry the computed version. The number lands in the job names, the
# run summary, and the drop release.
run-name: Release All (${{ inputs.release-type }})

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type for the whole wave: patch | minor | major (each module bumps its own version)"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
        required: false
        default: "patch"
      modules:
        description: 'Modules to release (comma-separated, or "all" for everything)'
        required: false
        default: "all"
        type: string
      profile:
        description: "Maven profile"
        type: choice
        options:
          - "github"
          - "central"
        required: false
        default: "github"
      build-docker:
        description: "Build Docker images for applicable modules"
        required: false
        default: true
        type: boolean
      create-github-release:
        description: "Publish one combined GitHub Release for this wave, tagged v<platform-version>. Off = release the modules only, with no combined release."
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # One number for the whole backend: the four services and the drop tag all
      # take it, so a wave can't leave them on different lines.
      platform-version: ${{ steps.platform.outputs.release-version }}
      release-engine: ${{ steps.check.outputs.engine }}
      release-micro-engine: ${{ steps.check.outputs.micro-engine }}
      release-integration-build-pipeline: ${{ steps.check.outputs.integration-build-pipeline }}
      release-runtime-catalog: ${{ steps.check.outputs.runtime-catalog }}
      release-sessions-management: ${{ steps.check.outputs.sessions-management }}
      release-ui: ${{ steps.check.outputs.ui }}
      release-vscode-extension: ${{ steps.check.outputs.vscode-extension }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Determine modules to release
        id: check
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          set -eu
          # schemas and checkstyle are released manually (rare cadence) — not part of release-all.
          ALL_MODULES="engine micro-engine integration-build-pipeline runtime-catalog sessions-management ui vscode-extension"

          # Normalise input: strip spaces, wrap with commas so we can match whole tokens.
          requested=",${MODULES// /},"

          # Reject unknown tokens so a typo (or a manually-released module like
          # schemas/checkstyle) fails loudly instead of being silently dropped.
          if [[ "$MODULES" != "all" ]]; then
            known=",${ALL_MODULES// /,},"
            IFS=',' read -ra tokens <<< "${MODULES// /}"
            for tok in "${tokens[@]}"; do
              [ -z "$tok" ] && continue
              if [[ "$known" != *",${tok},"* ]]; then
                echo "::error::Unknown module '$tok'. Valid: $ALL_MODULES (or 'all'). schemas and checkstyle have their own release workflows."
                exit 1
              fi
            done
          fi

          for mod in $ALL_MODULES; do
            if [[ "$MODULES" == "all" ]] || [[ "$requested" == *",${mod},"* ]]; then
              echo "${mod}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${mod}=false" >> "$GITHUB_OUTPUT"
            fi
          done

      # central-publishing-maven-plugin returns at waitUntil=validated, so an
      # artifact published earlier in the wave is not necessarily resolvable from
      # Central when the next job needs it. Fail here rather than mid-wave, after
      # some modules have already published and tagged.
      - name: Reject a Central wave that cannot resolve the library
        if: ${{ inputs.profile == 'central' }}
        env:
          RELEASE_LIBRARY: ${{ steps.check.outputs.integration-build-pipeline }}
          RELEASE_RUNTIME_CATALOG: ${{ steps.check.outputs.runtime-catalog }}
        run: |
          set -eu
          if [ "$RELEASE_LIBRARY" = true ] && [ "$RELEASE_RUNTIME_CATALOG" = true ]; then
            echo "::error::profile=central cannot release integration-build-pipeline and runtime-catalog in one wave — runtime-catalog resolves the library from Central, which has not necessarily published it yet. Use profile=github, or release the library on its own first."
            exit 1
          fi

      - name: Compute the platform version
        id: platform
        env:
          ECOSYSTEM: platform
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: bash scripts/compute-release-version.sh

  release-engine:
    name: engine ${{ needs.prepare.outputs.platform-version }}
    needs: prepare
    if: needs.prepare.outputs.release-engine == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/engine-release.yaml
    with:
      release-type: ${{ inputs.release-type }}
      version: ${{ needs.prepare.outputs.platform-version }}
      profile: ${{ inputs.profile }}
      build-docker: ${{ inputs.build-docker }}
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  release-micro-engine:
    name: micro-engine ${{ needs.prepare.outputs.platform-version }}
    needs: prepare
    if: needs.prepare.outputs.release-micro-engine == 'true'
    permissions:
      contents: write
      packages: write
    # micro-engine publishes to GitHub Packages (private com.netcracker.cloud
    # deps are not on Central); its wrapper fixes profile=github and needs no
    # Central/GPG secrets.
    uses: ./.github/workflows/micro-engine-release.yaml
    with:
      release-type: ${{ inputs.release-type }}
      version: ${{ needs.prepare.outputs.platform-version }}
      build-docker: ${{ inputs.build-docker }}
    secrets:
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  release-integration-build-pipeline:
    needs: prepare
    if: needs.prepare.outputs.release-integration-build-pipeline == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/integration-build-pipeline-release.yaml
    with:
      release-type: ${{ inputs.release-type }}
      profile: ${{ inputs.profile }}
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  release-runtime-catalog:
    name: runtime-catalog ${{ needs.prepare.outputs.platform-version }}
    # After the library: its release moves runtime-catalog's pin, and this job
    # must check out a tree that already carries the new one.
    needs: [prepare, release-integration-build-pipeline]
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.release-runtime-catalog == 'true' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/runtime-catalog-release.yaml
    with:
      release-type: ${{ inputs.release-type }}
      version: ${{ needs.prepare.outputs.platform-version }}
      profile: ${{ inputs.profile }}
      build-docker: ${{ inputs.build-docker }}
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  release-sessions-management:
    name: sessions-management ${{ needs.prepare.outputs.platform-version }}
    needs: prepare
    if: needs.prepare.outputs.release-sessions-management == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/sessions-management-release.yaml
    with:
      release-type: ${{ inputs.release-type }}
      version: ${{ needs.prepare.outputs.platform-version }}
      profile: ${{ inputs.profile }}
      build-docker: ${{ inputs.build-docker }}
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  release-ui:
    needs: prepare
    if: needs.prepare.outputs.release-ui == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/ui-release.yaml
    with:
      release-type: ${{ inputs.release-type }}
    secrets:
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  release-vscode-extension:
    needs: [prepare, release-ui]
    if: always() && needs.prepare.outputs.release-vscode-extension == 'true' && (needs.release-ui.result == 'success' || needs.release-ui.result == 'skipped')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/vscode-extension-release.yaml
    with:
      release-type: ${{ inputs.release-type }}
    secrets:
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  # ---------------------------------------------------------------------------
  # Bill of Materials: snapshot the released version of every module (derived
  # from the git tags the release jobs just pushed) and attach it as an artifact.
  # ---------------------------------------------------------------------------
  publish-bom:
    needs:
      - prepare
      - release-engine
      - release-micro-engine
      - release-integration-build-pipeline
      - release-runtime-catalog
      - release-sessions-management
      - release-ui
      - release-vscode-extension
    # Run after every release attempt, regardless of which were skipped/failed,
    # so the BOM reflects whatever was actually tagged. Skip only if the module
    # selection itself failed validation.
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release BOM from git tags
        run: bash scripts/build-bom.sh | tee release-manifest.json
      - name: Upload release manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error

      # The run title can't carry a computed version, so the summary page does.
      - name: Write the released versions to the run summary
        env:
          PLATFORM_VERSION: ${{ needs.prepare.outputs.platform-version }}
        run: |
          set -eu
          {
            echo "## Platform ${PLATFORM_VERSION}"
            echo
            echo "| Module | Version |"
            echo "| --- | --- |"
            jq -r '.modules | to_entries[] | "| \(.key) | \(.value // "—") |"' release-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"

  # The one GitHub Release per wave (tag v<platform-version>); module jobs only tag.
  create-drop-release:
    name: drop v${{ needs.prepare.outputs.platform-version }}
    needs:
      - prepare
      - release-engine
      - release-micro-engine
      - release-integration-build-pipeline
      - release-runtime-catalog
      - release-sessions-management
      - release-ui
      - release-vscode-extension
    # Not always(): a failed module must not still cut a drop + bump the version.
    if: ${{ !cancelled() && !failure() && inputs.create-github-release && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      # Gate the app-token step on the App key being present (secrets are not
      # allowed in `if:`, env derived from them is).
      APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}
    steps:
      # Mint a GitHub App token so the platform-version bump push can bypass
      # branch protection. Skipped when the App key is unset; checkout then falls
      # back to GITHUB_TOKEN.
      - name: Prepare app token
        id: app-token
        if: ${{ env.APP_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          # Persist credentials: the platform-version bump commit is pushed back
          # at the end via the App token (or GITHUB_TOKEN if the App is unset).
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Create platform drop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.platform-version }}
          PRERELEASE: ${{ github.ref_name != 'main' }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/build-drop-release.sh

      # The PR gate checks what is true at rest. This is the one moment the
      # wave's own postcondition holds, so it is the only honest place to
      # assert it — and only for a full wave, since a partial one leaves the
      # services apart on purpose.
      - name: Check the wave landed one version everywhere
        if: ${{ inputs.modules == 'all' }}
        env:
          VERSION: ${{ needs.prepare.outputs.platform-version }}
        run: |
          set -eu
          . scripts/modules.sh
          bash scripts/check-version-invariants.sh
          for module in "${QIP_BACKEND[@]}"; do
            actual="$(grep -oP '(?<=<revision>)[^<]+' "$module/pom.xml" | head -1)"
            [ "$actual" = "$VERSION" ] || {
              echo "::error::$module is on $actual, but the wave released $VERSION"
              exit 1
            }
          done
          echo "Wave $VERSION landed on every backend service."

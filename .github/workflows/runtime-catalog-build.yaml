name: Runtime Catalog Build

on:
  workflow_dispatch:
    inputs:
      cold-cache:
        type: boolean
        default: false
        description: Run without restoring or saving the Maven cache.
      runner:
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]
        description: Runner image for toolchain qualification.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/runtime-catalog-build.yaml'
      - '.github/workflows/_maven-module-build.yaml'
      - '.github/maven-settings.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'scripts/maven-ci.sh'
      - 'scripts/maven_analysis.py'
      - 'runtime-catalog/**'
      - 'integration-build-pipeline/**'
      - 'parent/**'
      - 'pom.xml'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_maven-module-build.yaml
    with:
      use-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.cold-cache }}
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
      module: runtime-catalog
      sonar-project-key: ${{ vars.SONAR_RUNTIME_CATALOG_PROJECT_KEY }}
      ensure-openapi-spec: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

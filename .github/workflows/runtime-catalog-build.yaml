# `schemas/**` is here because this module's tests read four things out of that module through
# <testResource> entries, with no Maven dependency to make the link visible: the service schemas
# (ServiceTypeFilesTest), the conformance corpus, the naming corpus, and the export/import golden
# archives. Editing any of them can fail `mvn test` here, so it has to fire this build.
name: Runtime Catalog Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'runtime-catalog/**'
      - 'parent/**'
      - 'schemas/**'
      - 'pom.xml'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_maven-module-build.yaml
    with:
      module: runtime-catalog
      sonar-project-key: ${{ vars.SONAR_RUNTIME_CATALOG_PROJECT_KEY }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

---
name: Runtime Catalog Release

run-name: Runtime Catalog Release (patch)

on:
  workflow_call:
    inputs:
      release-type:
        description: "patch | minor | major"
        required: false
        type: string
        default: "patch"
      profile:
        description: "Maven profile to use"
        type: string
        required: false
        default: "central"
      build-docker:
        description: "Build Docker image"
        required: false
        default: true
        type: boolean
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string
    secrets:
      MAVEN_USER:
        required: false
      MAVEN_PASSWORD:
        required: false
      MAVEN_GPG_PRIVATE_KEY:
        required: false
      MAVEN_GPG_PASSPHRASE:
        required: false
      GH_BUMP_VERSION_APP_KEY:
        required: false
  # Patch only: minor and major go through release-all.
  workflow_dispatch:
    inputs:
      profile:
        description: "Maven profile to use"
        type: choice
        options:
          - "github"
          - "central"
        required: false
        default: "central"
      build-docker:
        description: "Build Docker image"
        required: false
        default: true
        type: boolean
      mvn-args:
        description: "Additional maven arguments to pass (e.g. -DskipTests=true -Dmaven.javadoc.skip=true)"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_maven-module-release.yaml
    with:
      module: runtime-catalog
      release-type: ${{ inputs.release-type }}
      profile: ${{ inputs.profile }}
      build-docker: ${{ inputs.build-docker }}
      mvn-args: ${{ inputs.mvn-args }}
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

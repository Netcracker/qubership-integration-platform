---
# Release the schemas module as a Maven artifact (ZIP + sources + javadoc,
# GPG-signed) to Maven Central via the shared _maven-module-release workflow.
#
# Call-only, from schemas-release.yaml. The Maven and npm lines carry the SAME
# version: schemas-release.yaml releases npm first and chains this workflow with
# that exact number. There is deliberately no workflow_dispatch — dispatching the
# Maven line on its own is the only way the two could diverge again. Tags differ
# (schemas-maven-v* here, schemas-v* for npm) so each line keeps its own recovery
# sentinel.
#
# Not part of release-all (rare, manual cadence). build-docker is false: schemas
# is a library, not a service image.

name: Schemas Maven Release (Central)

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (X.Y.Z). The npm release decides it."
        required: true
        type: string
      profile:
        description: "Maven profile to use (central | github)"
        required: false
        default: "central"
        type: string
    secrets:
      MAVEN_USER:
        required: false
      MAVEN_PASSWORD:
        required: false
      MAVEN_GPG_PRIVATE_KEY:
        required: false
      MAVEN_GPG_PASSPHRASE:
        required: false
      GH_BUMP_VERSION_APP_KEY:
        required: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_maven-module-release.yaml
    with:
      module: schemas
      version: ${{ inputs.version }}
      profile: ${{ inputs.profile }}
      build-docker: false
      # The npm line owns schemas-v*; this line needs its own prefix so neither
      # release reads the other's tag as a recovery sentinel.
      tag-prefix: schemas-maven
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

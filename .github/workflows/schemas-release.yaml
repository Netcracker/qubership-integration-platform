---
# Release the schemas module as an npm package (@netcracker/qip-schemas) via the
# shared _npm-module-release workflow, then release the Maven artifact under the
# SAME version, then optionally cascade to ui (and on to vscode-extension).
#
# One dispatch moves both ecosystems: npm decides the number, Maven takes it as
# an explicit override. The two tag lines stay separate (schemas-v*, schemas-maven-v*)
# so each keeps its own recovery sentinel.
#
# The only way to release schemas. The Maven line is call-only, so both artifacts
# always carry the same number.
#
# No workflow-level concurrency: the reusable serialises per module (group
# includes inputs.module). A wrapper-level group keyed on github.workflow would
# collide with the nested ui/vscode calls and deadlock.

name: Schemas Release

run-name: Schemas Release (${{ inputs.release-type }})

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "patch | minor | major"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
        required: false
        default: "patch"
      npm-dist-tag:
        description: "npm distribution tag"
        required: false
        type: string
        default: "latest"
      maven-profile:
        description: "Maven profile for the Maven artifact"
        type: choice
        options:
          - "central"
          - "github"
        required: false
        default: "central"
      cascade-ui:
        description: "After releasing schemas, also release ui (auto patch-bump)"
        required: false
        type: boolean
        default: false
      cascade-vscode-extension:
        description: "Also release vscode-extension after ui (only when cascade-ui is enabled)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_npm-module-release.yaml
    with:
      module: schemas
      release-type: ${{ inputs.release-type }}
      npm-dist-tag: ${{ inputs.npm-dist-tag }}
    secrets:
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  # Maven artifact, same number as npm. Chained rather than parallel: npm owns the
  # version, this call only takes the override.
  release-maven:
    needs: release
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/schemas-maven-release.yaml
    with:
      version: ${{ needs.release.outputs.release-version }}
      profile: ${{ inputs.maven-profile }}
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

  # Cascade: release ui (which itself may cascade on to vscode-extension) with an
  # auto patch-bump. Gated on the schemas publish, not on the GitHub release.
  cascade-ui:
    needs: release
    if: ${{ inputs.cascade-ui && always() && !failure() && !cancelled() }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/ui-release.yaml
    with:
      release-type: patch
      npm-dist-tag: ${{ inputs.npm-dist-tag }}
      cascade-vscode-extension: ${{ inputs.cascade-vscode-extension }}
    secrets:
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

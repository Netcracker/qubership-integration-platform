name: Sessions Management Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/sessions-management-build.yaml'
      - '.github/workflows/_maven-module-build.yaml'
      - '.github/maven-settings.xml'
      - 'sessions-management/**'
      - 'parent/**'
      - 'pom.xml'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_maven-module-build.yaml
    with:
      module: sessions-management
      sonar-project-key: ${{ vars.SONAR_SESSIONS_MANAGEMENT_PROJECT_KEY }}
      ensure-openapi-spec: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

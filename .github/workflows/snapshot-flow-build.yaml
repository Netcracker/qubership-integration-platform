name: Snapshot Flow Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/snapshot-flow-build.yaml'
      - 'integration-build-pipeline/**'
      - 'runtime-catalog/**'
      - 'micro-engine/**'
      - 'scripts/test-micro-engine-snapshots.sh'
      - 'parent/**'
      - 'pom.xml'
  # Two pull requests can each pass while together breaking the catalog-to-engine
  # contract; the run on main catches that and saves the cache pull requests restore.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snapshot-flow-build.yaml'
      - 'integration-build-pipeline/**'
      - 'runtime-catalog/**'
      - 'micro-engine/**'
      - 'scripts/test-micro-engine-snapshots.sh'
      - 'parent/**'
      - 'pom.xml'

concurrency:
  group: snapshot-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # The snapshot flow builds every module itself, so a module build only gates it:
  # a module the pull request does not touch is not built again.
  module_builds:
    name: Wait for module builds
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Wait
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF_JSON: ${{ toJSON(github.event.pull_request.head.ref) }}
          PR_HEAD_REPOSITORY_JSON: ${{ toJSON(github.event.pull_request.head.repo.full_name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_UPDATED_AT_JSON: ${{ toJSON(github.event.pull_request.updated_at) }}
        run: |
          set -euo pipefail

          changed_files=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename')

          integration_build_pipeline_expected=false
          runtime_catalog_expected=false
          micro_engine_expected=false

          # Keep these patterns aligned with the standalone module workflows.
          while IFS= read -r changed_file; do
            case "$changed_file" in
              integration-build-pipeline/*|parent/*|pom.xml)
                integration_build_pipeline_expected=true
                ;;
            esac
            case "$changed_file" in
              integration-build-pipeline/*|runtime-catalog/*|parent/*|pom.xml)
                runtime_catalog_expected=true
                ;;
            esac
            case "$changed_file" in
              micro-engine/*|pom.xml)
                micro_engine_expected=true
                ;;
            esac
          done <<< "$changed_files"

          # Prints "<run id>\t<run url>" of the latest run for this PR, or nothing.
          # A run from a fork lists no pull requests, so it is matched by its head.
          find_run() {
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs" \
              -f event=pull_request \
              -f head_sha="$PR_HEAD_SHA" \
              -F per_page=100 \
              --jq "
                .workflow_runs
                | map(select(
                    .created_at >= ${PR_UPDATED_AT_JSON}
                    and (
                      any(.pull_requests[]?; .number == ${PR_NUMBER})
                      or (
                        ((.pull_requests // []) | length) == 0
                        and .head_branch == ${PR_HEAD_REF_JSON}
                        and .head_repository.full_name == ${PR_HEAD_REPOSITORY_JSON}
                      )
                    )
                  ))
                | max_by(.run_number)
                | select(. != null)
                | [.id, .html_url]
                | @tsv
              "
          }

          wait_for_run() {
            local build_name="$1"
            local run_id="$2"
            local run_url="$3"
            local run_state
            local status
            local conclusion
            local status_read_failures=0

            while :; do
              if ! run_state=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --jq '[.status, (.conclusion // "")] | @tsv'); then
                status_read_failures=$((status_read_failures + 1))
                if [ "$status_read_failures" -ge 3 ]; then
                  echo "::error::Could not read ${build_name} status after three attempts: ${run_url}"
                  exit 1
                fi
                echo "::warning::Could not read ${build_name} status; retrying."
                sleep 20
                continue
              fi
              status_read_failures=0

              IFS=$'\t' read -r status conclusion <<< "$run_state"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::${build_name} did not complete successfully: ${run_url}"
                  exit 1
                fi
                return
              fi

              echo "Waiting for ${build_name} to complete (status: ${status})."
              sleep 20
            done
          }

          await_build() {
            local workflow_file="$1"
            local build_name="$2"
            local expected="$3"
            local run=""
            local run_id
            local run_url

            if [ "$expected" != "true" ]; then
              echo "| ${build_name} | not triggered |" >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            for _ in {1..12}; do
              if ! run=$(find_run "$workflow_file"); then
                echo "::warning::Could not inspect ${workflow_file}."
                run=""
              fi
              [ -n "$run" ] && break
              sleep 10
            done

            if [ -z "$run" ]; then
              echo "::warning::${build_name} was not found; the snapshot flow runs without it."
              echo "| ${build_name} | not found |" >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            IFS=$'\t' read -r run_id run_url <<< "$run"
            echo "Waiting for ${build_name}: ${run_url}"
            wait_for_run "$build_name" "$run_id" "$run_url"
            echo "| ${build_name} | [passed](${run_url}) |" >> "$GITHUB_STEP_SUMMARY"
          }

          printf '### Module builds\n\n| Build | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          await_build integration-build-pipeline-build.yaml "Integration Build Pipeline Library Build" "$integration_build_pipeline_expected"
          await_build runtime-catalog-build.yaml "Runtime Catalog Build" "$runtime_catalog_expected"
          await_build micro-engine-build.yaml "Micro Engine Build" "$micro_engine_expected"

  snapshot_flow:
    name: Catalog to Micro Engine snapshot flow
    needs: module_builds
    # The wait job runs only for pull requests and is skipped on main.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      # Only main saves the cache: a pull request's cache is visible to that pull
      # request alone, and a copy per pull request fills the repository quota.
      - name: Restore the Maven repository
        id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-snapshot-flow-${{ hashFiles('**/pom.xml') }}
          # Until main has a snapshot-flow cache, start from the runtime-catalog one.
          restore-keys: |
            maven-${{ runner.os }}-snapshot-flow-
            maven-${{ runner.os }}-runtime-catalog-

      - name: Verify Docker
        run: docker version

      - name: Verify generated micro-engine snapshots
        env:
          MAVEN_GITHUB_USERNAME: ${{ github.actor }}
          MAVEN_GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_BUNDLE_DIRECTORY: ${{ runner.temp }}/snapshotbundle
          ROOT_LOG_LEVEL: WARN
        run: |
          bash scripts/test-micro-engine-snapshots.sh \
            -s "$GITHUB_WORKSPACE/.github/maven-settings.xml" \
            '-Dquarkus.log.category."org.apache.camel.processor.errorhandler.DefaultErrorHandler".level=OFF'

      - name: Save the Maven repository
        if: ${{ github.event_name == 'push' && steps.maven-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Save snapshot test results
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: micro-engine-snapshot-results
          path: |
            ${{ runner.temp }}/snapshotbundle
            runtime-catalog/target/surefire-reports
            micro-engine/target/surefire-reports

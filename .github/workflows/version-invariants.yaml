---
# The platform version lives in six POMs and is written by three release scripts.
# This gate catches a drift on the PR that introduces it, not on the release that
# trips over it.

name: "Version Invariants"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/pom.xml"
      - "scripts/**"
      - ".github/workflows/version-invariants.yaml"

permissions: {}

jobs:
  check:
    name: Check POM version invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check versions
        run: bash scripts/check-version-invariants.sh

---
# Release the vscode-extension module as an npm package
# (@netcracker/qip-vscode-extension). Thin wrapper over the shared
# _npm-module-release workflow; tag prefix is vscode-extension-vX.Y.Z.

name: Vscode Extension Release

run-name: Vscode Extension Release (${{ inputs.release-type }})

on:
  workflow_call:
    inputs:
      release-type:
        required: false
        type: string
        default: "patch"
        description: "patch | minor | major"
      npm-dist-tag:
        required: false
        type: string
        default: "latest"
    secrets:
      GH_BUMP_VERSION_APP_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release-type:
        description: "patch | minor | major"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
        required: false
        default: "patch"
      npm-dist-tag:
        description: "NPM distribution tag"
        required: false
        type: string
        default: "latest"

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_npm-module-release.yaml
    with:
      module: vscode-extension
      release-type: ${{ inputs.release-type }}
      npm-dist-tag: ${{ inputs.npm-dist-tag }}
    secrets:
      GH_BUMP_VERSION_APP_KEY: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

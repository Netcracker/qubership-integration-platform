[project]
name = "qip-e2e-evaluator"
version = "0.1.0"
description = "Local semantic evaluator sidecar for product-pipeline quality gates"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

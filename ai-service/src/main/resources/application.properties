# =============================================================================
# QIP AI Assistant 2 Application Properties
# Sensitive values MUST be provided via environment variables in production.
# =============================================================================

# --- Application ---
quarkus.application.name=qip-ai-assistant-2
quarkus.http.port=3001

# --- CORS ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
quarkus.http.cors.headers=accept,accept-language,authorization,content-type,origin,access-control-request-method,access-control-request-headers
quarkus.http.cors.exposed-headers=content-type,location,content-disposition
quarkus.http.cors.access-control-max-age=24H

# --- LLM: Named OpenAI upstream (rate-limit wrapper is the unqualified ChatModel) ---
# Agents inject the unqualified RateLimitChatModel produced from @ModelName("upstream").
# Named config avoids competing with OpenAI @DefaultBean via @Produces ChatModel.
quarkus.langchain4j.openai.upstream.api-key=${LLM_API_KEY}
quarkus.langchain4j.openai.upstream.base-url=${LLM_BASE_URL}
quarkus.langchain4j.openai.upstream.chat-model.model-name=${LLM_CHAT_MODEL}
quarkus.langchain4j.openai.upstream.chat-model.temperature=${LLM_TEMPERATURE}
quarkus.langchain4j.openai.upstream.chat-model.max-completion-tokens=${LLM_MAX_TOKENS}
# Own rate-limit backoff (ceil retry-after). Keep langchain built-in retries off:
quarkus.langchain4j.openai.upstream.max-retries=1

# --- LLM: Default OpenAI (embedding + shared client defaults; not used as agent ChatModel) ---
quarkus.langchain4j.openai.api-key=${LLM_API_KEY}
quarkus.langchain4j.openai.base-url=${LLM_BASE_URL}
quarkus.langchain4j.openai.max-retries=1
quarkus.langchain4j.timeout=${LLM_TIMEOUT}

# Chat memory: token window per pipeline step agent (much smaller than monolithic agent — each step has focused context).
quarkus.langchain4j.chat-memory.type=TOKEN_WINDOW
quarkus.langchain4j.chat-memory.token-window.max-tokens=${CHAT_MEMORY_MAX_TOKENS:8000}

# --- LLM: Embedding Model ---
quarkus.langchain4j.openai.embedding-model.model-name=${LLM_EMBEDDING_MODEL:qwen3-vl-embedding-8b}

# --- Knowledge sidecar (LanceDB) ---

# --- Evidence snapshot API ---
qip.evidence.snapshot.enabled=${QIP_EVIDENCE_SNAPSHOT_ENABLED:false}
%dev.qip.evidence.snapshot.enabled=${QIP_EVIDENCE_SNAPSHOT_ENABLED:true}
%test.qip.evidence.snapshot.enabled=true

# --- A2A runtime rollout flag ---
# Default off. Helm sets QIP_AI_A2A_ENABLED. Disabling does not delete Task data or affect browser chat.
qip.ai.a2a.enabled=false
%test.qip.ai.a2a.enabled=true

# --- Create-chain Flow rollout flag ---
# Default off. When enabled, the provided-IDS route uses Quarkus Flow through design planning.
qip.ai.create.flow.enabled=${QIP_AI_CREATE_FLOW_ENABLED:false}

# --- A2A Task persistence (PostgreSQL + Flyway; prompt 02) ---
# Deployment uses a separate logical database named ai_a2a on the shared PostgreSQL instance.
# Prompt 07 must wire these Quarkus environment variables without renaming them:
#   QUARKUS_DATASOURCE_JDBC_URL      (jdbc:postgresql://<host>:5432/ai_a2a)
#   QUARKUS_DATASOURCE_USERNAME
#   QUARKUS_DATASOURCE_PASSWORD
#   QUARKUS_FLYWAY_MIGRATE_AT_START  (override when the environment must change the default)
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
%prod.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true

# Local permit-all defaults for optional security columns (not mandatory while permit-all is active).
qip.ai.a2a.default-tenant-id=local
qip.ai.a2a.default-subject-id=local-user
%local.qip.ai.a2a.default-tenant-id=local
%local.qip.ai.a2a.default-subject-id=local-user
%test.qip.ai.a2a.default-tenant-id=local
%test.qip.ai.a2a.default-subject-id=local-user

# Public Agent Card URL. Empty falls back to http://localhost:<quarkus.http.port> for local boots.
# Helm sets QIP_AI_A2A_PUBLIC_BASE_URL when A2A is enabled in a deployed environment.
qip.ai.a2a.public-base-url=${QIP_AI_A2A_PUBLIC_BASE_URL:}
%test.qip.ai.a2a.public-base-url=http://a2a.test.local

# Logs the JSON-RPC request body exactly as it arrived, before deserialization. Off by default:
# the body carries caller text that the launch observability rules keep out of logs. Turn on for a
# debugging window when a field may not be where the service looks for it.
qip.ai.a2a.log-inbound-payload=${QIP_AI_A2A_LOG_INBOUND_PAYLOAD:false}

# Turn budget for the conversational skill. Past it the caller gets the Task id instead of the
# answer, and the run continues under the same contextId.
qip.ai.a2a.assist-turn-budget=${QIP_AI_A2A_ASSIST_TURN_BUDGET:PT45S}
%test.qip.ai.a2a.assist-turn-budget=PT10S

# Exclusive dispatch lease. Renewed while facade work is in progress so long LLM runs do not
# lose ownership to a concurrent retry.
qip.ai.a2a.dispatch-lease=${QIP_AI_A2A_DISPATCH_LEASE:PT5M}
%test.qip.ai.a2a.dispatch-lease=PT30S
qip.ai.a2a.dispatch-heartbeat-interval=${QIP_AI_A2A_DISPATCH_HEARTBEAT_INTERVAL:PT30S}
%test.qip.ai.a2a.dispatch-heartbeat-interval=PT5S

# --- APIHUB MCP ---
qip.ai.apihub.base-url=${APIHUB_MCP_URL:${APIHUB_BASE_URL:}}
qip.ai.apihub.probe-on-startup=${APIHUB_MCP_PROBE_ON_STARTUP:false}
%dev.qip.ai.apihub.probe-on-startup=${APIHUB_MCP_PROBE_ON_STARTUP:true}
%test.qip.ai.apihub.probe-on-startup=false

# --- Catalog REST API ---
quarkus.cache.caffeine."catalog-operations-by-model".expire-after-write=10M
quarkus.cache.caffeine."catalog-operations-by-model".maximum-size=200
quarkus.cache.caffeine."catalog-element".expire-after-write=60S
quarkus.cache.caffeine."catalog-element".maximum-size=500
quarkus.cache.caffeine."element-patch-json-schema-envelope".expire-after-write=1H
quarkus.cache.caffeine."element-patch-json-schema-envelope".maximum-size=100
quarkus.cache.caffeine."element-patch-properties-schema".expire-after-write=1H
quarkus.cache.caffeine."element-patch-properties-schema".maximum-size=100

%test.quarkus.cache.enabled=false

qip.ai.catalog.log-response-body=${CATALOG_LOG_RESPONSE_BODY:true}

# --- REST Clients ---
quarkus.rest-client.apihub-mcp.url=${APIHUB_MCP_URL:${APIHUB_BASE_URL:}}
quarkus.rest-client.apihub-mcp.scope=jakarta.inject.Singleton
quarkus.rest-client.apihub-mcp.headers.api-key=${APIHUB_MCP_API_KEY:${APIHUB_MCP_BEARER:test}}
quarkus.rest-client.catalog-api.url=${CATALOG_URL:http://localhost:8091}
quarkus.rest-client.catalog-api.scope=jakarta.inject.Singleton
quarkus.rest-client.catalog-api.headers.Authorization=Bearer ${CATALOG_TOKEN:}
quarkus.rest-client.knowledge-sidecar.url=${QIP_KNOWLEDGE_SIDECAR_URL:http://localhost:8095}
quarkus.rest-client.knowledge-sidecar.scope=jakarta.inject.Singleton
quarkus.rest-client.knowledge-sidecar.connect-timeout=${QIP_KNOWLEDGE_CONNECT_TIMEOUT_MS:2000}
quarkus.rest-client.knowledge-sidecar.read-timeout=${QIP_KNOWLEDGE_READ_TIMEOUT_MS:10000}

# --- Product knowledge sidecar ---
qip.knowledge.sidecar.url=${QIP_KNOWLEDGE_SIDECAR_URL:http://localhost:8095}

# --- CREATE (product create-chain@1 only; profile pin is code-level) ---
qip.ai.create.language-version=${QIP_CREATE_LANGUAGE_VERSION:2026.1}
qip.knowledge.connect-timeout=2s
qip.knowledge.read-timeout=10s
%test.quarkus.rest-client.knowledge-sidecar.url=http://localhost:0/

# --- Object storage ---
qip.ai.storage.bucket-name=${STORAGE_BUCKET_NAME:qip-ai-storage}
qip.ai.storage.initialize-bucket-on-startup=${STORAGE_INIT_BUCKET_ON_STARTUP:false}
quarkus.http.limits.max-body-size=50M
quarkus.http.limits.max-form-attribute-size=50M

# --- LLM exchange trace (separate file, not console) ---
qip.ai.llm.exchange.enabled=${LLM_EXCHANGE_LOG_ENABLED:false}
qip.ai.llm.exchange.max-chars=${LLM_EXCHANGE_MAX_CHARS:50000}

# --- LLM rate-limit backoff ---
qip.ai.llm.rate-limit.enabled=true
qip.ai.llm.rate-limit.max-attempts=3
qip.ai.llm.rate-limit.max-turn-backoffs=12

# --- Knowledge lookup budgets (Stage 2 TPM burn caps) ---
qip.ai.pattern-selector.max-golden-pattern-calls=8
qip.ai.pattern-selector.max-decision-node-calls=4
qip.ai.compiler-skill.max-golden-pattern-calls=4
qip.ai.compiler-skill.max-decision-node-calls=3
qip.ai.compiler-skill.max-generator-contract-calls=4
qip.ai.compiler-skill.max-validation-rule-calls=6
qip.ai.compiler-skill.max-rule-calls=4

quarkus.log.handler.file."llm-exchange".enable=${LLM_EXCHANGE_LOG_ENABLED:false}
quarkus.log.handler.file."llm-exchange".path=${LLM_EXCHANGE_LOG_PATH:/tmp/llm-exchange.log}
quarkus.log.handler.file."llm-exchange".format=%d{yyyy-MM-dd HH:mm:ss,SSS} %s%e%n

quarkus.log.category."org.qubership.integration.platform.ai.llm.exchange".level=INFO
quarkus.log.category."org.qubership.integration.platform.ai.llm.exchange".handlers=llm-exchange
quarkus.log.category."org.qubership.integration.platform.ai.llm.exchange".use-parent-handlers=false

# --- Tracing ---
qip.ai.trace.log-assistant-result=${AI_TRACE_LOG_ASSISTANT_RESULT:false}
qip.ai.trace.assistant-result-max-chars=${AI_TRACE_ASSISTANT_RESULT_MAX_CHARS:8000}
qip.ai.trace.log-tools=${AI_TRACE_LOG_TOOLS:true}

quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false
quarkus.log.category."io.quarkiverse.langchain4j".level=INFO
quarkus.log.category."dev.langchain4j".level=INFO

# =============================================================================
# Dev profile
# =============================================================================
%dev.quarkus.langchain4j.log-requests=false
%dev.quarkus.langchain4j.log-responses=false
%dev.qip.ai.llm.exchange.enabled=${LLM_EXCHANGE_LOG_ENABLED:true}
%dev.quarkus.log.handler.file."llm-exchange".enable=${LLM_EXCHANGE_LOG_ENABLED:true}
%dev.qip.ai.trace.log-assistant-result=true
%dev.qip.ai.trace.log-tools=true
%dev.quarkus.tls.trust-all=true
%dev.quarkus.langchain4j.openai.tls.trust-all=true
%dev.qip.ai.storage.initialize-bucket-on-startup=${STORAGE_INIT_BUCKET_ON_STARTUP:true}

# =============================================================================
# Prod profile
# =============================================================================
%prod.quarkus.langchain4j.log-requests=false
%prod.quarkus.langchain4j.log-responses=false
%prod.quarkus.tls.trust-all=false
%prod.quarkus.langchain4j.openai.tls.trust-all=false
%prod.qip.ai.catalog.log-response-body=false

# =============================================================================
# Test profile
# =============================================================================
%test.quarkus.langchain4j.openai.api-key=test-key
%test.quarkus.langchain4j.openai.base-url=http://localhost:0/v1/
%test.quarkus.langchain4j.openai.upstream.api-key=test-key
%test.quarkus.langchain4j.openai.upstream.base-url=http://localhost:0/v1/
%test.quarkus.langchain4j.openai.upstream.chat-model.model-name=test-chat-model
%test.quarkus.langchain4j.openai.upstream.chat-model.temperature=0.0
%test.quarkus.langchain4j.openai.upstream.chat-model.max-completion-tokens=16
%test.quarkus.langchain4j.openai.upstream.max-retries=1
%test.quarkus.langchain4j.timeout=5s
%test.quarkus.langchain4j.openai.embedding-model.model-name=test-embedding-model
%test.quarkus.rest-client.apihub-mcp.url=http://localhost:0/
%test.quarkus.rest-client.catalog-api.url=http://localhost:0/
%test.qip.ai.apihub.base-url=http://localhost:0/
%test.qip.ai.catalog.log-response-body=false
%test.quarkus.langchain4j.log-requests=false
%test.quarkus.langchain4j.log-responses=false

# =============================================================================
# MinIO / S3
# =============================================================================
%dev.quarkus.s3.devservices.enabled=false
%dev.quarkus.s3.endpoint-override=${MINIO_ENDPOINT:http://localhost:9000}
%dev.quarkus.s3.path-style-access=true
%dev.quarkus.s3.aws.region=${MINIO_REGION:us-east-1}
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:minioadmin}
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:minioadmin}
%dev.quarkus.s3.sync-client.tls-trust-managers-provider.type=trust-all

%prod.quarkus.s3.devservices.enabled=false
%prod.quarkus.s3.endpoint-override=${MINIO_ENDPOINT}
%prod.quarkus.s3.path-style-access=true
%prod.quarkus.s3.aws.region=${MINIO_REGION:us-east-1}
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY}

%test.quarkus.s3.devservices.enabled=false
%test.quarkus.s3.endpoint-override=http://127.0.0.1:1
%test.quarkus.s3.path-style-access=true
%test.quarkus.s3.aws.region=us-east-1
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test

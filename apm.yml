name: qubership-integration-platform
version: 0.0.1
description: APM project for qubership-integration-platform
targets:
  - cursor
  - claude
  - codex
dependencies:
  apm:
    - Netcracker/qubership-ai-packages/agent-packages/english-developer-style
    - Netcracker/qubership-ai-packages/agent-packages/codex-review
    - Netcracker/qubership-ai-agent-telemetry/agent-packages/ai-agent-telemetry
devDependencies:
  apm:
    - Netcracker/qubership-ai-packages/agent-packages/apm-authoring
includes:
  - .apm/instructions/
  - .apm/skills/
compilation:
  exclude:
    - integration-platform-skills/**
    - .claude/**
    - .cursor/**
    - .agents/**
    - apm_modules/**
    # Build output. Placement scores are ratios over every scanned directory, so
    # leaving these in moves module guidance between AGENTS.md files depending on
    # whether the tree has been built.
    - "**/target/**"
    - "**/coverage/**"
    - ui/dist-lib/**
    - ui/public/doc/**

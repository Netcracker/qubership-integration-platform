---
apiVersion: dbaas.netcracker.com/v1
kind: InternalDatabase
metadata:
  name: {{ .Values.CATALOG_SERVICE_NAME }}-configs
  namespace: {{ .Values.NAMESPACE }}
  labels:
    app.kubernetes.io/name: {{ .Values.CATALOG_SERVICE_NAME }}
    deployer.cleanup/allow: "true"
spec:
  operatorNamespace: {{ (index (splitList "." (first (splitList ":" (last (splitList "://" .Values.API_DBAAS_ADDRESS))))) 1) | quote }}
  classifier:
    microserviceName: "{{ .Values.CATALOG_SERVICE_NAME }}"
    scope: tenant
    customKeys:
      logicalDbName: configs
  type: postgresql
  versioningConfig:
    approach: clone
  initialInstantiation:
    approach: clone
    sourceClassifier:
      microserviceName: "{{ .Values.CATALOG_SERVICE_NAME }}"
      scope: tenant
      extraKeys:
        logicalDbMarker: "{{ .Values.CATALOG_SERVICE_NAME }}"

---
id: "e2e0f007-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-kafka-sender-basic"
description: "kafka-sender-2 at its schema defaults: connectionSourceType manual, securityProtocol\
  \ PLAINTEXT, both serializers StringSerializer. An HTTP call drives it and a spec consumes the\
  \ topic with kafkajs to assert the payload arrived."
content:
  labels: []
  elements:
  - id: "e2e0f007-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-kafka-sender-basic"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e0f007-0000-4000-8000-000000000003"
    name: "Kafka Sender"
    type: "kafka-sender-2"
    properties:
      connectionSourceType: "manual"
      brokers: "kafka:29092"
      topics: "e2e-{{RUN}}-kafka-sender-basic"
      securityProtocol: "PLAINTEXT"
      saslMechanism: "GSSAPI"
      sslProtocol: "TLS"
      keySerializer: "org.apache.kafka.common.serialization.StringSerializer"
      valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
  dependencies:
  - from: "e2e0f007-0000-4000-8000-000000000002"
    to: "e2e0f007-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

---
id: "e2e10017-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-kafka-sender-propagate-context-false"
description: "The Kafka sender with propagateContext=false. An HTTP call carrying X-Request-Id drives it, and a spec reads X-Request-Id off the record headers."
content:
  labels: []
  elements:
  - id: "e2e10017-0000-4000-8000-000000000002"
    name: "HTTP Trigger"

---
id: "e2e1002b-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-kafka-tlsv1-2-refused"
description: "The Kafka sender with sslProtocol TLSv1.2 on the TLS13 listener, which accepts TLSv1.3 only, so every send fails the handshake. Spec-owned (SPEC_OWNED_FIXTURES): kafka-security.spec.ts deploys it and deletes it, because its producer retries the handshake for as long as the chain stays deployed."
content:
  labels: []
  elements:
  - id: "e2e1002b-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-kafka-tlsv1-2-refused"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e1002b-0000-4000-8000-000000000003"
    name: "sslProtocol=TLSv1.2"
    type: "kafka-sender-2"
    properties:
      connectionSourceType: "manual"
      brokers: "kafka:29097"
      topics: "e2e-{{RUN}}-kafka-tlsv1-2-refused"
      securityProtocol: "SSL"
      saslMechanism: "GSSAPI"
      sslProtocol: "TLSv1.2"
      keySerializer: "org.apache.kafka.common.serialization.StringSerializer"
      valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
  dependencies:
  - from: "e2e1002b-0000-4000-8000-000000000002"
    to: "e2e1002b-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

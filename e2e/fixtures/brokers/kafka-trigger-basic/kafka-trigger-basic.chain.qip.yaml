$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-kafka-trigger-basic"
description: "kafka-trigger-2 at its schema defaults: connectionSourceType manual, securityProtocol\
  \ PLAINTEXT, autoOffsetReset latest, both deserializers StringDeserializer. A spec publishes a\
  \ Kafka message carrying the external-session-cip-id header and correlates the session the same\
  \ way an HTTP call would."
content:
  labels: []
  elements:
  - id: "e2e0f001-0000-4000-8000-000000000002"
    name: "Kafka Trigger"

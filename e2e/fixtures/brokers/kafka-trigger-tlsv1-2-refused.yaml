---
id: "e2e1002d-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-kafka-trigger-tlsv1-2-refused"
description: "The Kafka trigger with sslProtocol TLSv1.2 on the TLS13 listener, which accepts TLSv1.3 only, so its consumer fails every handshake. Spec-owned (SPEC_OWNED_FIXTURES): kafka-security.spec.ts deploys it and deletes it, because its consumer retries the handshake for as long as the chain stays deployed."
content:
  labels: []
  elements:
  - id: "e2e1002d-0000-4000-8000-000000000002"
    name: "sslProtocol=TLSv1.2"
    type: "kafka-trigger-2"
    properties:
      connectionSourceType: "manual"
      brokers: "kafka:29097"
      topics: "e2e-{{RUN}}-kafka-trigger-tlsv1-2-refused"
      securityProtocol: "SSL"
      saslMechanism: "GSSAPI"
      sslProtocol: "TLSv1.2"
      groupId: "e2e-{{RUN}}-kafka-trigger-tlsv1-2-refused"
      consumerConsistencyMode: "EVENTUAL"
      autoOffsetReset: "earliest"
      keyDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      valueDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      idempotency:
        enabled: false
  - id: "e2e1002d-0000-4000-8000-000000000003"
    name: "Header Modification"
    type: "header-modification"
    properties:
      headerModificationToAdd:
        e2e-fixture: "{{RUN}}"
      headerModificationToRemove: []
  dependencies:
  - from: "e2e1002d-0000-4000-8000-000000000002"
    to: "e2e1002d-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

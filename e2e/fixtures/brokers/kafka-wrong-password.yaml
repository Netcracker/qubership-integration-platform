---
id: "e2e1002c-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-kafka-wrong-password"
description: "The Kafka trigger over SASL_PLAINTEXT with SCRAM-SHA-512 and a password the broker refuses. Spec-owned (SPEC_OWNED_FIXTURES): kafka-security.spec.ts deploys it, publishes to its topic, and deletes it."
content:
  labels: []
  elements:
  - id: "e2e1002c-0000-4000-8000-000000000002"
    name: "Kafka Trigger"
    type: "kafka-trigger-2"
    properties:
      connectionSourceType: "manual"
      brokers: "kafka:29094"
      topics: "e2e-{{RUN}}-kafka-wrong-password"
      securityProtocol: "SASL_PLAINTEXT"
      saslMechanism: "SCRAM-SHA-512"
      sslProtocol: "TLS"
      saslJaasConfig: "org.apache.kafka.common.security.scram.ScramLoginModule required username=e2e password=not-the-password;"
      groupId: "e2e-{{RUN}}-kafka-wrong-password"
      consumerConsistencyMode: "EVENTUAL"
      autoOffsetReset: "earliest"
      keyDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      valueDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      idempotency:
        enabled: false
  - id: "e2e1002c-0000-4000-8000-000000000003"
    name: "Header Modification"
    type: "header-modification"
    properties:
      headerModificationToAdd:
        e2e-fixture: "{{RUN}}"
      headerModificationToRemove: []
  dependencies:
  - from: "e2e1002c-0000-4000-8000-000000000002"
    to: "e2e1002c-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

---
id: "e2e10019-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-rabbitmq-sender-propagate-context-false"
description: "The RabbitMQ sender with propagateContext=false. An HTTP call carrying X-Request-Id drives it, and a spec reads X-Request-Id off the AMQP headers."
content:
  labels: []
  elements:
  - id: "e2e10019-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-rabbitmq-sender-propagate-context-false"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e10019-0000-4000-8000-000000000003"
    name: "propagateContext=false"
    type: "rabbitmq-sender-2"
    properties:
      connectionSourceType: "manual"
      addresses: "rabbitmq:5672"
      username: "guest"
      password: "guest"
      exchange: "e2e-{{RUN}}-rabbitmq-sender-propagate-context-false"
      routingKey: "e2e-{{RUN}}-rabbitmq-sender-propagate-context-false"
      exchangePattern: "InOnly"
      propagateContext: false
  dependencies:
  - from: "e2e10019-0000-4000-8000-000000000002"
    to: "e2e10019-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

---
id: "e2e0g001-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-rabbitmq-trigger-basic"
description: "rabbitmq-trigger-2 at its schema defaults: connectionSourceType manual, acknowledgeMode\
  \ AUTO, exchangeType direct. A spec publishes with amqplib carrying the external-session-cip-id\
  \ AMQP header and correlates the session the same way an HTTP call would."
content:
  labels: []
  elements:
  - id: "e2e0g001-0000-4000-8000-000000000002"
    name: "RabbitMQ Trigger"
    type: "rabbitmq-trigger-2"
    properties:
      connectionSourceType: "manual"
      addresses: "rabbitmq:5672"
      username: "guest"
      password: "guest"
      exchange: "e2e-{{RUN}}-rabbitmq-trigger-basic"
      routingKey: "e2e-{{RUN}}-rabbitmq-trigger-basic"
      queues: "e2e-{{RUN}}-rabbitmq-trigger-basic"
      exchangeType: "direct"
      acknowledgeMode: "AUTO"
      idempotency:
        enabled: false
  - id: "e2e0g001-0000-4000-8000-000000000003"
    name: "Header Modification"
    type: "header-modification"
    properties:
      headerModificationToAdd:
        e2e-fixture: "{{RUN}}"
      headerModificationToRemove: []
  dependencies:
  - from: "e2e0g001-0000-4000-8000-000000000002"
    to: "e2e0g001-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

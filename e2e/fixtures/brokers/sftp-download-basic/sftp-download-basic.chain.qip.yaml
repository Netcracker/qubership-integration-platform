---
id: "e2e0h003-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-sftp-download-basic"
description: "sftp-download, a pollEnrich mid-chain rather than a trigger. An HTTP call drives it;\
  \ a spec drops a file onto the polled directory over SFTP before the call, so the poll finds it\
  \ immediately, and asserts the downloaded body reached the following step."
content:
  labels: []
  elements:
  - id: "e2e0h003-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-sftp-download-basic"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e0h003-0000-4000-8000-000000000003"
    name: "SFTP Download"
    type: "sftp-download"
    properties:
      connectUrl: "sftp-server:22/upload/{{RUN}}/download-basic"
      antInclude: "*.txt"
      username: "e2e"
      password: "e2epass"
      idempotent: false
      idempotentKey: "${file:name}-${file:size}-${file:modified}"
      streamDownload: true
      binary: true
      autoCreate: true
      useUserKnownHostsFile: false
      sendEmptyMessageWhenIdle: true
      throwExceptionOnConnectFailed: true
  - id: "e2e0h003-0000-4000-8000-000000000004"
    name: "Header Modification"
    type: "header-modification"
    properties:
      headerModificationToAdd:
        e2e-fixture: "{{RUN}}"
      headerModificationToRemove: []
  dependencies:
  - from: "e2e0h003-0000-4000-8000-000000000002"
    to: "e2e0h003-0000-4000-8000-000000000003"
  - from: "e2e0h003-0000-4000-8000-000000000003"
    to: "e2e0h003-0000-4000-8000-000000000004"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

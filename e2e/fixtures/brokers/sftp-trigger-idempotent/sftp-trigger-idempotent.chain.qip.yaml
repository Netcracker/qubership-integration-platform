---
id: "e2e0h002-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-sftp-trigger-idempotent"
description: "sftp-trigger-2 with idempotent true and a fixed, non-file-derived idempotentKey.\
  \ Every file matched by antInclude resolves to the same key, so a spec proves the axis by\
  \ dropping two distinct files and asserting the second is never processed -- the in-memory\
  \ idempotent repository rejects it on the key alone, before the route runs."
content:
  labels: []
  elements:
  - id: "e2e0h002-0000-4000-8000-000000000002"
    name: "SFTP Trigger"
    type: "sftp-trigger-2"
    properties:
      connectUrl: "sftp-server:22/upload/{{RUN}}/trigger-idempotent"
      antInclude: "*.txt"
      autoCreate: true
      binary: true
      idempotent: true
      idempotentKey: "e2e-{{RUN}}-sftp-idem-key"
      ignoreFileNotFoundOrPermissionError: true
      jschLoggingLevel: "OFF"
      password: "e2epass"
      readLockLoggingLevel: "OFF"
      runLoggingLevel: "OFF"
      scheduler: "quartz"
      scheduler.cron: "0/3 * * * * ?"
      scheduler.deleteJob: false
      scheduler.triggerGroup: "%%{domain-placeholder}-group"
      streamDownload: true
      username: "e2e"
      useUserKnownHostsFile: false
  - id: "e2e0h002-0000-4000-8000-000000000003"
    name: "Header Modification"
    type: "header-modification"
    properties:
      headerModificationToAdd:
        e2e-fixture: "{{RUN}}"
      headerModificationToRemove: []
  dependencies:
  - from: "e2e0h002-0000-4000-8000-000000000002"
    to: "e2e0h002-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

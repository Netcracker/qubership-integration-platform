---
id: "e2e00011-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-chain-callee"
description: "The chain the chain-call fixture calls. It carries two triggers: an HTTP one so the\
  \ seed can poll its route like every other fixture, and a chain trigger, which is the only kind\
  \ of element a Chain Call can address."
content:
  labels: []
  elements:
  - id: "e2e00011-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-chain-callee"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00011-0000-4000-8000-000000000003"
    name: "Direct Reply"
    type: "script"
    properties:
      script: "exchange.getMessage().setBody('{\"called\":\"http\"}')"
  - id: "e2e00011-0000-4000-8000-000000000004"
    name: "Chain Trigger"
    type: "chain-trigger-2"
    properties:
      elementId: "e2e00011-0000-4000-8000-000000000004"
  - id: "e2e00011-0000-4000-8000-000000000005"
    name: "Callee Reply"
    type: "script"
    properties:
      script: "exchange.getMessage().setBody('{\"called\":\"chain\"}')"
  dependencies:
  - from: "e2e00011-0000-4000-8000-000000000002"
    to: "e2e00011-0000-4000-8000-000000000003"
  - from: "e2e00011-0000-4000-8000-000000000004"
    to: "e2e00011-0000-4000-8000-000000000005"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

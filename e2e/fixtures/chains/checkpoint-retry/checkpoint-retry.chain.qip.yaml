---
id: "e2e00027-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-checkpoint-retry"
description: "Two checkpoints and a step after them that fails while the e2e-fail header is true,\
  \ so a failed session keeps both checkpoints and a retry that replaces the header completes."
content:
  labels: []
  elements:
  - id: "e2e00027-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-checkpoint-retry"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00027-0000-4000-8000-000000000003"
    name: "First Checkpoint"
    type: "checkpoint"
    properties:
      checkpointElementId: "e2e00027-0000-4000-8000-000000000003"
      contextPath: "/chains/e2e00027-0000-4000-8000-000000000001/sessions/{checkpointSessionId}/checkpoint-elements/e2e00027-0000-4000-8000-000000000003/retry"
      externalRoute: false
      httpMethodRestrict: "POST"
  - id: "e2e00027-0000-4000-8000-000000000004"
    name: "Between Checkpoints"
    type: "script"
    properties:
      script: "exchange.getMessage().setHeader('e2e-between', 'ran')"
  - id: "e2e00027-0000-4000-8000-000000000005"
    name: "Second Checkpoint"
    type: "checkpoint"
    properties:
      checkpointElementId: "e2e00027-0000-4000-8000-000000000005"
      contextPath: "/chains/e2e00027-0000-4000-8000-000000000001/sessions/{checkpointSessionId}/checkpoint-elements/e2e00027-0000-4000-8000-000000000005/retry"
      externalRoute: false
      httpMethodRestrict: "POST"
  - id: "e2e00027-0000-4000-8000-000000000006"
    name: "Fail On Flag"
    type: "script"
    properties:
      script: "if (exchange.getMessage().getHeader('e2e-fail') == 'true') { throw new IllegalStateException('e2e checkpoint flag') }\n\
        exchange.getMessage().setBody('{\"checkpoint\":\"completed\"}')"
  dependencies:
  - from: "e2e00027-0000-4000-8000-000000000002"
    to: "e2e00027-0000-4000-8000-000000000003"
  - from: "e2e00027-0000-4000-8000-000000000003"
    to: "e2e00027-0000-4000-8000-000000000004"
  - from: "e2e00027-0000-4000-8000-000000000004"
    to: "e2e00027-0000-4000-8000-000000000005"
  - from: "e2e00027-0000-4000-8000-000000000005"
    to: "e2e00027-0000-4000-8000-000000000006"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

---
id: "e2e00005-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-choice"
description: "Tier-1 fixture for the deprecated Choice element. Its branches hang off the When and\
  \ the Otherwise as dependencies rather than as nested children: Choice is an old-style container,\
  \ and an import that nests the branch elements drops them, which the snapshot then reports as an\
  \ empty container."
content:
  labels: []
  elements:
  - id: "e2e00005-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-choice"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00005-0000-4000-8000-000000000003"
    name: "Choice"
    type: "choice"
    children:
    - id: "e2e00005-0000-4000-8000-000000000004"
      name: "When"
      type: "when"
      properties:
        condition: "${header[e2e-branch]} == 'when'"
        priorityNumber: 0
    - id: "e2e00005-0000-4000-8000-000000000006"
      name: "Otherwise"
      type: "otherwise"
  - id: "e2e00005-0000-4000-8000-000000000005"
    name: "When Branch"
    type: "script"
    properties:
      script: "exchange.getMessage().setBody('{\"branch\":\"when\"}')"
  - id: "e2e00005-0000-4000-8000-000000000007"
    name: "Otherwise Branch"
    type: "script"
    properties:
      script: "exchange.getMessage().setBody('{\"branch\":\"otherwise\"}')"
  dependencies:
  - from: "e2e00005-0000-4000-8000-000000000002"
    to: "e2e00005-0000-4000-8000-000000000003"
  - from: "e2e00005-0000-4000-8000-000000000004"
    to: "e2e00005-0000-4000-8000-000000000005"
  - from: "e2e00005-0000-4000-8000-000000000006"
    to: "e2e00005-0000-4000-8000-000000000007"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

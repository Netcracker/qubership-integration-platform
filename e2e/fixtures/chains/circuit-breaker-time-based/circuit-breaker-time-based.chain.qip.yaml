---
id: "e2e00021-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-circuit-breaker-time-based"
description: "Circuit Breaker with a time-based sliding window of five. The main script throws when the\
  \ e2e-fail header is true, and the fallback writes its own body, so the trace shows whether a\
  \ call reached the main branch or was short-circuited."
content:
  labels: []
  elements:
  - id: "e2e00021-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-circuit-breaker-time-based"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00021-0000-4000-8000-000000000003"
    name: "Circuit Breaker"
    type: "circuit-breaker-2"
    children:
    - id: "e2e00021-0000-4000-8000-000000000004"
      name: "Circuit Breaker Configuration"
      type: "circuit-breaker-configuration-2"
      properties:
        slidingWindowType: "TIME_BASED"
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        failureRateThreshold: 60
        waitDurationInOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: false
        permittedNumberOfCallsInHalfOpenState: 1
        slowCallDurationThreshold: 60
        slowCallRateThreshold: 100
      children:
      - id: "e2e00021-0000-4000-8000-000000000005"
        name: "Main Script"
        type: "script"
        properties:
          script: "if (exchange.getMessage().getHeader('e2e-fail') == 'true') throw new IllegalStateException('e2e\
            \ breaker failure')\nexchange.getMessage().setBody('{\"branch\":\"main\"}')"
    - id: "e2e00021-0000-4000-8000-000000000006"
      name: "On Fallback"
      type: "on-fallback-2"
      children:
      - id: "e2e00021-0000-4000-8000-000000000007"
        name: "Fallback Script"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"branch\":\"fallback\"}')"
  dependencies:
  - from: "e2e00021-0000-4000-8000-000000000002"
    to: "e2e00021-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

---
id: "e2e00018-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-condition-branches"
description: "Condition with two overlapping ifs and an else. The broad if comes first in the\
  \ document and last by priority, so a narrow value reaching the narrow branch proves priority\
  \ decides and document order does not."
content:
  labels: []
  elements:
  - id: "e2e00018-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-condition-branches"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00018-0000-4000-8000-000000000003"
    name: "Condition"
    type: "condition"
    children:
    - id: "e2e00018-0000-4000-8000-000000000004"
      name: "Broad If"
      type: "if"
      properties:
        condition: "${header[e2e-branch]} != null"
        priority: 10
      children:
      - id: "e2e00018-0000-4000-8000-000000000005"
        name: "Broad Branch"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"branch\":\"broad\"}')"
    - id: "e2e00018-0000-4000-8000-000000000006"
      name: "Narrow If"
      type: "if"
      properties:
        condition: "${header[e2e-branch]} == 'narrow'"
        priority: 1
      children:
      - id: "e2e00018-0000-4000-8000-000000000007"
        name: "Narrow Branch"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"branch\":\"narrow\"}')"
    - id: "e2e00018-0000-4000-8000-000000000008"
      name: "Else"
      type: "else"
      children:
      - id: "e2e00018-0000-4000-8000-000000000009"
        name: "Else Branch"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"branch\":\"else\"}')"
  dependencies:
  - from: "e2e00018-0000-4000-8000-000000000002"
    to: "e2e00018-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

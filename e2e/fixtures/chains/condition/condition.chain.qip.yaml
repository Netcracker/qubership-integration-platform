---
id: "e2e00004-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-condition"
description: "Tier-1 fixture for the Condition element. The branch is chosen by the e2e-branch\
  \ request header, and each branch writes its own body, so the response and the trace disagree\
  \ the moment an exchange takes the wrong one."
content:
  labels: []
  elements:
  - id: "e2e00004-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-condition"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00004-0000-4000-8000-000000000003"
    name: "Condition"
    type: "condition"
    children:
    - id: "e2e00004-0000-4000-8000-000000000004"
      name: "If"
      type: "if"
      properties:
        condition: "${header[e2e-branch]} == 'if'"
        priority: 0
      children:
      - id: "e2e00004-0000-4000-8000-000000000005"
        name: "If Branch"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"branch\":\"if\"}')"
    - id: "e2e00004-0000-4000-8000-000000000006"
      name: "Else"
      type: "else"
      children:
      - id: "e2e00004-0000-4000-8000-000000000007"
        name: "Else Branch"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"branch\":\"else\"}')"
  dependencies:
  - from: "e2e00004-0000-4000-8000-000000000002"
    to: "e2e00004-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

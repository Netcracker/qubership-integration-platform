---
id: "e2e00014-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-context-propagation"
description: "Tier-1 fixture for context propagation along a chain. A script writes an exchange\
  \ property and a header, a header modification runs between, and a later script reads both back\
  \ into the body, so the response goes wrong the moment the exchange context stops surviving a\
  \ step."
content:
  labels: []
  elements:
  - id: "e2e00014-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-context-propagation"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00014-0000-4000-8000-000000000003"
    name: "Write Context"
    type: "script"
    properties:
      script: "exchange.setProperty('e2eContext', 'property-survived'); exchange.getMessage().setHeader('e2e-context', 'header-survived')"
  - id: "e2e00014-0000-4000-8000-000000000004"
    name: "Header Modification"
    type: "header-modification"
    properties:
      headerModificationToAdd:
        e2e-hop: "{{RUN}}"
      headerModificationToRemove: []
  - id: "e2e00014-0000-4000-8000-000000000005"
    name: "Read Context"
    type: "script"
    properties:
      script: "exchange.getMessage().setBody('{\"property\":\"' + exchange.getProperty('e2eContext') + '\",\"header\":\"' + exchange.getMessage().getHeader('e2e-context') + '\"}')"
  dependencies:
  - from: "e2e00014-0000-4000-8000-000000000002"
    to: "e2e00014-0000-4000-8000-000000000003"
  - from: "e2e00014-0000-4000-8000-000000000003"
    to: "e2e00014-0000-4000-8000-000000000004"
  - from: "e2e00014-0000-4000-8000-000000000004"
    to: "e2e00014-0000-4000-8000-000000000005"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

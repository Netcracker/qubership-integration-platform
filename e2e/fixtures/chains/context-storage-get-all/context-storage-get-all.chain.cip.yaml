---
id: "e2e00056-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-context-storage-get-all"
description: "Calls the seeded context service. GET reads e2eKey, e2eKeyA, and e2eKeyB of the e2e-context-id header into the body."
content:
  labels: []
  elements:
  - id: "e2e00056-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-context-storage-get-all"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00056-0000-4000-8000-000000000003"
    name: "Get Context"
    type: "context-storage"
    properties:
      contextServiceId: "e2e00034-0000-4000-8000-000000000001"
      useCorrelationId: false
      contextId: "${header.e2e-context-id}"
      operation: "GET"
      keys: "e2eKey,e2eKeyA,e2eKeyB"
      target: "BODY"
  dependencies:
  - from: "e2e00056-0000-4000-8000-000000000002"
    to: "e2e00056-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

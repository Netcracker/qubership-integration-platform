---
id: "e2e00042-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-context-storage-set"
description: "Calls the seeded context service. SET stores the e2e-context-value header under the e2e-context-id header."
content:
  labels: []
  elements:
  - id: "e2e00042-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-context-storage-set"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00042-0000-4000-8000-000000000003"
    name: "Set Context"
    type: "context-storage"
    properties:
      contextServiceId: "e2e00034-0000-4000-8000-000000000001"
      useCorrelationId: false
      contextId: "${header.e2e-context-id}"
      operation: "SET"
      key: "e2eKey"
      value: "${header.e2e-context-value}"
      ttl: 600
  dependencies:
  - from: "e2e00042-0000-4000-8000-000000000002"
    to: "e2e00042-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

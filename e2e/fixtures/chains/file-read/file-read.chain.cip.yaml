---
id: "e2e00024-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-file-read"
description: "Reads the file the file-write fixture wrote, named after the run and the e2e-file\
  \ header, into the response body."
content:
  labels: []
  elements:
  - id: "e2e00024-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-file-read"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00024-0000-4000-8000-000000000003"
    name: "File Read"
    type: "file-read"
    properties:
      antInclude: "e2e-{{RUN}}-${header.e2e-file}"
  dependencies:
  - from: "e2e00024-0000-4000-8000-000000000002"
    to: "e2e00024-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

---
id: "e2e00002-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-http-out"
description: "The one seed chain that calls out. It exists so the tooling spec can prove the\
  \ testing service mocks an outbound call and steps out of the way once the mock is gone; every\
  \ other fixture here is deliberately call-free so the correlation header stays usable."
content:
  labels: []
  elements:
  - id: "e2e00002-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-http-out"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00002-0000-4000-8000-000000000003"
    name: "HTTP Sender"
    type: "http-sender"
    properties:
      uri: "http://qip-runtime-catalog:8080/actuator/health"
      httpMethod: "GET"
      isExternalCall: false
      m2m: false
      reuseEstablishedConnection: true
      propagateContext: false
      receiveCorrelationId: false
  dependencies:
  - from: "e2e00002-0000-4000-8000-000000000002"
    to: "e2e00002-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

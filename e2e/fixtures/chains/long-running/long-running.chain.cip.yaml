---
id: "e2e00016-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-long-running"
description: "The one fixture that stays in flight long enough to be observed. A Groovy script\
  \ holds the exchange for the number of milliseconds the e2e-hold-ms header names, so a live\
  \ exchange can be asserted present, then absent, and killed while it is running."
content:
  labels: []
  elements:
  - id: "e2e00016-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-long-running"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00016-0000-4000-8000-000000000003"
    name: "Hold"
    type: "script"
    properties:
      # The hold is a header rather than a constant so one deployment serves both a call that has
      # to be caught mid-flight and a call that has to finish. It is capped: a fixture that can be
      # asked to hold forever ties up an engine thread for the rest of the run.
      script: |-
        def requested = exchange.getMessage().getHeader('e2e-hold-ms')
        long ms = requested == null ? 0L : Math.min(Long.parseLong(requested.toString()), 60000L)
        Thread.sleep(ms)
        exchange.getMessage().setBody('{"element":"long-running","heldMs":' + ms + '}')
  dependencies:
  - from: "e2e00016-0000-4000-8000-000000000002"
    to: "e2e00016-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

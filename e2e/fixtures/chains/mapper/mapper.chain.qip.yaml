$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-mapper"
description: "Tier-1 fixture for the Mapper element. The mapping writes one constant into a target\
  \ header, which is the smallest shape that needs no imported specification and still proves the\
  \ mapper processor ran."
content:
  labels: []
  elements:
  - id: "e2e00008-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-mapper"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00008-0000-4000-8000-000000000003"
    name: "Mapper"
    type: "mapper-2"
    properties:
      throwException: true
      mappingDescription:
        source:
          headers: []
          properties: []
        target:
          headers:
          - id: "e2e00008-attr-mapped"
            name: "e2e-mapped"
            type:
              name: "string"
          properties: []
          body:
            name: "object"
            schema:
              id: "e2e00008-body-schema"
              attributes:
              - id: "e2e00008-attr-body"
                name: "mapped"
                type:
                  name: "string"
        constants:

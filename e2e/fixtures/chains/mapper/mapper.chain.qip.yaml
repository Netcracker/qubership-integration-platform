        actions:
        - id: "e2e00008-action-1"
          sources:
          - type: "constant"
            constantId: "e2e00008-const-1"
          target:
            type: "attribute"
            kind: "header"
            path:
            - "e2e00008-attr-mapped"
        - id: "e2e00008-action-2"
          sources:
          - type: "constant"
            constantId: "e2e00008-const-1"
          target:
            type: "attribute"
            kind: "body"
            path:
            - "e2e00008-attr-body"
  dependencies:
  - from: "e2e00008-0000-4000-8000-000000000002"
    to: "e2e00008-0000-4000-8000-000000000003"

---
id: "e2e0004c-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-mcp-trigger-idempotency-throw-exception"
description: "An MCP tool with idempotency/actionOnDuplicate=throw-exception. It keys on the tool's arguments, because a tool call carries no header the key could come from."
content:
  labels: []
  elements:
  - id: "e2e0004c-0000-4000-8000-000000000002"
    name: "idempotency/actionOnDuplicate=throw-exception"
    type: "mcp-trigger"
    properties:
      mcpServiceIds:
      - "e2e00035-0000-4000-8000-000000000001"
      name: "e2e-{{RUN}}-mcp-trigger-idempotency-throw-exception"
      description: "Answers whether the idempotency check let the call through"
      inputSchema: "{\"type\": \"object\", \"properties\": {\"key\": {\"type\": \"string\"}}, \"required\": [\"key\"]}"
      idempotency:
        enabled: true
        contextExpression: "e2e"
        keyExpiry: 600
        keyExpression: "${body}"
        actionOnDuplicate: "throw-exception"
  - id: "e2e0004c-0000-4000-8000-000000000003"
    name: "Downstream Reply"
    type: "script"
    properties:
      script: "exchange.getMessage().setBody('{\"called\":\"downstream\"}')"
  dependencies:
  - from: "e2e0004c-0000-4000-8000-000000000002"
    to: "e2e0004c-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

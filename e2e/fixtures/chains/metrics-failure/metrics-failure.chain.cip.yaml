---
id: "e2e00040-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-metrics-failure"
description: "A chain only metrics.spec.ts calls, so each of its failures moves the failure counter by one."
content:
  labels: []
  elements:
  - id: "e2e00040-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-metrics-failure"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00040-0000-4000-8000-000000000003"
    name: "Failing Script"
    type: "script"
    properties:
      script: "throw new IllegalStateException('metrics failure')"
  dependencies:
  - from: "e2e00040-0000-4000-8000-000000000002"
    to: "e2e00040-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

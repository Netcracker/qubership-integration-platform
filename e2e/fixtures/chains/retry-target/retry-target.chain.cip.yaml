---
id: "e2e00050-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-retry-target"
description: "Counts its calls under the e2e-context-id header in the seeded context service and fails the first two, so a retrying caller succeeds on the third attempt."
content:
  labels: []
  elements:
  - id: "e2e00050-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-retry-target"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00050-0000-4000-8000-000000000003"
    name: "Get Attempts"
    type: "context-storage"
    properties:
      contextServiceId: "e2e00034-0000-4000-8000-000000000001"
      useCorrelationId: false
      contextId: "${header.e2e-context-id}"
      operation: "GET"
      keys: "e2eAttempts"
      target: "PROPERTY"
      targetName: "e2eStored"
      unwrap: true
  - id: "e2e00050-0000-4000-8000-000000000004"
    name: "Count Attempt"
    type: "script"
    properties:
      # The unwrapped value is a string, or null before the first SET.
      script: "exchange.setProperty('e2eAttempts', ((exchange.getProperty('e2eStored') ?: '0') as Integer) + 1)"
  - id: "e2e00050-0000-4000-8000-000000000005"
    name: "Save Attempts"
    type: "context-storage"
    properties:
      contextServiceId: "e2e00034-0000-4000-8000-000000000001"
      useCorrelationId: false
      contextId: "${header.e2e-context-id}"
      operation: "SET"
      key: "e2eAttempts"
      value: "${exchangeProperty.e2eAttempts}"
      ttl: 600
  - id: "e2e00050-0000-4000-8000-000000000006"
    name: "Fail Before Third"
    type: "script"
    properties:
      # The SET above commits before this throws, so the count survives a failed attempt.
      script: |-
        int attempts = exchange.getProperty('e2eAttempts') as Integer
        if (attempts < 3) throw new IllegalStateException('e2e retry target fails attempt ' + attempts)
        exchange.getMessage().setBody('{"attempts":' + attempts + '}')
  dependencies:
  - from: "e2e00050-0000-4000-8000-000000000002"
    to: "e2e00050-0000-4000-8000-000000000003"
  - from: "e2e00050-0000-4000-8000-000000000003"
    to: "e2e00050-0000-4000-8000-000000000004"
  - from: "e2e00050-0000-4000-8000-000000000004"
    to: "e2e00050-0000-4000-8000-000000000005"
  - from: "e2e00050-0000-4000-8000-000000000005"
    to: "e2e00050-0000-4000-8000-000000000006"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

---
id: "e2e00012-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-reuse"
description: "Tier-1 fixture for the Reuse element and the reference that enters it. The reference\
  \ is called twice from one flow, so the trace shows the reused branch running once per reference\
  \ rather than once per chain."
content:
  labels: []
  elements:
  - id: "e2e00012-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-reuse"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00012-0000-4000-8000-000000000003"
    name: "Reuse Reference"
    type: "reuse-reference"
    properties:
      reuseElementId: "e2e00012-0000-4000-8000-000000000005"
  - id: "e2e00012-0000-4000-8000-000000000004"
    name: "Report"
    type: "script"
    properties:
      script: "exchange.getMessage().setBody('{\"reused\":' + exchange.getProperty('e2eReuseCount') + '}')"
  - id: "e2e00012-0000-4000-8000-000000000005"
    name: "Reuse"
    type: "reuse"
    children:
    - id: "e2e00012-0000-4000-8000-000000000006"
      name: "Reused Script"
      type: "script"
      properties:
        script: "exchange.setProperty('e2eReuseCount', ((exchange.getProperty('e2eReuseCount') ?: 0) as int) + 1)"
  dependencies:
  - from: "e2e00012-0000-4000-8000-000000000002"
    to: "e2e00012-0000-4000-8000-000000000003"
  - from: "e2e00012-0000-4000-8000-000000000003"
    to: "e2e00012-0000-4000-8000-000000000004"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

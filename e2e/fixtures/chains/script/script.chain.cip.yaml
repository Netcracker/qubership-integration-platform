---
id: "e2e00003-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-script"
description: "Tier-1 fixture for the Script element. One Groovy script replaces the body, so the\
  \ response says whether the script ran and the trace says the step was reached."
content:
  labels: []
  elements:
  - id: "e2e00003-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-script"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00003-0000-4000-8000-000000000003"
    name: "Script"
    type: "script"
    properties:
      script: "exchange.getMessage().setBody('{\"element\":\"script\",\"ran\":true}')"
  dependencies:
  - from: "e2e00003-0000-4000-8000-000000000002"
    to: "e2e00003-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

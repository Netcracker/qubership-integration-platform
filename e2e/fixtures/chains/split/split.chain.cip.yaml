---
id: "e2e00006-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-split"
description: "Tier-1 fixture for the Split element. Two branches run in parallel, the main branch\
  \ writes the response and the secondary branch propagates a header back, so the trace shows both\
  \ ran and the response shows which one the aggregation kept."
content:
  labels: []
  elements:
  - id: "e2e00006-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-split"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00006-0000-4000-8000-000000000003"
    name: "Split"
    type: "split-2"
    properties:
      aggregationStrategy: "chainsAggregationStrategy"
      stopOnException: true
      timeout: 0
    children:
    - id: "e2e00006-0000-4000-8000-000000000004"
      name: "Main Branch"
      type: "main-split-element-2"
      properties:
        splitName: "main"
      children:
      - id: "e2e00006-0000-4000-8000-000000000005"
        name: "Main Script"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"branch\":\"main\"}')"
    - id: "e2e00006-0000-4000-8000-000000000006"
      name: "Aux Branch"
      type: "split-element-2"
      properties:
        splitName: "aux"
        propagateHeaders: true
        propagateProperties: false
      children:
      - id: "e2e00006-0000-4000-8000-000000000007"
        name: "Aux Script"
        type: "script"
        properties:
          script: "exchange.getMessage().setHeader('e2e-aux', 'ran')"
  dependencies:
  - from: "e2e00006-0000-4000-8000-000000000002"
    to: "e2e00006-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

---
id: "e2e00019-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-try-catch-finally-branches"
description: "Try-Catch-Finally whose try throws what the e2e-throw header names. The broad catch\
  \ comes first in the document and last by priority, and a checked exception matches neither\
  \ catch, so each value leaves a different trace."
content:
  labels: []
  elements:
  - id: "e2e00019-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-try-catch-finally-branches"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00019-0000-4000-8000-000000000003"
    name: "Try-Catch-Finally"
    type: "try-catch-finally-2"
    children:
    - id: "e2e00019-0000-4000-8000-000000000004"
      name: "Try"
      type: "try-2"
      children:
      - id: "e2e00019-0000-4000-8000-000000000005"
        name: "Try Script"
        type: "script"
        properties:
          script: "switch (exchange.getMessage().getHeader('e2e-throw')) {\n  case 'argument':\
            \ throw new IllegalArgumentException('e2e argument')\n  case 'state': throw new IllegalStateException('e2e\
            \ state')\n  case 'checked': throw new java.io.IOException('e2e checked')\n}\nexchange.getMessage().setBody('{\"\
            try\":\"completed\"}')"
    - id: "e2e00019-0000-4000-8000-000000000006"
      name: "Runtime Catch"
      type: "catch-2"
      properties:
        exception: "java.lang.RuntimeException"
        priority: 10
      children:
      - id: "e2e00019-0000-4000-8000-000000000007"
        name: "Runtime Catch Branch"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"caught\":\"runtime\"}')"
    - id: "e2e00019-0000-4000-8000-000000000008"
      name: "Argument Catch"
      type: "catch-2"
      properties:
        exception: "java.lang.IllegalArgumentException"
        priority: 1
      children:
      - id: "e2e00019-0000-4000-8000-000000000009"
        name: "Argument Catch Branch"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"caught\":\"argument\"}')"
    - id: "e2e00019-0000-4000-8000-000000000010"
      name: "Finally"
      type: "finally-2"
      children:
      - id: "e2e00019-0000-4000-8000-000000000011"
        name: "Finally Branch"
        type: "header-modification"
        properties:
          headerModificationToAdd:
            e2e-finally: "ran"
          headerModificationToRemove: []
  dependencies:
  - from: "e2e00019-0000-4000-8000-000000000002"
    to: "e2e00019-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

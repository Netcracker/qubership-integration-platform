---
id: "e2e00009-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-try-catch-finally"
description: "Tier-1 fixture for Try-Catch-Finally. The try branch throws, so a green run proves\
  \ the catch branch handled it and the finally branch ran afterwards."
content:
  labels: []
  elements:
  - id: "e2e00009-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-try-catch-finally"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e00009-0000-4000-8000-000000000003"
    name: "Try-Catch-Finally"
    type: "try-catch-finally-2"
    children:
    - id: "e2e00009-0000-4000-8000-000000000004"
      name: "Try"
      type: "try-2"
      children:
      - id: "e2e00009-0000-4000-8000-000000000005"
        name: "Throwing Script"
        type: "script"
        properties:
          script: "throw new IllegalStateException('e2e fixture failure')"
    - id: "e2e00009-0000-4000-8000-000000000006"
      name: "Catch"
      type: "catch-2"
      properties:
        exception: "java.lang.Exception"
        priority: 0
      children:
      - id: "e2e00009-0000-4000-8000-000000000007"
        name: "Catch Branch"
        type: "script"
        properties:
          script: "exchange.getMessage().setBody('{\"handled\":true}')"
    - id: "e2e00009-0000-4000-8000-000000000008"
      name: "Finally"
      type: "finally-2"
      children:
      - id: "e2e00009-0000-4000-8000-000000000009"
        name: "Finally Branch"
        type: "header-modification"
        properties:
          headerModificationToAdd:
            e2e-finally: "ran"
          headerModificationToRemove: []
  dependencies:
  - from: "e2e00009-0000-4000-8000-000000000002"
    to: "e2e00009-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e50016-0000-4000-8000-000000000003"
    name: "Empty Script"
    type: "script"
    properties:
      script: "   "
  dependencies:
  - from: "e2e50016-0000-4000-8000-000000000002"
    to: "e2e50016-0000-4000-8000-000000000003"

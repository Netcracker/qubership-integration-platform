id: "e2e50002-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-script-exchange-body"
description: "The Script element reading and writing the body as each type it can hold. One ladder\
  \ of scripts: the request arrives as a stream, and every step records the class it was handed\
  \ before writing the next type through setBody. The step in front of the ladder writes nothing\
  \ and only evaluates to a value, because the <script> EIP discards it."
content:
  labels: []
  elements:
  - id: "e2e50002-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-script-exchange-body"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e50002-0000-4000-8000-000000000003"
    name: "Return Only"
    type: "script"
    properties:
      # Textually unique within this chain: the engine caches a compiled script per chain, keyed
      # on its trimmed source, so two identical scripts here would share one compiled class and an
      # assertion about one could be met by the compilation of the other. Do not deduplicate these.
      script: |-
        // script-exchange-body/return-only
        // The <script> EIP discards what a script evaluates to, so this value never reaches the
        // body and the step after it still sees the request. Every other script writes through
        // setBody for that reason.
        '{"returned":"discarded"}'
  - id: "e2e50002-0000-4000-8000-000000000004"
    name: "Read Inbound"
    type: "script"
    properties:
      script: |-
        // script-exchange-body/read-inbound
        // The request body is a stream cache rather than a String, which is what the ladder below
        // is about: the first read is a conversion.
        exchange.getIn().setHeader('e2e-read-1', exchange.getIn().getBody().getClass().getName())
        exchange.getIn().setBody(exchange.getIn().getBody(String.class))
  - id: "e2e50002-0000-4000-8000-000000000005"
    name: "As Bytes"
    type: "script"
    properties:
      script: |-
        // script-exchange-body/as-bytes
        exchange.getIn().setHeader('e2e-read-2', exchange.getIn().getBody().getClass().getName())
        exchange.getIn().setBody(exchange.getIn().getBody(String.class).getBytes('UTF-8'))
  - id: "e2e50002-0000-4000-8000-000000000006"
    name: "As Stream"
    type: "script"
    properties:
      script: |-
        // script-exchange-body/as-stream
        // A ByteArrayInputStream rather than any stream: the debugger reads the body twice per
        // step and resets it afterwards, and reset() is what makes that harmless here.
        exchange.getIn().setHeader('e2e-read-3', exchange.getIn().getBody().getClass().getName())
        exchange.getIn().setBody(new java.io.ByteArrayInputStream(exchange.getIn().getBody()))
  - id: "e2e50002-0000-4000-8000-000000000007"
    name: "As Map"
    type: "script"
    properties:
      script: |-
        // script-exchange-body/as-map
        exchange.getIn().setHeader('e2e-read-4', exchange.getIn().getBody().getClass().getName())
        exchange.getIn().setBody([text: exchange.getIn().getBody(String.class)])
  - id: "e2e50002-0000-4000-8000-000000000008"
    name: "As List"
    type: "script"
    properties:
      script: |-
        // script-exchange-body/as-list
        def carried = exchange.getIn().getBody()
        exchange.getIn().setHeader('e2e-read-5', carried.getClass().getName())
        exchange.getIn().setBody([carried.get('text'), 'e2e-list'])
  - id: "e2e50002-0000-4000-8000-000000000009"
    name: "Report"
    type: "script"
    properties:
      script: |-
        // script-exchange-body/report
        def carried = exchange.getIn().getBody()
        exchange.getIn().setHeader('e2e-read-6', carried.getClass().getName())
        exchange.getIn().setBody('{"text":"' + carried.get(0) + '","marker":"' + carried.get(1) + '"}')
  dependencies:
  - from: "e2e50002-0000-4000-8000-000000000002"
    to: "e2e50002-0000-4000-8000-000000000003"
  - from: "e2e50002-0000-4000-8000-000000000003"
    to: "e2e50002-0000-4000-8000-000000000004"
  - from: "e2e50002-0000-4000-8000-000000000004"
    to: "e2e50002-0000-4000-8000-000000000005"
  - from: "e2e50002-0000-4000-8000-000000000005"
    to: "e2e50002-0000-4000-8000-000000000006"
  - from: "e2e50002-0000-4000-8000-000000000006"
    to: "e2e50002-0000-4000-8000-000000000007"
  - from: "e2e50002-0000-4000-8000-000000000007"
    to: "e2e50002-0000-4000-8000-000000000008"
  - from: "e2e50002-0000-4000-8000-000000000008"
    to: "e2e50002-0000-4000-8000-000000000009"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

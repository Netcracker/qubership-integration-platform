id: "e2e50013-0000-4000-8000-000000000001"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "e2e-{{RUN}}-script-failures-caught"
description: "A script that dereferences null inside a Try branch. The catch branch reads\
  \ CamelExceptionCaught and reports the class and the message the Groovy runtime raised, so the\
  \ case can assert which exception was caught rather than only that something was."
content:
  labels: []
  elements:
  - id: "e2e50013-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-script-failures-caught"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e50013-0000-4000-8000-000000000003"
    name: "Try-Catch-Finally"
    type: "try-catch-finally-2"
    children:
    - id: "e2e50013-0000-4000-8000-000000000004"
      name: "Try"
      type: "try-2"
      children:
      - id: "e2e50013-0000-4000-8000-000000000005"
        name: "Dereference Null"
        type: "script"
        properties:
          script: |-
            // script-failures-caught/dereference-null
            def absent = null
            exchange.getIn().setBody(absent.someProperty)
    - id: "e2e50013-0000-4000-8000-000000000006"
      name: "Catch"
      type: "catch-2"
      properties:
        exception: "java.lang.Exception"
        priority: 0
      children:
      - id: "e2e50013-0000-4000-8000-000000000007"
        name: "Report Caught"
        type: "script"
        properties:
          script: |-
            // script-failures-caught/report-caught
            def caught = exchange.getProperty('CamelExceptionCaught')
            exchange.getIn().setHeader('e2e-caught-class', caught?.getClass()?.getName())
            exchange.getIn().setBody(groovy.json.JsonOutput.toJson([caught: caught?.getMessage()]))
    - id: "e2e50013-0000-4000-8000-000000000008"
      name: "Finally"
      type: "finally-2"
      children:
      - id: "e2e50013-0000-4000-8000-000000000009"
        name: "Finally Branch"
        type: "header-modification"
        properties:
          headerModificationToAdd:
            e2e-caught-finally: "ran"
          headerModificationToRemove: []
  dependencies:
  - from: "e2e50013-0000-4000-8000-000000000002"
    to: "e2e50013-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

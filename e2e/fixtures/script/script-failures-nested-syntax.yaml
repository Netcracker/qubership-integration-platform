id: "e2e50019-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-script-failures-nested-syntax"
description: "The same syntax error, one container deeper and with no script anywhere else in the\
  \ chain. Both engines iterate the deployment's outputs without recursing, so the question is\
  \ whether a nested script is compiled at deploy at all; the catalog emits every element as its own\
  \ Camel route, which is what makes a nested element a top-level output of one. Owned by\
  \ specs/runtime/script-failures.spec.ts."
content:
  labels: []
  elements:
  - id: "e2e50019-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-script-failures-nested-syntax"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e50019-0000-4000-8000-000000000003"
    name: "Try-Catch-Finally"
    type: "try-catch-finally-2"
    children:
    - id: "e2e50019-0000-4000-8000-000000000004"
      name: "Try"
      type: "try-2"
      children:
      - id: "e2e50019-0000-4000-8000-000000000005"
        name: "Nested Unbalanced Script"
        type: "script"
        properties:
          script: |-
            // script-failures-nested-syntax/unbalanced
            def alsoBroken = [1, 2
    - id: "e2e50019-0000-4000-8000-000000000006"
      name: "Catch"
      type: "catch-2"
      properties:
        exception: "java.lang.Exception"
        priority: 0
      children:
      - id: "e2e50019-0000-4000-8000-000000000007"
        name: "Catch Branch"
        type: "header-modification"
        properties:
          headerModificationToAdd:
            e2e-nested-caught: "ran"
          headerModificationToRemove: []
    - id: "e2e50019-0000-4000-8000-000000000008"
      name: "Finally"
      type: "finally-2"
      children:
      - id: "e2e50019-0000-4000-8000-000000000009"
        name: "Finally Branch"
        type: "header-modification"
        properties:
          headerModificationToAdd:
            e2e-nested-finally: "ran"
          headerModificationToRemove: []
  dependencies:
  - from: "e2e50019-0000-4000-8000-000000000002"
    to: "e2e50019-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

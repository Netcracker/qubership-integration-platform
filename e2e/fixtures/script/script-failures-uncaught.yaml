id: "e2e50014-0000-4000-8000-000000000001"
$schema: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain"
name: "e2e-{{RUN}}-script-failures-uncaught"
description: "A script that throws with nothing to catch it, which is what a chain failure looks\
  \ like from outside. The header the step sets before it throws is what separates a script that ran\
  \ and failed from one that never started."
content:
  labels: []
  elements:
  - id: "e2e50014-0000-4000-8000-000000000002"
    name: "HTTP Trigger"
    type: "http-trigger"
    properties:
      contextPath: "e2e-{{RUN}}-script-failures-uncaught"
      httpMethodRestrict: "POST"
      accessControlType: "NONE"
      externalRoute: false
      validateRequest: false
      handleValidationAction: "default"
      handleChainFailureAction: "default"
      correlationId: false
      isExternalContextPath: false
  - id: "e2e50014-0000-4000-8000-000000000003"
    name: "Throw Uncaught"
    type: "script"
    properties:
      script: |-
        // script-failures-uncaught/throw-uncaught
        exchange.getIn().setHeader('e2e-reached', 'before-the-throw')
        throw new IllegalStateException('e2e uncaught script failure')
  dependencies:
  - from: "e2e50014-0000-4000-8000-000000000002"
    to: "e2e50014-0000-4000-8000-000000000003"
  deployAction: "NONE"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

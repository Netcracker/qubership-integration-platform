asyncapi: 2.6.0
info:
  title: E2E AsyncAPI Kafka Inline Payload Reference
  version: 1.0.0
servers:
  production:
    url: kafka:29092
    protocol: kafka
channels:
  e2e-{{RUN}}-async-api-kafka-inline-ref:
    subscribe:
      operationId: e2eAsyncApiKafkaInlineRef
      message:
        payload:
          $ref: '#/components/schemas/OrderShipped'
components:
  schemas:
    OrderShipped:
      type: object
      required: [orderId, address]
      properties:
        orderId:
          type: string
        address:
          $ref: '#/components/schemas/Address'
    Address:
      type: object
      required: [city]
      properties:
        city:
          type: string

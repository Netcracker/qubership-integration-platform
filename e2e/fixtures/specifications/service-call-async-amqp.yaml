asyncapi: 3.0.0
info:
  title: E2E Service Call AMQP
  version: 1.0.0
servers:
  production:
    host: rabbitmq:5672
    protocol: amqp
channels:
  e2eServiceCallAmqpSendChannel:
    address: e2e-{{RUN}}-service-call-amqp-send
    messages:
      Ping:
        payload:
          type: object
          properties:
            ping:
              type: string
  e2eServiceCallAmqpReceiveChannel:
    address: e2e-{{RUN}}-service-call-amqp-receive
    messages:
      Ping:
        payload:
          type: object
          properties:
            ping:
              type: string
operations:
  e2eServiceCallAmqpSend:
    action: send
    channel:
      $ref: '#/channels/e2eServiceCallAmqpSendChannel'
  e2eServiceCallAmqpReceive:
    action: receive
    channel:
      $ref: '#/channels/e2eServiceCallAmqpReceiveChannel'

# The document widgets.api.yaml points at: version 1.0.0, three operations over two paths.
openapi: 3.0.3
info:
  title: E2E Widgets API
  version: 1.0.0
paths:
  /widgets:
    get:
      operationId: listWidgets
      responses:
        "200":
          description: every widget
    post:
      operationId: createWidget
      responses:
        "201":
          description: the widget that was created
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: one widget

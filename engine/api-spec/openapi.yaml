openapi: 3.1.0
info:
  contact:
    email: opensourcegroup@netcracker.com
    name: Netcracker Opensource Group
  description: REST API of Cloud Integration Platform Engine microservice
  title: Cloud Integration Platform Engine
  version: v1
  x-api-kind: no-bwc
servers:
- url: /
security:
- BearerAuth: []
tags:
- description: Checkpoint Session Controller
  name: checkpoint-session-controller
- description: Live Exchanges Controller
  name: live-exchanges-controller
- description: Session Controller
  name: session-controller
paths:
  /v1/engine/chains/{chainId}/sessions/failed:
    get:
      description: List all failed sessions with available checkpoints for specified
        chain
      operationId: getFailedChainSessionsInfo
      parameters:
      - description: Chain id
        in: path
        name: chainId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckpointSessionDTO"
          description: OK
      tags:
      - checkpoint-session-controller
      x-api-kind: bwc
  /v1/engine/chains/{chainId}/sessions/{sessionId}/checkpoint-elements/{checkpointElementId}/retry:
    post:
      description: Execute chain retry from specified non-failed checkpoint
      operationId: retryFromCheckpoint
      parameters:
      - description: Chain id
        in: path
        name: chainId
        required: true
        schema:
          type: string
      - description: Session id
        in: path
        name: sessionId
        required: true
        schema:
          type: string
      - description: Checkpoint element id (could be found on chain graph in checkpoint
          element itself)
        in: path
        name: checkpointElementId
        required: true
        schema:
          type: string
      - description: "If passed, Authorization header will be replaced with this value"
        in: header
        name: authorization
        required: false
        schema:
          type: string
          default: ""
      - description: "Enable TraceMe header, which will force session to be logged"
        in: header
        name: traceMe
        required: false
        schema:
          type: boolean
          default: false
      - description: "Idempotency header, which will be used to identify duplicate\
          \ request"
        in: header
        name: X-Idempotency-Key
        required: false
        schema:
          type: string
          default: ""
      requestBody:
        content:
          application/json:
            schema:
              type: string
              description: "If passed, request body will be replaced with this value"
      responses:
        "200":
          description: OK
      tags:
      - checkpoint-session-controller
      x-api-kind: bwc
  /v1/engine/chains/{chainId}/sessions/{sessionId}/retry:
    post:
      description: Execute chain retry from saved latest non-failed checkpoint
      operationId: retryFromLastCheckpoint
      parameters:
      - description: Chain id
        in: path
        name: chainId
        required: true
        schema:
          type: string
      - description: Session id
        in: path
        name: sessionId
        required: true
        schema:
          type: string
      - description: "If passed, Authorization header will be replaced with this value"
        in: header
        name: authorization
        required: false
        schema:
          type: string
          default: ""
      - description: "Enable TraceMe header, which will force session to be logged"
        in: header
        name: traceMe
        required: false
        schema:
          type: boolean
          default: false
      - description: "Idempotency header, which will be used to identify duplicate\
          \ request"
        in: header
        name: X-Idempotency-Key
        required: false
        schema:
          type: string
          default: ""
      requestBody:
        content:
          application/json:
            schema:
              type: string
              description: "If passed, request body will be replaced with this value"
      responses:
        "200":
          description: OK
      tags:
      - checkpoint-session-controller
      x-api-kind: bwc
  /v1/engine/live-exchanges:
    get:
      description: Get top N running exchanges ordered by execution time DESC
      operationId: getLiveExchanges
      parameters:
      - description: Amount of exchanges to view
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          exclusiveMinimum: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveExchangeDTO"
          description: OK
      tags:
      - live-exchanges-controller
  /v1/engine/live-exchanges/{deploymentId}/{exchangeId}:
    delete:
      description: Try to kill specified exchange
      operationId: killExchange
      parameters:
      - description: Deployment ID
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: Exchange ID
        in: path
        name: exchangeId
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      tags:
      - live-exchanges-controller
  /v1/engine/sessions:
    get:
      description: List all sessions with available checkpoints by their ids
      operationId: findSessions
      parameters:
      - description: List of the session ids separated by comma
        in: query
        name: ids
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckpointSessionDTO"
          description: OK
      tags:
      - session-controller
components:
  schemas:
    CheckpointDTO:
      type: object
      description: Information about checkpoint in session
      properties:
        checkpointElementId:
          type: string
          description: Element id of passed checkpoint on chain graph
        id:
          type: string
          description: Internal id of this record
        timestamp:
          type: string
          description: Timestamp when checkpoint were passed
    CheckpointSessionDTO:
      type: object
      description: Single chain session with available checkpoints list
      properties:
        chainId:
          type: string
          description: Id of the chain it was executed on
        chainName:
          type: string
          description: Name of the chain it was executed on
        checkpoints:
          type: array
          description: List of available checkpoints for that session
          items:
            $ref: "#/components/schemas/CheckpointDTO"
        correlationId:
          type: string
          description: Correlation id for that execution (if it was set)
        duration:
          type: integer
          format: int64
          description: "Duration of session execution, in ms"
        engineAddress:
          type: string
          description: engine pod ip address on which chain was executed
        executionStatus:
          type: string
          description: Session execution status
          enum:
          - IN_PROGRESS
          - COMPLETED_NORMALLY
          - COMPLETED_WITH_WARNINGS
          - COMPLETED_WITH_ERRORS
          - CANCELLED_OR_UNKNOWN
        finished:
          type: string
          description: Date time of session end
        id:
          type: string
          description: Id of the session
        loggingLevel:
          type: string
          description: Value of logging level on a chain at a time chain was executed
        snapshotName:
          type: string
          description: Deployed snapshot name for the chain
        started:
          type: string
          description: Date time of session start
    LiveExchangeDTO:
      type: object
      description: Information about Live exchange
      properties:
        chainId:
          type: string
          description: Chain id
        deploymentId:
          type: string
          description: Deployment id
        duration:
          type: integer
          format: int64
          description: "Duration of current exchange, in ms"
        exchangeId:
          type: string
          description: Exchange id
        main:
          type: boolean
          description: Is current exchange main (initial)
        sessionDuration:
          type: integer
          format: int64
          description: "Duration of the whole session exchange participates in, in\
            \ ms"
        sessionId:
          type: string
          description: Session id
        sessionLogLevel:
          type: string
          description: Current session log level
          enum:
          - "OFF"
          - ERROR
          - INFO
          - DEBUG
        sessionStartTime:
          type: integer
          format: int64
          description: Session start timestamp
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http

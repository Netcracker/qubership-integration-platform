services:
  qip-ai-service:
    environment:
      QIP_AI_A2A_ENABLED: ${QIP_AI_A2A_ENABLED:-true}
      QIP_AI_A2A_PUBLIC_BASE_URL: ${QIP_AI_A2A_PUBLIC_BASE_URL:-http://qip-ai-service:8080}
      QIP_AI_A2A_LOG_INBOUND_PAYLOAD: ${QIP_AI_A2A_LOG_INBOUND_PAYLOAD:-true}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/ai_a2a
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
    depends_on:
      postgres:
        condition: service_healthy

  qip-adk-web:
    build:
      context: ../tools/a2a-lab/adk
      dockerfile: Dockerfile
    container_name: qip-adk-web
    profiles: [a2a-lab]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ai-service-dev.env
      - .env.local
    environment:
      QIP_A2A_AGENT_CARD_URL: http://qip-ai-service:8080/.well-known/agent-card.json
    depends_on:
      qip-ai-service:
        condition: service_healthy
    networks:
      default:
        aliases:
          - adk-web

  qip-a2a-inspector:
    build:
      context: ../tools/a2a-lab/inspector
      dockerfile: Dockerfile
      additional_contexts:
        inspector_source: https://github.com/zeroasterisk/a2a-inspector.git#b82c98c8c54c24e32815eed084c50c9434e18f9e
    container_name: qip-a2a-inspector
    profiles: [a2a-lab]
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      default:
        aliases:
          - a2a-inspector

services:
  recovery-ai:
    image: ${RECOVERY_AI_IMAGE:?Set the candidate AI-service image}
    env_file:
      - path: ${RECOVERY_SERVICE_ENV_FILE:?Set the private runtime environment file}
        format: raw
    environment:
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://recovery-db:5432/ai_recovery
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      MINIO_ENDPOINT: http://recovery-storage:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      STORAGE_BUCKET_NAME: recovery-evidence
      STORAGE_INIT_BUCKET_ON_STARTUP: "true"
      QIP_E2E_RECOVERY_FAULT_CHAIN_PREFIX: ""
      QIP_E2E_RECOVERY_FAULT_PLAN: ""
      QIP_E2E_RECOVERY_CONTROL_DIRECTORY: /recovery-control
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ${RECOVERY_CONTROL_DIRECTORY:?Set the owned control directory}:/recovery-control
    networks: [private, dependencies]
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      recovery-db:
        condition: service_healthy
      recovery-storage:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl --silent --fail localhost:8080/q/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  recovery-db:
    image: ${RECOVERY_POSTGRES_IMAGE:-postgres}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_recovery
    networks: [private]
    volumes:
      - recovery-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ai_recovery"]
      interval: 2s
      timeout: 5s
      retries: 30

  recovery-storage:
    image: ${RECOVERY_STORAGE_IMAGE:-minio/minio:latest}
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks: [private]
    ports:
      - "127.0.0.1::9000"
    volumes:
      - recovery-storage:/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS localhost:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  private:
  dependencies:
    external: true
    name: ${RECOVERY_SHARED_NETWORK:?Set the existing dependency network}

volumes:
  recovery-db:
  recovery-storage:

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [ "configmaps", "services", "integrations" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete", "deletecollection" ]
  - apiGroups: [ "camel.apache.org" ]
    resources: [ "integrations" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete", "deletecollection" ]
  - apiGroups: [ "monitoring.coreos.com" ]
    resources: [ "servicemonitors" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete", "deletecollection" ]
  - apiGroups: [ "gateway.networking.k8s.io" ]
    resources: [ "httproutes" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete", "deletecollection" ]
  - apiGroups: ["networking.istio.io"]
    resources: ["serviceentries", "destinationrules"]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete", "deletecollection" ]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["cip-secured-variables-reader"]
    verbs: ["get", "update"]
---
# The engine reads the secured variables secret names from this Role, and the catalog writes its
# rules. The manifest has no rules key, so a helm upgrade leaves the rules the catalog wrote.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cip-secured-variables-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-binding
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-service-account
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-role
  apiGroup: rbac.authorization.k8s.io

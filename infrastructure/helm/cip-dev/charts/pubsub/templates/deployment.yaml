{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pubsub
  name: pubsub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pubsub
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: pubsub
    spec:
      containers:
        - name: pubsub
          image: google/cloud-sdk:587.0.0-emulators
          command:
            - gcloud
            - beta
            - emulators
            - pubsub
            - start
            - --host-port
            - 0.0.0.0:8085
            - --project=test-project
          ports:
            - containerPort: 8085
          readinessProbe:
            httpGet:
              path: /
              port: 8085
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 768Mi
{{- end }}

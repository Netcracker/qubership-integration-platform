apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: ambient
  values:
    pilot:
      # Off, or the HPA scales istiod to 5 replicas against a 10m request.
      autoscaleEnabled: false
      resources:
        requests: { cpu: 10m, memory: 100Mi }
        limits: { memory: 512Mi }
    cni:
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits: { memory: 256Mi }
    ztunnel:
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits: { memory: 256Mi }
    global:
      proxy:
        # Gateways share a 4-CPU node with the platform pods.
        resources:
          requests: { cpu: 10m, memory: 40Mi }
          limits: { memory: 256Mi }
      waypoint:
        resources:
          requests: { cpu: 10m, memory: 40Mi }
          limits: { cpu: "2", memory: 256Mi }

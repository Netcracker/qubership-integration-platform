{{- if .Values.enabled }}
# The Compose service name, which the fixtures address.
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rabbitmq
  name: rabbitmq
spec:
  ports:
    - name: tcp-amqp
      port: 5672
      targetPort: 5672
    - name: tcp-management
      port: 15672
      targetPort: 15672
  selector:
    app: rabbitmq
---
{{ include "qip-dev.brokerHostService" (dict "name" "rabbitmq" "portName" "tcp-amqp" "targetPort" 5672 "nodePort" .Values.nodePort "loadBalancerPort" .Values.loadBalancerPort) }}
{{- end }}

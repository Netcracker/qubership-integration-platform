postgres:
  username: postgres
  password: postgres

gateways:
  enabled: true

# Brokers for chains that use them, off by default; README.md, "Brokers",
# lists their names and ports.
#   nodePort          a fixed node port on <name>-host, the Service for clients
#                     on the host.
#   loadBalancerPort  makes <name>-host a LoadBalancer Service on this port
#                     instead.
kafka:
  enabled: false
  nodePort:
  loadBalancerPort:
  # PEM server certificate and unencrypted key; with the key set, the TLS and
  # AUTHTLS listeners are added. Pass them with --set-file.
  tls:
    serverCert:
    serverKey:
rabbitmq:
  enabled: false
  nodePort:
  loadBalancerPort:
pubsub:
  enabled: false
  nodePort:
  loadBalancerPort:
sftp:
  enabled: false
  nodePort:
  loadBalancerPort:

# The platform services take the same settings:
#   image.tag  the image tag.
#   nodePort   a fixed node port for port 8080. Setting it makes the Service a
#              NodePort and drops the debug port 5005 from it, where the
#              service has one: reach that with kubectl port-forward.
#   loadBalancerPort  the port a second Service, of type LoadBalancer,
#              publishes and forwards to 8080. Docker Desktop's kind-based
#              cluster publishes a LoadBalancer port on the host and a
#              NodePort not at all.
#   strategy   the Deployment strategy.
#   podAnnotations  annotations on the pod template.
#   extraEnv   container environment entries added after the chart's own.
# The engine and the catalog also take their heap and Metaspace sizes.
qip-engine:
  image:
    tag: latest
  nodePort:
  loadBalancerPort:
  podAnnotations: {}
  strategy:
    type: Recreate
  extraEnv: []
  # Maps a file name to a PEM certificate. The engine trusts each one: they go
  # into Secret <release>-engine-certs, mounted at
  # /app/cert/defaultsslcertificate. Pass a file with --set-file.
  trustedCerts: {}
  jvm:
    maxHeap: 832m
    metaspaceSize: 384m
    maxMetaspaceSize: 384m

qip-runtime-catalog:
  image:
    tag: latest
  nodePort:
  loadBalancerPort:
  # Extra ClusterIP Service names for port 8080.
  serviceAliases: []
  # camel-k mount resources for every micro domain, such as
  # secret:<release>-engine-certs@/app/cert/defaultsslcertificate for the
  # engine's trusted certificates.
  microDomainResources: []
  # camel-k emptyDir volumes for every micro domain, as
  # name:/container/path[:sizeLimit]. A micro domain's root file system is
  # read-only; it writes the truststore it builds from those certificates to
  # truststore:/app/truststore.
  microDomainEmptyDirs: []
  # Sets CIP_METRICS_ENABLED, so every micro domain serves the chain meters on /metrics.
  microDomainMetrics: false
  podAnnotations: {}
  strategy: {}
  extraEnv: []
  jvm:
    maxHeap: 642m
    metaspaceSize: 192m
    maxMetaspaceSize: 192m

qip-sessions-management:
  image:
    tag: latest
  nodePort:
  loadBalancerPort:
  podAnnotations: {}
  strategy: {}
  extraEnv: []

qip-testing-service:
  image:
    tag: latest
  nodePort:
  loadBalancerPort:
  podAnnotations: {}
  strategy: {}
  extraEnv: []

global:
  blueGreenVersion: v1
  postgres:
    database: postgres
  consul:
    adminToken: 556339d5-f6a3-ff3b-ce1d-98e5b70d4a13
  qip:
    controlPlane:
      enabled: true
      meshType: Istio
    # Whether this is a live installation. Every service reads it, and it stays
    # true unless an installation says otherwise: the flag hides what is unsafe
    # on a live installation rather than enabling anything, so the safe answer
    # for one that names no mode is the restrictive one.
    production: true
    ui:
      port: 30080
      # Port 8080 of the proxy on a second Service, of type LoadBalancer, for a
      # cluster that publishes no NodePort on the host (Docker Desktop's kind-based one).
      loadBalancerPort:
      # Annotations on the proxy's pod template.
      podAnnotations: {}
      # The chart installs a proxy, not the UI: `location /` and `/doc/` go back to
      # a dev server on your own machine. host.docker.internal is the name Docker
      # Desktop provides; minikube offers host.minikube.internal, and on kind you
      # need the host's own address. A name the cluster cannot resolve is not fatal
      # any more - those two routes answer 502 and every API route keeps working.
      devServer:
        host: host.docker.internal
        port: 4200
      # Cluster DNS, for the routes whose upstream is built from a variable rather
      # than named literally. 10.96.0.10 is the kubeadm default, which Docker
      # Desktop, kind and minikube all use; k3s and k3d put CoreDNS at 10.43.0.10.
      resolver: 10.96.0.10
      # Proxy routes for the e2e suite: /e2e/svc/<service>/ reaches port 8080 of
      # any Service in the namespace, and /e2e/gateway/ reaches the public gateway.
      e2eLocations: false
    variables:
      defaultSecret:
        enabled: false
    # Turning the testing service off drops its chart and its nginx route: the
    # route names the service statically, and nginx refuses to start on a name
    # it cannot resolve.
    testingService:
      enabled: true
      # Endpoint mocking in the engine. With it on, an outbound HTTP call of a test
      # case run goes to the testing service, and one with no matching mock gets a
      # 404 instead of reaching the real endpoint; a live run is left alone. The
      # engine picks the change up on a restart; no chain needs a redeploy. It needs
      # enabled: true above, and the configmap renders it off while the testing
      # service is off.
      engineMockingEnabled: false
    deploy:
      classic:
        enabled: true
      micro:
        enabled: true
        image: ghcr.io/netcracker/qubership-integration-micro-engine:latest
    ai:
      image: ghcr.io/netcracker/qubership-integration-ai-service:latest
      knowledgeSidecarImage: ghcr.io/netcracker/qubership-integration-knowledge-sidecar:latest
      knowledgeVolume: null
      llmApiKey: placeholder
      llmBaseUrl: https://api.openai.com/v1
      llmChatModel: gpt-4o-mini
      llmReasoningEffort: none
      llmTemperature: "0.2"
      llmMaxTokens: "4096"
      llmTimeout: 180s
      minioEndpoint: http://minio:9000
      # Existing Secret with accessKey and secretKey entries. Provision the qip-ai-storage bucket separately.
      minioCredentialsSecret: minio-credentials
      # Runtime A2A rollout flag (default off). Does not delete Task data when flipped.
      a2aEnabled: "false"
      # Public base URL for the Agent Card. Set before enabling A2A (for example https://ai.example.com).
      a2aPublicBaseUrl: ""

{{- if .Values.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    networking.istio.io/service-type: NodePort
    # This forces Istio to name the created K8s Service "public-gateway"
    gateway.istio.io/name-override: "public-gateway"
  name: public-gateway
spec:
  gatewayClassName: istio
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      name: http
      port: 80
      protocol: HTTP
{{- end }}

{{- if .Values.enabled }}
# The Compose service name, which the fixtures address.
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kafka
  name: kafka
spec:
  ports:
    - name: tcp-internal
      port: 29092
      targetPort: 29092
    - name: tcp-auth
      port: 29094
      targetPort: 29094
    {{- if .Values.tls.serverKey }}
    - name: tcp-tls
      port: 29095
      targetPort: 29095
    - name: tcp-authtls
      port: 29096
      targetPort: 29096
    {{- end }}
  selector:
    app: kafka
---
{{ include "qip-dev.brokerHostService" (dict "name" "kafka" "portName" "tcp-external" "targetPort" 9092 "nodePort" .Values.nodePort "loadBalancerPort" .Values.loadBalancerPort) }}
{{- end }}

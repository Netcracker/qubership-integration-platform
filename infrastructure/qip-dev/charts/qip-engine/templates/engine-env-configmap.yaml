apiVersion: v1
data:
  DYNAMIC_ENGINE_CONSUL_STATE_ENABLED: "true"
  KUBE_DEV_MODE: "false"
  POSTGRES_URL: {{ .Release.Name }}-postgres:5432
  RUNTIME_CATALOG_SERVICE_URL: http://{{ .Release.Name }}-runtime-catalog-{{ .Values.global.blueGreenVersion }}:8080
  # Mocking needs the testing service, so both flags have to be on: with the service
  # off the engine would point at a Service that is never created. Rendered whatever
  # the flags say, because the deployment reads this key and a missing one pins the
  # pod in CreateContainerConfigError.
  TESTING_SERVICE_ENABLED: "{{ if and .Values.global.qip.testingService.enabled .Values.global.qip.testingService.engineMockingEnabled }}true{{ else }}false{{ end }}"
  TESTING_SERVICE_ADDRESS: http://{{ .Release.Name }}-testing-service-{{ .Values.global.blueGreenVersion }}:8080
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}-engine-env
  name: {{ .Release.Name }}-engine-env

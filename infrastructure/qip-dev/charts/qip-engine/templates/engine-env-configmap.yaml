apiVersion: v1
data:
  DYNAMIC_ENGINE_CONSUL_STATE_ENABLED: "true"
  KUBE_DEV_MODE: "false"
  POSTGRES_URL: {{ .Release.Name }}-postgres:5432
  RUNTIME_CATALOG_SERVICE_URL: http://{{ .Release.Name }}-runtime-catalog:8080
  # Rendered whatever the flag says: the deployment reads this key, and a missing
  # one pins the pod in CreateContainerConfigError.
  TESTING_SERVICE_ENABLED: {{ .Values.global.qip.testingService.engineMockingEnabled | default false | quote }}
  TESTING_SERVICE_ADDRESS: http://{{ .Release.Name }}-testing-service:8080
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}-engine-env
  name: {{ .Release.Name }}-engine-env

apiVersion: v1
data:
  DYNAMIC_ENGINE_CONSUL_STATE_ENABLED: "true"
  KUBE_DEV_MODE: "false"
  POSTGRES_URL: {{ .Release.Name }}-postgres:5432
  RUNTIME_CATALOG_SERVICE_URL: http://{{ .Release.Name }}-runtime-catalog:8080
  # Endpoint mocking stays off: with it on, every outbound HTTP call with no
  # matching mock gets a 404. Turn it on only while someone is testing, and only
  # where the testing service is deployed.
  TESTING_SERVICE_ENABLED: "false"
  TESTING_SERVICE_ADDRESS: http://{{ .Release.Name }}-testing-service:8080
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}-engine-env
  name: {{ .Release.Name }}-engine-env

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Release.Name }}-sessions-management-{{ .Values.global.blueGreenVersion }}
  name: {{ .Release.Name }}-sessions-management-{{ .Values.global.blueGreenVersion }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-sessions-management-{{ .Values.global.blueGreenVersion }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Release.Name }}-sessions-management-{{ .Values.global.blueGreenVersion }}
    spec:
      containers:
        - args:
            - /opt/java/openjdk/bin/java
            - -Xmx416m
            - -XX:MetaspaceSize=192m
            - -XX:MaxMetaspaceSize=192m
            - -XX:MaxDirectMemorySize=64m
            - -XX:+ExitOnOutOfMemoryError
            - -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
            - -Djava.security.egd=file:/dev/./urandom
            - --add-opens=java.base/java.lang=ALL-UNNAMED
            - --add-opens=java.base/java.util=ALL-UNNAMED
            - -Dfile.encoding=UTF-8
            - -jar
            - /app/qip-sessions-management.jar
          env:
            # The Service the chain names are re-resolved from. Without it the service asks for
            # its built-in default, which no Service in this chart carries.
            - name: QIP_INTERNALSERVICES_RUNTIMECATALOG
              value: {{ .Release.Name }}-runtime-catalog-{{ .Values.global.blueGreenVersion }}
            - name: CONSUL_ADMIN_TOKEN
              valueFrom:
                configMapKeyRef:
                  key: CONSUL_ADMIN_TOKEN
                  name: {{ .Release.Name }}-env
            - name: CONSUL_URL
              valueFrom:
                configMapKeyRef:
                  key: CONSUL_URL
                  name: {{ .Release.Name }}-env
            - name: NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: NAMESPACE
                  name: {{ .Release.Name }}-env
            - name: OPENSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  key: OPENSEARCH_HOST
                  name: {{ .Release.Name }}-env
            - name: OPENSEARCH_PORT
              valueFrom:
                configMapKeyRef:
                  key: OPENSEARCH_PORT
                  name: {{ .Release.Name }}-env
            - name: OPENSEARCH_PREFIX
              valueFrom:
                configMapKeyRef:
                  key: OPENSEARCH_PREFIX
                  name: {{ .Release.Name }}-env
            - name: TRACING_ENABLED
              valueFrom:
                configMapKeyRef:
                  key: TRACING_ENABLED
                  name: {{ .Release.Name }}-env
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          image: ghcr.io/netcracker/qubership-integration-sessions-management:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 15
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 15
          # The readiness group carries readinessState alone. Probing /actuator/health
          # instead would gate traffic on every dependency the service reports.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            timeoutSeconds: 5
          name: {{ .Release.Name }}-sessions-management
          ports:
            - containerPort: 8080
          resources: {}
      restartPolicy: Always

{{- if .Values.global.qip.testingService.enabled }}
apiVersion: v1
data:
  # Retention is left out on purpose: without QIP_TESTING_RETENTION_AGE the
  # service keeps every test run.
  QIP_TESTING_CATALOG_ADDRESS: http://{{ .Release.Name }}-runtime-catalog:8080
  QIP_TESTING_ENGINE_ADDRESS: http://{{ .Release.Name }}-engine:8080
  QIP_TESTING_EXECUTION_INTERVAL: "30s"
  QIP_TESTING_EXECUTION_LEASE: "1m"
  QIP_TESTING_EXECUTION_WORKERS: "4"
  QIP_TESTING_PAGINATION_LIMIT: "20"
  QIP_TESTING_POSTGRES_SCHEMA: testing_service
  QIP_TESTING_PRODUCTION: "false"
kind: ConfigMap
metadata:
  labels:
    app: {{ .Release.Name }}-testing-service-env
  name: {{ .Release.Name }}-testing-service-env
{{- end }}

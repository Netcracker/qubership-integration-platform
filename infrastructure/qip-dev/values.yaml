postgres:
  username: postgres
  password: postgres

gateways:
  enabled: true

global:
  blueGreenVersion: v1
  postgres:
    database: postgres
  qip:
    controlPlane:
      enabled: true
      meshType: Istio
    # Whether this is a live installation. Every service reads it, and it stays
    # true unless an installation says otherwise: the flag hides what is unsafe
    # on a live installation rather than enabling anything, so the safe answer
    # for one that names no mode is the restrictive one.
    production: true
    ui:
      port: 30080
      # The chart installs a proxy, not the UI: `location /` and `/doc/` go back to
      # a dev server on your own machine. host.docker.internal is the name Docker
      # Desktop provides; minikube offers host.minikube.internal, and on kind you
      # need the host's own address. A name the cluster cannot resolve is not fatal
      # any more - those two routes answer 502 and every API route keeps working.
      devServer:
        host: host.docker.internal
        port: 4200
      # Cluster DNS, for the routes whose upstream is built from a variable rather
      # than named literally. 10.96.0.10 is the kubeadm default, which Docker
      # Desktop, kind and minikube all use; k3s and k3d put CoreDNS at 10.43.0.10.
      resolver: 10.96.0.10
    variables:
      defaultSecret:
        enabled: false
    # Turning the testing service off drops its chart and its nginx route: the
    # route names the service statically, and nginx refuses to start on a name
    # it cannot resolve.
    testingService:
      enabled: true
      # Endpoint mocking in the engine. With it on, an outbound HTTP call of a test
      # case run goes to the testing service, and one with no matching mock gets a
      # 404 instead of reaching the real endpoint; a live run is left alone. The
      # engine picks the change up on a restart; no chain needs a redeploy. It needs
      # enabled: true above, and the configmap renders it off while the testing
      # service is off.
      engineMockingEnabled: false
    deploy:
      classic:
        enabled: true
      micro:
        enabled: true
        image: ghcr.io/netcracker/qubership-integration-micro-engine:latest

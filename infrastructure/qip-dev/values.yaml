postgres:
  username: postgres
  password: postgres

global:
  postgres:
    database: postgres
  qip:
    ui:
      port: 30080
    variables:
      defaultSecret:
        enabled: false
    # Turning the testing service off drops its chart and its nginx route: the
    # route names the service statically, and nginx refuses to start on a name
    # it cannot resolve.
    testingService:
      enabled: true
      # Endpoint mocking in the engine. With it on, an outbound HTTP call with no
      # matching mock gets a 404 instead of reaching the real endpoint, so turn it
      # on only while someone is testing. The engine picks the change up on a
      # restart; no chain needs a redeploy.
      engineMockingEnabled: false
    deploy:
      classic:
        enabled: true
      micro:
        enabled: true
        image: ghcr.io/netcracker/qubership-integration-micro-engine:latest

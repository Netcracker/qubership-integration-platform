---
id: "ca0e3983-c40c-494a-a7be-5ecbc0ee1217"
$schema: "http://qubership.org/schemas/product/qip/chain"
name: "log-record"
content:
  labels: []
  elements:
  - id: "13f91533-b6a7-47b5-bf4f-50aeec42b137"
    name: "Log Warning Record"
    type: "log-record"
    properties:
      businessIdentifiers:
        Req-Id: "${exchangeProperty.warningRequestId}"
      logLevel: "Warning"
      message: "${exchangeProperty.warningMessage}"
      receiver: "${exchangeProperty.warningReciever}"
      sender: "${exchangeProperty.warningSender}"
  - id: "530a36fd-71b6-47be-ac0a-7d3891d2236a"
    name: "Log Record"
    type: "log-record"
    properties:
      businessIdentifiers:
        Req-Id: "${exchangeProperty.infoRequestId}"
      logLevel: "Info"
      message: "${exchangeProperty.infoMessage}"
      receiver: "${exchangeProperty.errorReceiver}"
      sender: "${exchangeProperty.infoSender}"
  - id: "64420010-d342-4351-8e50-2e0921681277"
    name: "Log Error Record"
    type: "log-record"
    properties:
      businessIdentifiers:
        Req-Id: "${exchangeProperty.errorRequestId}"
      logLevel: "Error"
      message: "${exchangeProperty.errorMessage}"
      receiver: "${exchangeProperty.errorReceiver}"
      sender: "${exchangeProperty.errorSender}"
  - id: "ee44c80f-b71a-496f-898a-394bda8d7214"
    name: "Chain Trigger"
    type: "chain-trigger-2"
    properties:
      elementId: "ee44c80f-b71a-496f-898a-394bda8d7214"
  dependencies:
  - from: "ee44c80f-b71a-496f-898a-394bda8d7214"
    to: "13f91533-b6a7-47b5-bf4f-50aeec42b137"
  - from: "ee44c80f-b71a-496f-898a-394bda8d7214"
    to: "530a36fd-71b6-47be-ac0a-7d3891d2236a"
  - from: "ee44c80f-b71a-496f-898a-394bda8d7214"
    to: "64420010-d342-4351-8e50-2e0921681277"
  deployments:
  - domain: "default"
  deployAction: "DEPLOY"
  migrations: "[100, 101, 102, 103, 104, 105, 106, 107, 108]"

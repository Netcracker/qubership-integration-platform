---
id: 0ff67a73-825c-5a2a-9331-562fb46a4f99
$schema: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/chain
name: sftp-trigger-no-idempotency
content:
  labels: []
  elements:
  - id: 42b51522-432c-5451-820a-be804fbc0a5e
    name: SFTP Trigger
    type: sftp-trigger-2
    properties:
      connectUrl: localhost:22/upload/snapshot-trigger
      username: snapshot
      password: snapshot
      antInclude: '*.txt'
      autoCreate: false
      binary: true
      idempotent: false
      idempotentKey: ${file:name}-${file:size}-${file:modified}
      ignoreFileNotFoundOrPermissionError: true
      jschLoggingLevel: 'OFF'
      readLockLoggingLevel: 'OFF'
      runLoggingLevel: 'OFF'
      scheduler: quartz
      scheduler.cron: 0/1 * * ? * *
      scheduler.deleteJob: false
      scheduler.triggerGroup: '%%{domain-placeholder}-group'
      streamDownload: true
      useUserKnownHostsFile: false
  - id: 8a8c7e5c-2c7c-5527-bb09-7a0e076e5922
    name: Script
    type: script
    properties:
      exportFileExtension: groovy
      propertiesFilename: 8a8c7e5c-2c7c-5527-bb09-7a0e076e5922.element.script.cip.groovy
      propertiesToExportInSeparateFile: script
  dependencies:
  - from: 42b51522-432c-5451-820a-be804fbc0a5e
    to: 8a8c7e5c-2c7c-5527-bb09-7a0e076e5922
  deployAction: SNAPSHOT
  migrations: '[100, 101, 102, 103, 104, 105, 106, 107, 108]'

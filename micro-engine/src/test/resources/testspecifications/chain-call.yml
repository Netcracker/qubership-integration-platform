# yaml-language-server: $schema=../testspecifications.schema.json
subject: "chain-call"
deployments:
  - id: "chain-call"
    route: "chain-call"
    dependsOn:
      - "test-subchain"
  - id: "test-subchain"
    route: "test-subchain"
  - id: "parent"
    route: "nested-async-parent"
    dependsOn:
      - "child"
  - id: "child"
    route: "nested-async-child"
fixtures:
  - id: "child-branches"
    provider: "async-flow"
    deployment: "child"
  - id: "parent-branches"
    provider: "async-flow"
    deployment: "parent"
scenarios:
  - id: "calls-subchain"
    scope: Short
    deployment: "chain-call"
    endpointUri: "cip-chain:573699af-6329-47f9-a409-f469528b6eaa"
    body: "Original"
    headers:
      X-Test-Request: "request-value"
    properties:
      failChild: false
      testProperty: "property-value"
    expectedBody: "Subchain called"
    expectedHeaders:
      X-Test-Request: "child-header"
    expectedProperties:
      testProperty: "child-property"
      afterCallReached: true
      caughtBy: null
      finallyReached: true

  - id: "handles-child-failure-and-skips-continuation-in-try"
    scope: Short
    deployment: "chain-call"
    endpointUri: "cip-chain:573699af-6329-47f9-a409-f469528b6eaa"
    body: "Original"
    headers:
      X-Test-Request: "request-value"
    properties:
      failChild: true
      testProperty: "property-value"
    expectedBody: "Original"
    expectedHeaders:
      X-Test-Request: "request-value"
    expectedProperties:
      testProperty: "property-value"
      afterCallReached: null
      caughtBy: "illegal-state"
      finallyReached: true

  - id: "returns-before-parent-and-child-branches-complete"
    scope: Short
    deployment: "parent"
    endpointUri: "cip-chain:14a39104-0635-459e-9132-67267ee81748"
    body: "Original"
    headers:
      X-Test-Request: "request-value"
    properties:
      testProperty: "property-value"
    expectedBody: "Original"
    expectedHeaders:
      X-Test-Request: "request-value"
    expectedProperties:
      testProperty: "property-value"
    expectedAbsentHeaders:
      - "X-Parent-Branch"
      - "X-Child-Branch"
    interactions:
      - fixture: "parent-branches"
        expectedExchanges:
          - count: 1
            body: "Parent branch"
            headers:
              X-Test-Request: "request-value"
              X-Parent-Branch: "completed"
            properties:
              testProperty: "property-value"
      - fixture: "child-branches"
        expectedExchanges:
          - count: 1
            body: "Child branch"
            headers:
              X-Test-Request: "request-value"
              X-Child-Branch: "completed"
            properties:
              testProperty: "property-value"

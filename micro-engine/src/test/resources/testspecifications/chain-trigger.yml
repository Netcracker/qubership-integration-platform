# yaml-language-server: $schema=../testspecifications.schema.json
subject: wait
deployments:
- id: wait
  route: chain-trigger-consumer-wait
  dependsOn:
  - child
- id: child
  route: test-subchain
- id: overlap
  route: chain-trigger-consumer-wait
  dependsOn:
  - child-old
  - child-new
- id: child-old
  route: test-subchain
  isolatedContext: true
- id: child-new
  route: test-subchain
  isolatedContext: true
fixtures:
- id: child-lifecycle
  provider: chain-consumer-lifecycle
  deployment: child
  sourceElementId: ec738992-9f5b-4368-92d2-0e4c461b7bb6
- id: old-lifecycle
  provider: chain-consumer-lifecycle
  deployment: child-old
  sourceElementId: ec738992-9f5b-4368-92d2-0e4c461b7bb6
- id: new-lifecycle
  provider: chain-consumer-lifecycle
  deployment: child-new
  sourceElementId: ec738992-9f5b-4368-92d2-0e4c461b7bb6
scenarios:
- id: times-out-without-consumer-and-recovers-after-start
  expectedBehavior: >-
    Time out while the child consumer is stopped without delivering a request, then resume delivery after the
    consumer starts.
  scope: Long
  deployment: wait
  endpointUri: cip-chain:cc2a9c2f-f198-5854-9e9e-2468fe2096a8
  invocations:
  - id: healthy-before-stop
    expectedBehavior: "Deliver one request to the running child and return its body and propagated metadata."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      failChild: false
      testProperty: property-value
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
        body: Original
        headers:
          X-Test-Request: request-value
        properties:
          testProperty: property-value
  - id: absent-consumer-times-out
    expectedBehavior: >-
      Report the configured consumer-availability timeout while the child is stopped, with zero child
      deliveries.
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      failChild: false
      testProperty: property-value
    expectedFailure:
      type: org.qubership.integration.platform.engine.camel.components.directvm.ChainConsumerNotAvailableException
      message: 'No consumers available on endpoint: cip-chain://<snapshot-node-id>?block=true&failIfNoConsumers=false&timeout=1500.
        Exchange[]'
      cause: null
    expectedProperties:
      afterCallReached: null
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerAction: stop
    timeoutSeconds: 5
  - id: consumer-start-restores-delivery
    expectedBehavior: "Start the child consumer and successfully deliver the next request with its original metadata."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      failChild: false
      testProperty: property-value
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
        body: Original
        headers:
          X-Test-Request: request-value
        properties:
          testProperty: property-value
      response:
        properties:
          consumerAction: start
- id: waits-for-consumer-start-and-retains-payload
  expectedBehavior: >-
    Keep a caller waiting for child consumer availability, deliver its original input when the consumer starts,
    and accept a fresh call.
  scope: Short
  deployment: wait
  endpointUri: cip-chain:cc2a9c2f-f198-5854-9e9e-2468fe2096a8
  invocations:
  - id: caller-waits-until-consumer-starts
    expectedBehavior: >-
      Deliver the waiting call once the child starts, retaining the body, headers, and property submitted before
      the wait.
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      failChild: false
      testProperty: property-value
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
        body: Original
        headers:
          X-Test-Request: request-value
        properties:
          testProperty: property-value
      response:
        properties:
          consumerAction: start-when-caller-waits
  - id: next-call-uses-fresh-input
    expectedBehavior: "Deliver the next call using its fresh request metadata rather than values retained from the waiting call."
    body: Fresh
    headers:
      X-Test-Request: second-request
    properties:
      testProperty: second-property
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
        body: Fresh
        headers:
          X-Test-Request: second-request
        properties:
          testProperty: second-property
          failChild: null

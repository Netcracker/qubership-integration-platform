  deployment: wait
  endpointUri: cip-chain:cc2a9c2f-f198-5854-9e9e-2468fe2096a8
  invocations:
  - id: first-call
    expectedBehavior: "Deliver the first child call and return the corresponding result and metadata."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      failChild: false
      testProperty: property-value
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
        body: Original
        headers:
          X-Test-Request: request-value
        properties:
          testProperty: property-value
  - id: call-after-consumer-restart
    expectedBehavior: "Restart the child consumer and successfully deliver the next independent call."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      failChild: false
      testProperty: property-value
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
        body: Original
        headers:
          X-Test-Request: request-value
        properties:
          testProperty: property-value
      response:
        properties:
          consumerAction: restart
  - id: third-call
    expectedBehavior: "Continue delivering fresh child calls after restart without reusing previous request metadata."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      failChild: false
      testProperty: property-value
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
        body: Original
        headers:
          X-Test-Request: request-value
        properties:
          testProperty: property-value

- id: selects-newest-chain-consumer-and-restores-the-previous-deployment
  expectedBehavior: >-
    Route calls only to the newest available child consumer, fall back when it stops, and time out when no
    consumer remains.
  scope: Long
  deployment: overlap
  endpointUri: cip-chain:cc2a9c2f-f198-5854-9e9e-2468fe2096a8
  invocations:
  - id: newest-consumer-wins
    expectedBehavior: "Deliver only to the newly restarted consumer while the older registered consumer receives no request."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    interactions:
    - fixture: old-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: old
    - fixture: new-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerTag: new
          consumerAction: restart
          expectOtherConsumer: true
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
      snapshotChainConsumer: new
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
  - id: stopping-inactive-old-keeps-new
    expectedBehavior: "Stop the inactive older consumer without interrupting delivery to the currently selected newer consumer."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    interactions:
    - fixture: old-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: old
          consumerAction: stop
          expectOtherConsumer: true
    - fixture: new-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerTag: new
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
      snapshotChainConsumer: new
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
  - id: restarted-old-becomes-newest
    expectedBehavior: "Select the older deployment after restarting it makes its consumer the newest registration."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    interactions:
    - fixture: old-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerTag: old
          consumerAction: start
    - fixture: new-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: new
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
      snapshotChainConsumer: old
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
  - id: stopping-newest-restores-previous
    expectedBehavior: "Stop the selected newest consumer and deliver through the other still-registered consumer."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    interactions:
    - fixture: old-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: old
          consumerAction: stop
          expectOtherConsumer: true
    - fixture: new-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerTag: new
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
      snapshotChainConsumer: new
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
  - id: no-remaining-consumer-times-out
    expectedBehavior: "Time out without child delivery after the last available consumer is stopped."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    interactions:
    - fixture: old-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: old
    - fixture: new-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: new
          consumerAction: stop
    expectedFailure:
      type: org.qubership.integration.platform.engine.camel.components.directvm.ChainConsumerNotAvailableException
      message: 'No consumers available on endpoint: cip-chain://<snapshot-node-id>?block=true&failIfNoConsumers=false&timeout=1500.
        Exchange[]'
      cause: null
    expectedProperties:
      afterCallReached: null
  - id: old-consumer-restores-delivery
    expectedBehavior: "Restart the old deployment and deliver only to its consumer while the other deployment remains stopped."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    interactions:
    - fixture: old-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerTag: old
          consumerAction: start
    - fixture: new-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: new
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
      snapshotChainConsumer: old
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
- id: isolates-concurrent-chain-callers-and-child-failures
  expectedBehavior: >-
    Keep four concurrent calls and their metadata independent, isolate one child failure, and accept four
    subsequent successful calls.
  scope: Long
  deployment: wait
  driver:
    provider: chain-concurrent
    sourceElementId: cc2a9c2f-f198-5854-9e9e-2468fe2096a8
    parameters:
      requests: 4
  invocations:
  - id: one-child-failure-is-isolated
    expectedBehavior: >-
      Deliver all four concurrent calls with independent contexts, returning three successes and only the
      declared child failure.
    body: Concurrent
    properties:
      testProperty: original-property
    driver:
      provider: chain-concurrent
      sourceElementId: cc2a9c2f-f198-5854-9e9e-2468fe2096a8
      parameters:
        requests: 4
        failureIndex: 1
    expectedBody:
    - requestId: one-child-failure-is-isolated-0
      body: Subchain called
      headerRequestId: one-child-failure-is-isolated-0
      propertyRequestId: one-child-failure-is-isolated-0
      sessionFlag: true
      classLoaderRestored: true
      afterCallReached: true
      testProperty: child-property
      failure: null
    - requestId: one-child-failure-is-isolated-1
      body: Concurrent-1
      headerRequestId: one-child-failure-is-isolated-1
      propertyRequestId: one-child-failure-is-isolated-1
      sessionFlag: false
      classLoaderRestored: true
      afterCallReached: null
      testProperty: original-property
      failure:
        type: java.lang.IllegalStateException
        message: Child chain failed
        cause: null
    - requestId: one-child-failure-is-isolated-2
      body: Subchain called
      headerRequestId: one-child-failure-is-isolated-2
      propertyRequestId: one-child-failure-is-isolated-2
      sessionFlag: true
      classLoaderRestored: true
      afterCallReached: true
      testProperty: child-property
      failure: null
    - requestId: one-child-failure-is-isolated-3
      body: Subchain called
      headerRequestId: one-child-failure-is-isolated-3
      propertyRequestId: one-child-failure-is-isolated-3
      sessionFlag: false
      classLoaderRestored: true
      afterCallReached: true
      testProperty: child-property
      failure: null
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 4
      response:
        properties:
          concurrentEntries: 4
          applicationClassLoaderMarker: true
  - id: all-following-calls-recover
    expectedBehavior: "Complete all four subsequent concurrent calls successfully with their own bodies and metadata."
    body: Concurrent
    properties:
      testProperty: original-property
    driver:
      provider: chain-concurrent
      sourceElementId: cc2a9c2f-f198-5854-9e9e-2468fe2096a8
      parameters:
        requests: 4
    expectedBody:
    - requestId: all-following-calls-recover-0
      body: Subchain called
      headerRequestId: all-following-calls-recover-0
      propertyRequestId: all-following-calls-recover-0
      sessionFlag: true
      classLoaderRestored: true
      afterCallReached: true
      testProperty: child-property
      failure: null
    - requestId: all-following-calls-recover-1
      body: Subchain called
      headerRequestId: all-following-calls-recover-1
      propertyRequestId: all-following-calls-recover-1
      sessionFlag: false
      classLoaderRestored: true
      afterCallReached: true
      testProperty: child-property
      failure: null
    - requestId: all-following-calls-recover-2
      body: Subchain called
      headerRequestId: all-following-calls-recover-2
      propertyRequestId: all-following-calls-recover-2
      sessionFlag: true
      classLoaderRestored: true
      afterCallReached: true
      testProperty: child-property
      failure: null
    - requestId: all-following-calls-recover-3
      body: Subchain called
      headerRequestId: all-following-calls-recover-3
      propertyRequestId: all-following-calls-recover-3
      sessionFlag: false
      classLoaderRestored: true
      afterCallReached: true
      testProperty: child-property
      failure: null
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 4
      response:
        properties:
          concurrentEntries: 4
          applicationClassLoaderMarker: true
- id: finishes-inflight-chain-call-before-graceful-stop
  expectedBehavior: "Allow a held child call to finish during graceful consumer stop and restore delivery after restart."
  scope: Long
  deployment: wait
  endpointUri: cip-chain:cc2a9c2f-f198-5854-9e9e-2468fe2096a8
  invocations:
  - id: held-call-finishes-before-stop
    expectedBehavior: >-
      Keep graceful stop waiting until the held child call completes and return its result without losing
      metadata.
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerAction: stop-while-processing
  - id: delivery-resumes-after-start
    expectedBehavior: "Restart the stopped child consumer and complete the next request normally."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
    interactions:
    - fixture: child-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerAction: start
- id: drains-old-chain-deployment-during-overlapping-replacement
  expectedBehavior: >-
    Complete the in-flight call on the old deployment while its replacement starts, then send fresh calls only
    to the replacement.
  scope: Long
  deployment: overlap
  endpointUri: cip-chain:cc2a9c2f-f198-5854-9e9e-2468fe2096a8
  invocations:
  - id: old-call-drains-while-replacement-starts
    expectedBehavior: >-
      Finish the held call on the old consumer while starting its replacement, with no delivery of that call to
      the replacement.
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    interactions:
    - fixture: old-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerTag: old
          consumerAction: replace-while-processing
          lifecycleGroup: chain-rolling-replacement
          peerDeployment: child-new
    - fixture: new-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: new
          consumerAction: stop
          expectOtherConsumer: true
          lifecycleGroup: chain-rolling-replacement
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
      snapshotChainConsumer: old
    expectedProperties:
      testProperty: child-property
      afterCallReached: true
  - id: fresh-call-uses-only-new-consumer
    expectedBehavior: "Deliver the fresh call only to the replacement consumer after the old deployment has drained."
    body: Original
    headers:
      X-Test-Request: request-value
    properties:
      testProperty: property-value
      failChild: false
    interactions:
    - fixture: old-lifecycle
      expectedRequest:
        count: 0
      response:
        properties:
          consumerTag: old
          lifecycleGroup: chain-rolling-replacement
    - fixture: new-lifecycle
      expectedRequest:
        count: 1
      response:
        properties:
          consumerTag: new
          lifecycleGroup: chain-rolling-replacement
    expectedBody: Subchain called
    expectedHeaders:
      X-Test-Request: child-header
      snapshotChainConsumer: new
    expectedProperties:
      testProperty: child-property
      afterCallReached: true

# yaml-language-server: $schema=../testspecifications.schema.json
subject: "circuit-breaker"
deployments:
  - id: "circuit-breaker"
    route: "circuit-breaker"
  - id: "circuit-breaker-timing"
    route: "circuit-breaker alternative"
fixtures:
  - id: "petstore"
    provider: "http-service-call"
    deployment: "circuit-breaker"
    sourceElementId: "d05271cb-2f78-4765-9fc1-c7ab57415ce5"
  - id: "breaker"
    provider: "circuit-breaker"
    deployment: "circuit-breaker"
  - id: "timed-petstore"
    provider: "http-service-call"
    deployment: "circuit-breaker-timing"
    sourceElementId: "7b680d03-4895-43e2-85fe-2221392a9e8c"
  - id: "timed-breaker"
    provider: "circuit-breaker"
    deployment: "circuit-breaker-timing"
scenarios:
  - id: "waits-for-minimum-call-count"
    expectedBehavior: "Keep the breaker closed for the first ninety-nine failed calls and open it on the hundredth call."
    scope: Long
    endpointUri: "cip-chain:0453266a-e2e6-4722-af8b-bf563754984c"
    invocations:
      - id: "keeps-closed-before-hundredth-failure"
        expectedBehavior: >-
          Forward ninety-nine failing requests, return fallback each time, and keep the breaker closed below its
          minimum call count.
        repeat: 99
        body: "Original"
        expectedBody: "On Fallback"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 99
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "CLOSED"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "opens-on-hundredth-failure"
        expectedBehavior: "Forward the hundredth failed request, return fallback, and open the breaker."
        body: "Original"
        expectedBody: "On Fallback"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "OPEN"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"

  - id: "evicts-old-successes-from-sliding-window"
    expectedBehavior: >-
      Evict earlier successes from the count window and open the breaker when failures reach half of the current
      window.
    scope: Long
    endpointUri: "cip-chain:0453266a-e2e6-4722-af8b-bf563754984c"
    invocations:
      - id: "fills-window-with-successes"
        expectedBehavior: "Fill the count window with one hundred successful upstream calls while the breaker stays closed."
        repeat: 100
        body: "Original"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 100
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "CLOSED"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "keeps-closed-below-window-failure-threshold"
        expectedBehavior: >-
          Forward forty-nine failing calls and return fallback while failures remain below half of the sliding
          window.
        repeat: 49
        body: "Original"
        expectedBody: "On Fallback"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 49
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "CLOSED"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "opens-when-half-of-window-has-failed"
        expectedBehavior: "Open the breaker when the next failed call raises the current window's failure rate to fifty percent."
        body: "Original"
        expectedBody: "On Fallback"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "OPEN"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"

  - id: "opens-and-recovers"
    expectedBehavior: >-
      Open at the configured failure threshold, short-circuit without upstream requests, and close only after
      successful half-open probes.
    scope: Short
    endpointUri: "cip-chain:0453266a-e2e6-4722-af8b-bf563754984c"
    invocations:
      - id: "records-successes-while-closed"
        expectedBehavior: "Forward fifty successful calls and return the upstream responses while the breaker stays closed."
        repeat: 50
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
          "X-Test-Response": "success"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
          "internalProperty_element_warning": "false"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "success"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 50
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "CLOSED"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "records-failures-below-minimum-call-count"
        expectedBehavior: >-
          Forward forty-nine failed calls with fallback while the total call count remains below the minimum for
          opening.
        repeat: 49
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "failure"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 49
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "CLOSED"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "opens-at-failure-rate-threshold"
        expectedBehavior: "Return fallback for the next failed upstream call and open the breaker at the configured failure rate."
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "failure"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "OPEN"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "short-circuits-while-open"
        expectedBehavior: "Return fallback while open without issuing an upstream request."
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "would-have-succeeded"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 0
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "OPEN"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "records-failed-half-open-probes"
        expectedBehavior: "Forward nine failed recovery probes with fallback while the breaker remains half-open."
        repeat: 9
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "HALF_OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "failure"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 9
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            transitionToState: "HALF_OPEN"
            expectedState: "HALF_OPEN"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "reopens-after-failed-half-open-calls"
        expectedBehavior: "Forward the final failed recovery probe and reopen the breaker."
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "failure"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "OPEN"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "short-circuits-after-failed-recovery"
        expectedBehavior: "Return fallback after failed recovery without forwarding another upstream request."
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "would-have-succeeded"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 0
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "OPEN"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "permits-half-open-probes"
        expectedBehavior: >-
          Forward nine successful recovery probes and return their responses while the breaker remains half-
          open.
        repeat: 9
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
          "X-Test-Response": "recovered"
        expectedProperties:
          "CamelCircuitBreakerState": "HALF_OPEN"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
          "internalProperty_element_warning": "false"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "recovered"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 9
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            transitionToState: "HALF_OPEN"
            expectedState: "HALF_OPEN"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "closes-after-permitted-half-open-calls"
        expectedBehavior: "Close the breaker after the final permitted successful probe and return its upstream response."
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
          "X-Test-Response": "recovered"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
          "internalProperty_element_warning": "false"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "recovered"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "CLOSED"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"
      - id: "serves-requests-after-recovery"
        expectedBehavior: "Forward and return a normal successful request through the recovered closed breaker."
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
          "X-Test-Response": "recovered"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
          "internalProperty_element_warning": "false"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "recovered"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "CLOSED"
          - fixture: "timed-petstore"
            response: { status: 200 }
            expectedRequest:
              count: 0
          - fixture: "timed-breaker"
            expectedState: "CLOSED"

  - id: automatically-transitions-from-open-to-half-open
    expectedBehavior: >-
      Open after the minimum failed calls, wait for the native recovery interval, and close after two successful
      half-open probes.
    scope: Long
    endpointUri: cip-chain:1a76f830-1b79-47d0-ac8f-3811a556572c
    invocations:
      - id: records-failures-before-minimum-call-count
        expectedBehavior: "Forward three failing requests with fallback and keep the timed breaker closed."
        repeat: 3
        body: Original
        expectedBody: On Fallback
        expectedProperties:
          CamelCircuitBreakerState: CLOSED
          CamelCircuitBreakerSuccessfulExecution: false
          CamelCircuitBreakerResponseFromFallback: true
        interactions:
          - fixture: petstore
            response:
              status: 200
            expectedRequest:
              count: 0
          - fixture: breaker
            expectedState: CLOSED
          - fixture: timed-petstore
            response:
              status: 500
              headers:
                Content-Type: application/json
              body:
                message: Temporary service failure
            expectedRequest:
              count: 3
              method: GET
              path: /pet/1
          - fixture: timed-breaker
            expectedState: CLOSED
      - id: opens-after-fourth-failure
        expectedBehavior: "Forward the fourth failed request and open the timed breaker."
        body: Original
        expectedBody: On Fallback
        expectedProperties:
          CamelCircuitBreakerState: OPEN
          CamelCircuitBreakerSuccessfulExecution: false
          CamelCircuitBreakerResponseFromFallback: true
        interactions:
          - fixture: petstore
            response:
              status: 200
            expectedRequest:
              count: 0
          - fixture: breaker
            expectedState: CLOSED
          - fixture: timed-petstore
            response:
              status: 500
              headers:
                Content-Type: application/json
              body:
                message: Temporary service failure
            expectedRequest:
              count: 1
              method: GET
              path: /pet/1
          - fixture: timed-breaker
            expectedState: OPEN
      - id: rejects-requests-before-recovery
        expectedBehavior: "Return fallback before the recovery interval ends, with zero upstream requests."
        body: Original
        expectedBody: On Fallback
        expectedProperties:
          CamelCircuitBreakerState: OPEN
          CamelCircuitBreakerSuccessfulExecution: false
          CamelCircuitBreakerResponseFromFallback: true
        interactions:
          - fixture: petstore
            response:
              status: 200
            expectedRequest:
              count: 0
          - fixture: breaker
            expectedState: CLOSED
          - fixture: timed-petstore
            response:
              status: 200
              headers:
                Content-Type: application/json
              body:
                id: 1
                name: doggie
                photoUrls: []
            expectedRequest:
              count: 0
              method: GET
              path: /pet/1
          - fixture: timed-breaker
            expectedState: OPEN
      - id: observes-half-open-before-first-recovery-request
        expectedBehavior: "Observe the native transition to half-open before forwarding the first successful recovery request."
        body: Original
        expectedBody:
          id: 1
          name: doggie
          photoUrls: []
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          CamelCircuitBreakerState: HALF_OPEN
          CamelCircuitBreakerSuccessfulExecution: true
          CamelCircuitBreakerResponseFromFallback: false
        interactions:
          - fixture: petstore
            response:
              status: 200
            expectedRequest:
              count: 0
          - fixture: breaker
            expectedState: CLOSED
          - fixture: timed-petstore
            response:
              status: 200
              headers:
                Content-Type: application/json
              body:
                id: 1
                name: doggie
                photoUrls: []
            expectedRequest:
              count: 1
              method: GET
              path: /pet/1
          - fixture: timed-breaker
            awaitState: HALF_OPEN
            expectedState: HALF_OPEN
      - id: closes-after-second-recovery-request
        expectedBehavior: "Forward the second successful recovery request and close the timed breaker."
        body: Original
        expectedBody:
          id: 1
          name: doggie
          photoUrls: []
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          CamelCircuitBreakerState: CLOSED
          CamelCircuitBreakerSuccessfulExecution: true
          CamelCircuitBreakerResponseFromFallback: false
        interactions:
          - fixture: petstore
            response:
              status: 200
            expectedRequest:
              count: 0
          - fixture: breaker
            expectedState: CLOSED
          - fixture: timed-petstore
            response:
              status: 200
              headers:
                Content-Type: application/json
              body:
                id: 1
                name: doggie
                photoUrls: []
            expectedRequest:
              count: 1
              method: GET
              path: /pet/1
          - fixture: timed-breaker
            expectedState: CLOSED
  - id: opens-when-half-of-successful-calls-are-slow
    expectedBehavior: >-
      Count slow successful calls toward the slow-call threshold, open the breaker, and use fallback without
      another upstream call.
    scope: Long
    endpointUri: cip-chain:1a76f830-1b79-47d0-ac8f-3811a556572c
    invocations:
      - id: records-two-fast-successful-calls
        expectedBehavior: "Forward two fast successful calls and keep the timed breaker closed."
        repeat: 2
        body: Original
        expectedBody:
          id: 1
          name: doggie
          photoUrls: []
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          CamelCircuitBreakerState: CLOSED
          CamelCircuitBreakerSuccessfulExecution: true
          CamelCircuitBreakerResponseFromFallback: false
        interactions:
          - fixture: petstore
            response:
              status: 200
            expectedRequest:
              count: 0
          - fixture: breaker
            expectedState: CLOSED
          - fixture: timed-petstore
            response:
              status: 200
              headers:
                Content-Type: application/json
              body:
                id: 1
                name: doggie
                photoUrls: []
            expectedRequest:
              count: 2
              method: GET
              path: /pet/1
          - fixture: timed-breaker
            expectedState: CLOSED
      - id: records-first-slow-successful-call
        expectedBehavior: >-
          Return the first delayed successful response while the slow-call rate remains below the opening
          threshold.
        body: Original
        expectedBody:
          id: 1
          name: doggie
          photoUrls: []
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:

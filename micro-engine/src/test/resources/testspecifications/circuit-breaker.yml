# yaml-language-server: $schema=../testspecifications.schema.json
fixtures:
  - id: "petstore"
    provider: "http-service-call"
    sourceElementId: "d05271cb-2f78-4765-9fc1-c7ab57415ce5"
  - id: "breaker"
    provider: "circuit-breaker"
scenarios:
  - id: "opens-and-recovers"
    endpointUri: "cip-chain:0453266a-e2e6-4722-af8b-bf563754984c"
    invocations:
      - id: "records-successes-while-closed"
        repeat: 50
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
          "X-Test-Response": "success"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
          "internalProperty_element_warning": "false"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "success"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 50
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "CLOSED"
      - id: "records-failures-below-minimum-call-count"
        repeat: 49
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "failure"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 49
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "CLOSED"
      - id: "opens-at-failure-rate-threshold"
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "failure"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "OPEN"
      - id: "short-circuits-while-open"
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "would-have-succeeded"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 0
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "OPEN"
      - id: "records-failed-half-open-probes"
        repeat: 9
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "HALF_OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "failure"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 9
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            transitionToState: "HALF_OPEN"
            expectedState: "HALF_OPEN"
      - id: "reopens-after-failed-half-open-calls"
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 500
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "failure"
              body: { "message": "Temporary service failure" }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "OPEN"
      - id: "short-circuits-after-failed-recovery"
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: "On Fallback"
        expectedHeaders:
          "X-Test-Request": "request-value"
        expectedAbsentHeaders:
          - "CamelHttpResponseCode"
          - "X-Test-Response"
        expectedProperties:
          "CamelCircuitBreakerState": "OPEN"
          "CamelCircuitBreakerSuccessfulExecution": false
          "CamelCircuitBreakerResponseFromFallback": true
          "internalProperty_element_warning": "true"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "would-have-succeeded"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 0
              method: "GET"
              path: "/pet/1"
          - fixture: "breaker"
            expectedState: "OPEN"
      - id: "permits-half-open-probes"
        repeat: 9
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
          "X-Test-Response": "recovered"
        expectedProperties:
          "CamelCircuitBreakerState": "HALF_OPEN"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
          "internalProperty_element_warning": "false"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "recovered"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 9
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            transitionToState: "HALF_OPEN"
            expectedState: "HALF_OPEN"
      - id: "closes-after-permitted-half-open-calls"
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
          "X-Test-Response": "recovered"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
          "internalProperty_element_warning": "false"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "recovered"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "CLOSED"
      - id: "serves-requests-after-recovery"
        body: "Original"
        headers:
          "X-Test-Request": "request-value"
        expectedBody: { "id": 1, "name": "doggie", "photoUrls": [] }
        expectedHeaders:
          "CamelHttpResponseCode": 200
          "X-Test-Response": "recovered"
        expectedProperties:
          "CamelCircuitBreakerState": "CLOSED"
          "CamelCircuitBreakerSuccessfulExecution": true
          "CamelCircuitBreakerResponseFromFallback": false
          "internalProperty_element_warning": "false"
        interactions:
          - fixture: "petstore"
            response:
              status: 200
              headers:
                "Content-Type": "application/json"
                "X-Test-Response": "recovered"
              body: { "id": 1, "name": "doggie", "photoUrls": [] }
            expectedRequest:
              count: 1
              method: "GET"
              path: "/pet/1"
              headers:
                "X-Test-Request": "request-value"
          - fixture: "breaker"
            expectedState: "CLOSED"

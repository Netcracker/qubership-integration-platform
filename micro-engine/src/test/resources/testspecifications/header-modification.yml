# yaml-language-server: $schema=../testspecifications.schema.json
scenarios:
  - id: "adds-and-removes-headers"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "aa27fb4a-e9a7-4a12-a8c0-9acb9442f3c4"
    body: "Original"
    headers:
      X-Remove-This-Header: "remove-me"
      X-Unchanged-Header: "preserved"
    expectedBody: "Original"
    expectedHeaders:
      X-Add-This-Header: "thisValue"
      X-Unchanged-Header: "preserved"
    expectedAbsentHeaders:
      - "X-Remove-This-Header"
  - id: "updates-header"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "c74b44da-f6b6-467b-96f0-a20f83a52df0"
    body: "Original"
    headers:
      X-Update-Headers: "oldValue"
      X-Unchanged-Header: "preserved"
    expectedBody: "Original"
    expectedHeaders:
      X-Update-Headers: "newValue"
      X-Unchanged-Header: "preserved"

  - id: "evaluates-simple-expressions-and-preserves-message-data"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "5b15096e-67aa-51bc-8636-ddd83735057a"
    invocations:
      - id: "uses-body-headers-and-properties-with-special-characters"
        body: 'body "quoted" & <body> café'
        headers:
          X-Source: 'header "quoted" & <header> café'
          X-Count: 42
          X-Unchanged-Header: "preserved"
        properties:
          sourceValue: 'property "quoted" & <property> café'
        expectedBody: 'body "quoted" & <body> café'
        expectedHeaders:
          X-From-Body: 'body "quoted" & <body> café'
          X-From-Header: 'header "quoted" & <header> café'
          X-From-Property: 'property "quoted" & <property> café'
          X-From-Count: "42"
          X-Escaped: 'literal "quoted" & <tag> café'
          X-Source: 'header "quoted" & <header> café'
          X-Count: 42
          X-Unchanged-Header: "preserved"
        expectedProperties:
          sourceValue: 'property "quoted" & <property> café'
      - id: "evaluates-fresh-empty-and-zero-values"
        body: ""
        headers:
          X-Source: "second"
          X-Count: 0
          X-From-Header: "old-value"
        properties:
          sourceValue: ""
        expectedBody: ""
        expectedHeaders:
          X-From-Body: ""
          X-From-Header: "second"
          X-From-Property: ""
          X-From-Count: "0"
          X-Escaped: 'literal "quoted" & <tag> café'
          X-Source: "second"
          X-Count: 0
        expectedProperties:
          sourceValue: ""

  - id: "keeps-and-updates-headers-matched-by-removal-pattern"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "537a7065-d74a-5641-8571-da405461657f"
    invocations:
      - id: "keeps-existing-values-and-protects-added-and-updated-headers"
        body: "Original"
        headers:
          X-Keep: "retained"
          X-Updated: "old-value"
          X-Source: "replacement"
          X-Discard: "remove-me"
          X-Another: "remove-me-too"
          Other-Header: 7
        properties:
          marker: "preserved"
        expectedBody: "Original"
        expectedHeaders:
          X-Keep: "retained"
          X-Updated: "replacement"
          X-Added: "new"
          Other-Header: 7
        expectedAbsentHeaders:
          - "X-Keep-Absent"
          - "X-Source"
          - "X-Discard"
          - "X-Another"
        expectedProperties:
          marker: "preserved"
      - id: "does-not-create-empty-keep-headers"
        body: "Fresh"
        headers:
          X-Source: "next"
          X-Added: "old-value"
          X-Discard: "remove-me"
          Other-Header: "preserved"
        expectedBody: "Fresh"
        expectedHeaders:
          X-Updated: "next"
          X-Added: "new"
          Other-Header: "preserved"
        expectedAbsentHeaders:
          - "X-Keep"
          - "X-Keep-Absent"
          - "X-Source"
          - "X-Discard"

  - id: "removes-headers-by-wildcard-regex-and-exact-name"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "a4533d42-1c0d-54dc-a4da-0bd97ccfc3b0"
    invocations:
      - id: "removes-every-match-and-preserves-unmatched-names"
        body: "Original"
        headers:
          X-Temp-One: "temporary-one"
          X-Temp-Two: "temporary-two"
          Debug-1: "debug-one"
          Debug-23: "debug-twenty-three"
          Exact-Remove: "remove-me"
          X-Stable: "preserved"
          Debug-other: "preserved"
          Debug-23-suffix: "preserved"
          Other-Header: 9
        expectedBody: "Original"
        expectedHeaders:
          X-Stable: "preserved"
          Debug-other: "preserved"
          Debug-23-suffix: "preserved"
          Other-Header: 9
        expectedAbsentHeaders:
          - "X-Temp-One"
          - "X-Temp-Two"
          - "Debug-1"
          - "Debug-23"
          - "Exact-Remove"
      - id: "preserves-input-when-no-pattern-matches"
        body:
          value: "unchanged"
        headers:
          X-Stable: "still-preserved"
          Debug-other: "preserved"
          Other-Header: true
        expectedBody:
          value: "unchanged"
        expectedHeaders:
          X-Stable: "still-preserved"
          Debug-other: "preserved"
          Other-Header: true

  - id: "preserves-message-with-empty-options"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "10ff6587-3e1d-54e4-88bb-06b8e789287b"
    body:
      value: "café"
      count: 3
    headers:
      X-Count: 42
      X-Enabled: false
      X-Empty: ""
    properties:
      marker: "preserved"
    expectedBody:
      value: "café"
      count: 3
    expectedHeaders:
      X-Count: 42
      X-Enabled: false
      X-Empty: ""
    expectedProperties:
      marker: "preserved"

  - id: "preserves-message-with-absent-options"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "61217d3a-7228-5f7e-959c-baf26326a4dd"
    body:
      value: "café"
      count: 3
    headers:
      X-Count: 42
      X-Enabled: false
      X-Empty: ""
    properties:
      marker: "preserved"
    expectedBody:
      value: "café"
      count: 3
    expectedHeaders:
      X-Count: 42
      X-Enabled: false
      X-Empty: ""
    expectedProperties:
      marker: "preserved"

  - id: "reports-expression-failure-and-recovers-on-the-same-route"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "73bc7c9c-55f1-5b15-95dd-bce51e7b44d4"
    invocations:
      - id: "rejects-a-body-that-cannot-be-converted-to-integer"
        body: "not-a-number"
        headers:
          X-Converted: "incoming-invalid"
          X-Unchanged-Header: "preserved"
        expectedBody: "not-a-number"
        expectedHeaders:
          X-Converted: "incoming-invalid"
          X-Unchanged-Header: "preserved"
        expectedFailure:
          type: org.apache.camel.TypeConversionException
          message: 'Error during type conversion from type: java.lang.String to the required type: java.lang.Integer with value not-a-number due to java.lang.NumberFormatException: For input string: "not-a-number"'
          cause:
            type: java.lang.NumberFormatException
            message: 'For input string: "not-a-number"'
            cause: null
      - id: "converts-a-fresh-valid-body-on-the-existing-route"
        body: "42"
        headers:
          X-Converted: "old-value"
          X-Unchanged-Header: "fresh"
        expectedBody: "42"
        expectedHeaders:
          X-Converted: "42"
          X-Unchanged-Header: "fresh"

  - id: "ignores-removal-of-an-absent-header"
    scope: Short
    driver:
      provider: "routeSelector"
      sourceElementId: "aa27fb4a-e9a7-4a12-a8c0-9acb9442f3c4"
    body: "No match"
    headers:
      X-Unchanged-Header: "preserved"
    expectedBody: "No match"
    expectedHeaders:
      X-Add-This-Header: "thisValue"
      X-Unchanged-Header: "preserved"
    expectedAbsentHeaders:
      - "X-Remove-This-Header"

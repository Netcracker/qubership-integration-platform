  - id: deduplicates-requests-by-json-body-id
    scope: Short
    deployment: idempotency
    driver:
      provider: http-trigger
      sourceElementId: 8b21e4c7-fc5d-47fe-9769-b352ae5aa29e
      parameters:
        method: POST
        path: /routes/test-w-body
    invocations:
      - id: first-key
        body:
          id: order-1
          value: first
        headers:
          Content-Type: application/json
        expectedBody: Http Trigger called succesfully
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          CamelDuplicateMessage: null
          systemProperty_idempotencyContext: POST /qip-routes/test-w-body
          systemProperty_keyExpiry: '600'
          internalProperty_sessionFailed: null
        interactions:
          - fixture: idempotency-store
            expectedRequest:
              count: 1
              properties:
                insertionAttempts: 1
                key: POST /qip-routes/test-w-body:order-1
                keyExpiry: 600
                storedKeys:
                  - POST /qip-routes/test-w-body:order-1
                updatedKeys:
                  - POST /qip-routes/test-w-body:order-1
      - id: repeated-key
        body:
          id: order-1
          value: first
        headers:
          Content-Type: application/json
        expectedBody:
          id: order-1
          value: first
        expectedHeaders:
          CamelHttpResponseCode: 202
        expectedProperties:
          CamelDuplicateMessage: true
          systemProperty_idempotencyContext: POST /qip-routes/test-w-body
          systemProperty_keyExpiry: '600'
          internalProperty_sessionFailed: null
        interactions:
          - fixture: idempotency-store
            expectedRequest:
              count: 0
              properties:
                insertionAttempts: 2
                key: POST /qip-routes/test-w-body:order-1
                keyExpiry: 600
                storedKeys:
                  - POST /qip-routes/test-w-body:order-1
                updatedKeys: []
        repeat: 2
      - id: same-key-with-different-payload-headers-and-query
        body:
          id: order-1
          value: changed
        headers:
          Content-Type: application/json
          X-Idempotency-Key: header-key
        driver:
          provider: http-trigger
          sourceElementId: 8b21e4c7-fc5d-47fe-9769-b352ae5aa29e
          parameters:
            method: POST
            path: /routes/test-w-body?id=query-key
        expectedBody:
          id: order-1
          value: changed
        expectedHeaders:
          CamelHttpResponseCode: 202
        expectedProperties:
          CamelDuplicateMessage: true
          systemProperty_idempotencyContext: POST /qip-routes/test-w-body
          systemProperty_keyExpiry: '600'
          internalProperty_sessionFailed: null
        interactions:
          - fixture: idempotency-store
            expectedRequest:
              count: 0
              properties:
                insertionAttempts: 1
                key: POST /qip-routes/test-w-body:order-1
                keyExpiry: 600
                storedKeys:
                  - POST /qip-routes/test-w-body:order-1
                updatedKeys: []
      - id: different-body-key-with-reused-header
        body:
          id: order-2
        headers:
          Content-Type: application/json
          X-Idempotency-Key: header-key
        expectedBody: Http Trigger called succesfully
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          CamelDuplicateMessage: null
          systemProperty_idempotencyContext: POST /qip-routes/test-w-body
          systemProperty_keyExpiry: '600'
          internalProperty_sessionFailed: null
        interactions:
          - fixture: idempotency-store
            expectedRequest:
              count: 1
              properties:
                insertionAttempts: 1
                key: POST /qip-routes/test-w-body:order-2
                keyExpiry: 600
                storedKeys:
                  - POST /qip-routes/test-w-body:order-1
                  - POST /qip-routes/test-w-body:order-2
                updatedKeys:
                  - POST /qip-routes/test-w-body:order-2
      - id: original-key-still-reserved
        body:
          id: order-1
          value: latest
        headers:
          Content-Type: application/json
        expectedBody:
          id: order-1
          value: latest
        expectedHeaders:
          CamelHttpResponseCode: 202
        expectedProperties:
          CamelDuplicateMessage: true
          systemProperty_idempotencyContext: POST /qip-routes/test-w-body
          systemProperty_keyExpiry: '600'

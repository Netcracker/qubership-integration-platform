        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
      - id: text-body
        body: not allowed
        headers:
          Content-Type: text/plain
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: text-body
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:

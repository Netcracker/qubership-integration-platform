scenarios:
  - id: handles-empty-get-requests
    expectedBehavior: >-
      Complete GET requests with absent or empty bodies and clear HTTP session failure markers.
    scope: Short
    driver:
      provider: http-trigger
      sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
      parameters:
        method: GET
        path: /routes/trigger-test
    invocations:
      - id: absent-body
        expectedBehavior: >-
          Complete the GET request with no body and no HTTP session failure markers.
        expectedExchangeHeaders:
          CamelHttpMethod: GET
          CamelHttpQuery: null
        expectedAbsentExchangeHeaders:
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_servletRequestUrl:
            $match: non-empty
          httpTriggerStepId:
            $match: non-empty
          internalProperty_chainSessionTimeoutAfter: null
      - id: empty-body
        expectedBehavior: >-
          Complete the GET request with an explicitly empty body and no HTTP session failure markers.
        body: ''
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
    deployment: basic

  - id: preserves-request-headers-and-query-without-response-filtering
    expectedBehavior: >-
      Preserve encoded, repeated, and empty request values without enabling response filtering on the
      unfiltered route.
    scope: Short
    driver:
      provider: http-trigger
      sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
      parameters:
        method: GET
        path: /routes/trigger-test
    invocations:
      - id: encoded-repeated-and-empty-values
        expectedBehavior: >-
          Complete the request while preserving encoded, repeated, and empty header and query values.
        driver:
          provider: http-trigger
          sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
          parameters:
            method: GET
            path: /routes/trigger-test?value=hello%20world&path=a%2Fb&percent=%25&plus=a+b&tag=first&tag=second&empty=
        headers:
          X-Snapshot-Request: first
          Authorization: Bearer snapshot-first
        expectedExchangeHeaders:
          CamelHttpMethod: GET
          CamelHttpQuery: value=hello%20world&path=a%2Fb&percent=%25&plus=a+b&tag=first&tag=second&empty=
          X-Snapshot-Request: first
        expectedAbsentExchangeHeaders:
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_responseFilterInclude: null
          internalProperty_responseFilterExclude: null
      - id: response-filter-parameters
        expectedBehavior: >-
          Accept filter query parameters without creating response-filter state on a route where filtering is
          disabled.
        driver:
          provider: http-trigger
          sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
          parameters:
            method: GET
            path: /routes/trigger-test?fields=name%2Cid&excludeFields=secret&fields=other
        headers:
          X-Snapshot-Request: second
          Authorization: Bearer snapshot-second
        expectedExchangeHeaders:
          CamelHttpMethod: GET
          CamelHttpQuery: fields=name%2Cid&excludeFields=secret&fields=other
          X-Snapshot-Request: second
        expectedAbsentExchangeHeaders:
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_responseFilterInclude: null
          internalProperty_responseFilterExclude: null
      - id: no-query-after-filter-parameters
        expectedBehavior: >-
          Complete the next request without retaining query or response-filter state from the previous
          request.
        driver:
          provider: http-trigger
          sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
          parameters:
            method: GET
            path: /routes/trigger-test
        headers: {}
        expectedExchangeHeaders:
          CamelHttpMethod: GET
          CamelHttpQuery: null
        expectedAbsentExchangeHeaders:
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - X-Snapshot-Request
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_responseFilterInclude: null
          internalProperty_responseFilterExclude: null
    deployment: basic


        expectedExchangeHeaders:
          CamelHttpMethod: GET
          CamelHttpQuery: null
        expectedAbsentExchangeHeaders:
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_servletRequestUrl:
            $match: non-empty
          httpTriggerStepId:
            $match: non-empty
          internalProperty_chainSessionTimeoutAfter: null

          internalProperty_elementFailed: null
      - id: unparsed-content-type
        expectedBehavior: >-
          Accept the request declaring an unparsed content-type value without content-type allowlist
          rejection.
        headers:
          Content-Type: snapshot-content
        expectedExchangeHeaders:
          Content-Type: snapshot-content
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
    deployment: basic

  - id: runs-validation-script-for-nonempty-bodies-and-recovers
    expectedBehavior: >-
      Reject nonempty bodies through the validation script with HTTP 400, then accept a fresh empty request.
    scope: Short
    driver:
      provider: http-trigger
      sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
      parameters:
        method: GET
        path: /routes/trigger-test
    invocations:
      - id: before-validation-failures
        expectedBehavior: >-
          Complete the empty baseline request before testing validation failures.
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
      - id: text-body
        expectedBehavior: >-
          Return the scripted HTTP 400 validation failure for nonempty text and mark the request as failed.
        body: not allowed
        headers:
          Content-Type: text/plain
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: text-body
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
        driver:
          provider: http-trigger
          sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
          parameters:
            method: GET
            path: /routes/trigger-test?case=rejected&fields=name
      - id: whitespace-body
        expectedBehavior: >-
          Return the scripted HTTP 400 validation failure for whitespace and mark the request as failed.
        body: " \t\r\n "
        headers:
          Content-Type: text/plain
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: whitespace-body
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
      - id: empty-json-object
        expectedBehavior: >-
          Return the scripted HTTP 400 validation failure for an empty JSON object and mark the request as
          failed.
        body: {}
        headers:
          Content-Type: application/json
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: empty-json-object
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
      - id: empty-json-array
        expectedBehavior: >-
          Return the scripted HTTP 400 validation failure for an empty JSON array and mark the request as
          failed.
        body: []
        headers:
          Content-Type: application/json
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: empty-json-array
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
      - id: json-null-literal
        expectedBehavior: >-
          Return the scripted HTTP 400 validation failure for the JSON null literal and mark the request as
          failed.
        body: 'null'
        headers:
          Content-Type: application/json
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: json-null-literal
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
      - id: json-zero
        expectedBehavior: >-
          Return the scripted HTTP 400 validation failure for JSON zero and mark the request as failed.
        body: 0
        headers:
          Content-Type: application/json
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: json-zero
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
      - id: json-false
        expectedBehavior: >-
          Return the scripted HTTP 400 validation failure for JSON false and mark the request as failed.
        body: false
        headers:
          Content-Type: application/json
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: json-false
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
      - id: malformed-json
        expectedBehavior: >-
          Return the scripted HTTP 400 validation failure for malformed JSON and mark the request as failed.
        body: '{'
        headers:
          Content-Type: application/json
          Authorization: Bearer snapshot-rejected
          X-Snapshot-Request: malformed-json
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
      - id: after-validation-failures
        expectedBehavior: >-
          Accept a fresh empty request after validation failures and clear the session failure markers.
        expectedAbsentExchangeHeaders:
          - Content-Type
          - Authorization
          - X-Snapshot-Request
          - CamelHttpResponseCode
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
    deployment: basic

  - id: captures-testing-session-id-per-request
    expectedBehavior: >-
      Capture each valid testing-session ID independently and avoid retaining missing or blank IDs after
      success or validation failure.
    scope: Short
    driver:
      provider: http-trigger
      sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
      parameters:
        method: GET
        path: /routes/trigger-test
    invocations:
      - id: first-session
        expectedBehavior: >-
          Capture the first testing-session ID and complete the request successfully.
        headers:
          external-session-cip-id: snapshot-session-first
        expectedExchangeHeaders:
          external-session-cip-id: snapshot-session-first
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_testingSessionId: snapshot-session-first
      - id: second-session
        expectedBehavior: >-
          Replace the testing-session ID with the second request's value.
        headers:
          external-session-cip-id: snapshot-session-second
        expectedExchangeHeaders:
          external-session-cip-id: snapshot-session-second
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_testingSessionId: snapshot-session-second
      - id: missing-session
        expectedBehavior: >-
          Complete the request without retaining the previous testing-session ID when its header is absent.
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_testingSessionId: null
      - id: empty-session
        expectedBehavior: >-
          Treat the empty testing-session header as absent and leave the session ID unset.
        headers:
          external-session-cip-id: ''
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_testingSessionId: null
      - id: blank-session
        expectedBehavior: >-
          Treat a whitespace-only testing-session header as absent and leave the session ID unset.
        headers:
          external-session-cip-id: '   '
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_testingSessionId: null
      - id: captures-session-before-validation-failure
        expectedBehavior: >-
          Capture the request's testing-session ID before returning the HTTP 400 validation failure.
        body: rejected
        headers:
          external-session-cip-id: snapshot-session-rejected
        expectedBody: Validation Failure
        expectedHeaders:
          CamelHttpResponseCode: 400
          content-type: application/json
        expectedAbsentExchangeHeaders:
          - CamelHttpMethod
          - CamelHttpQuery
          - CamelHttpUri
          - CamelHttpUrl
          - CamelHttpPath
          - Authorization
          - external-session-cip-id
          - X-Snapshot-Request
        expectedProperties:
          internalProperty_sessionFailed: 'true'
          internalProperty_elementFailed: 'true'
          internalProperty_testingSessionId: snapshot-session-rejected
      - id: missing-session-after-validation-failure
        expectedBehavior: >-
          Complete a fresh request without retaining the failed request's testing-session ID or failure
          markers.
        expectedAbsentExchangeHeaders:
          - external-session-cip-id
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          internalProperty_testingSessionId: null
    deployment: basic

  - id: ignores-correlation-headers-when-disabled
    expectedBehavior: >-
      Complete requests without populating correlationId from headers when correlation extraction is disabled.
    scope: Short
    driver:
      provider: http-trigger
      sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
      parameters:
        method: GET
        path: /routes/trigger-test
    invocations:
      - id: first-correlation
        expectedBehavior: >-
          Complete the first request without populating correlationId from its header because extraction is
          disabled.
        headers:
          X-Correlation-Id: correlation-first
        expectedExchangeHeaders:
          X-Correlation-Id: correlation-first
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          correlationId: null
      - id: second-correlation
        expectedBehavior: >-
          Ignore the next correlation header and leave correlationId unset on the successful request.
        headers:
          X-Correlation-Id: correlation-second
        expectedExchangeHeaders:
          X-Correlation-Id: correlation-second
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          correlationId: null
      - id: missing-correlation
        expectedBehavior: >-
          Complete the request with correlationId unset when no correlation header is supplied.
        expectedAbsentExchangeHeaders:
          - X-Correlation-Id
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
          correlationId: null
    deployment: basic

  - id: executes-repeated-idempotency-keys-when-disabled
    expectedBehavior: >-
      Execute repeated and missing idempotency keys normally when trigger idempotency is disabled.
    scope: Short
    driver:
      provider: http-trigger
      sourceElementId: 4f326226-abf6-4aa1-a42c-9fec59398299
      parameters:
        method: GET
        path: /routes/trigger-test
    invocations:
      - id: same-key-twice
        expectedBehavior: >-
          Execute both requests carrying the same key because idempotency is disabled.
        repeat: 2
        headers:
          X-Idempotency-Key: snapshot-repeat
        expectedExchangeHeaders:
          X-Idempotency-Key: snapshot-repeat
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
      - id: missing-key
        expectedBehavior: >-
          Complete the request normally when idempotency is disabled and no key is supplied.
        expectedAbsentExchangeHeaders:
          - X-Idempotency-Key
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
    deployment: basic

  - id: deduplicates-requests-by-json-body-id
    expectedBehavior: >-
      Use the JSON body ID as the business key, return HTTP 202 for duplicates, and execute only distinct
      keys.
    scope: Short
    deployment: idempotency
    driver:
      provider: http-trigger
      sourceElementId: 8b21e4c7-fc5d-47fe-9769-b352ae5aa29e
      parameters:
        method: POST
        path: /routes/test-w-body
    invocations:
      - id: first-key
        expectedBehavior: >-
          Acquire the first JSON body ID and execute downstream work once with HTTP 200.
        body:
          id: order-1
          value: first
        headers:
          Content-Type: application/json
        expectedBody: Http Trigger called succesfully
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          CamelDuplicateMessage: null
          systemProperty_idempotencyContext: POST /qip-routes/test-w-body
          systemProperty_keyExpiry: '600'
          internalProperty_sessionFailed: null
        interactions:
          - fixture: idempotency-store
            expectedRequest:
              count: 1
              properties:
                insertionAttempts: 1
                key: POST /qip-routes/test-w-body:order-1
                keyExpiry: 600
                storedKeys:
                  - POST /qip-routes/test-w-body:order-1
                updatedKeys:
                  - POST /qip-routes/test-w-body:order-1
      - id: repeated-key
        expectedBehavior: >-
          Return HTTP 202 for the repeated JSON body ID without another downstream execution.
        body:
          id: order-1
          value: first
        headers:
          Content-Type: application/json
        expectedBody:
          id: order-1
          value: first
        expectedHeaders:
          CamelHttpResponseCode: 202
        expectedProperties:
          CamelDuplicateMessage: true
          systemProperty_idempotencyContext: POST /qip-routes/test-w-body
          systemProperty_keyExpiry: '600'
          internalProperty_sessionFailed: null
        interactions:
          - fixture: idempotency-store
            expectedRequest:
              count: 0
              properties:
                insertionAttempts: 2
                key: POST /qip-routes/test-w-body:order-1
                keyExpiry: 600
                storedKeys:
                  - POST /qip-routes/test-w-body:order-1
                updatedKeys: []
        repeat: 2
      - id: same-key-with-different-payload-headers-and-query
        expectedBehavior: >-
          Return HTTP 202 for the same body ID despite changed payload, headers, and query values.
        body:
          id: order-1
          value: changed
        headers:
          Content-Type: application/json
          X-Idempotency-Key: header-key
        driver:
          provider: http-trigger
          sourceElementId: 8b21e4c7-fc5d-47fe-9769-b352ae5aa29e
          parameters:
            method: POST

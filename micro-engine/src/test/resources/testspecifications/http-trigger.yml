        path: /routes/trigger-test
    invocations:
      - id: json
        expectedBehavior: >-
          Accept the request declaring JSON without content-type allowlist rejection.
        headers:
          Content-Type: application/json
        expectedExchangeHeaders:
          Content-Type: application/json
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
      - id: text-with-charset
        expectedBehavior: >-
          Accept the request declaring text with a charset parameter without content-type allowlist rejection.
        headers:
          Content-Type: text/plain; charset=UTF-8
        expectedExchangeHeaders:
          Content-Type: text/plain; charset=UTF-8
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
      - id: binary
        expectedBehavior: >-
          Accept the request declaring binary without content-type allowlist rejection.
        headers:
          Content-Type: application/octet-stream
        expectedExchangeHeaders:
          Content-Type: application/octet-stream
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:
          internalProperty_sessionFailed: null
          internalProperty_elementFailed: null
      - id: custom
        expectedBehavior: >-
          Accept the request declaring a custom media type without content-type allowlist rejection.
        headers:
          Content-Type: application/vnd.snapshot+json
        expectedExchangeHeaders:
          Content-Type: application/vnd.snapshot+json
        expectedBody: Triggered
        expectedHeaders:
          CamelHttpResponseCode: 200
        expectedProperties:

scenarios:
- id: restores-scenario-message-type-and-headers-after-invocation-override
  expectedBehavior: >-
    Apply invocation-specific JMS message settings once and restore inherited scenario text settings on the next
    delivery.
  reuseBroker: true
  scope: Short
  deployment: jms-trigger
  driver:
    provider: jms-trigger
    sourceElementId: 5d543929-f2af-47a6-8db1-306df85ae0d4
    parameters:
      messageType: Text
      jmsHeaders:
        correlationId: scenario-default
        type: scenario.text
        priority: 3
        deliveryMode: PERSISTENT
  invocations:
  - id: bytes-override-first
    expectedBehavior: Deliver the invocation BytesMessage override with its expected byte-array type and headers.
    driver:
      provider: jms-trigger
      sourceElementId: 5d543929-f2af-47a6-8db1-306df85ae0d4
      parameters:
        messageType: Bytes
        jmsHeaders:
          correlationId: invocation-override
          type: invocation.bytes
          priority: 8
          deliveryMode: NON_PERSISTENT
    body: shared-payload
    expectedBody: Triggered
    expectedHeaders:
      JMSPriority: 8
      JMSDeliveryMode: 1
      JMSCorrelationID: invocation-override
      JMSType: invocation.bytes
    interactions:
    - fixture: jms-broker
      expectedRequest:
        count: 1
        destination: jms/snapshot/trigger
        body: shared-payload
        headers:
          JMSPriority: 8
          JMSDeliveryMode: 1
          JMSCorrelationID: invocation-override
          JMSType: invocation.bytes
      response:
        properties:
          expectedBodyType: '[B'
  - id: inherits-scenario-text-and-headers
    expectedBehavior: Restore the scenario TextMessage body and headers after the BytesMessage override.
    body: shared-payload
    expectedBody: Triggered
    expectedHeaders:
      JMSPriority: 3
      JMSDeliveryMode: 2
      JMSCorrelationID: scenario-default
      JMSType: scenario.text
    interactions:
    - fixture: jms-broker
      expectedRequest:
        count: 1
        destination: jms/snapshot/trigger
        body: shared-payload
        headers:
          JMSPriority: 3
          JMSDeliveryMode: 2
          JMSCorrelationID: scenario-default
          JMSType: scenario.text
      response:
        properties:
          expectedBodyType: java.lang.String
- id: restores-scenario-publication-after-batch-override
  expectedBehavior: >-
    Apply a BytesMessage batch override without retaining its publication settings for the next scalar invocation.
  reuseBroker: true
  scope: Short
  deployment: jms-trigger
  driver:
    provider: jms-trigger
    sourceElementId: 5d543929-f2af-47a6-8db1-306df85ae0d4
    parameters:
      messageType: Text
      jmsHeaders:
        correlationId: scalar-default
        priority: 2
  invocations:
  - id: bytes-batch-override-first
    expectedBehavior: Deliver both overridden byte messages with their expected byte-array bodies.
    driver:
      provider: jms-trigger
      sourceElementId: 5d543929-f2af-47a6-8db1-306df85ae0d4
      parameters:
        messages:
        - messageType: Bytes
          body: batch-payload
          jmsHeaders:
            correlationId: batch-override
            priority: 7
        - messageType: Bytes
          body: batch-payload
          jmsHeaders:
            correlationId: batch-override
            priority: 7
    expectedBody:
    - Triggered
    - Triggered
    expectedHeaders:
      JMSPriority: 7
      JMSCorrelationID: batch-override
    interactions:
    - fixture: jms-broker
      expectedRequest:
        count: 2
        destination: jms/snapshot/trigger
        body: batch-payload
        headers:
          JMSPriority: 7
          JMSCorrelationID: batch-override
      response:
        properties:
          expectedBodyType: '[B'
  - id: inherits-scenario-scalar-publication
    expectedBehavior: Restore the inherited scalar TextMessage publication after the batch override.
    body: scalar-payload
    expectedBody: Triggered
    expectedHeaders:
      JMSPriority: 2
      JMSCorrelationID: scalar-default
    interactions:
    - fixture: jms-broker
      expectedRequest:
        count: 1
        destination: jms/snapshot/trigger
        body: scalar-payload
        headers:
          JMSPriority: 2
          JMSCorrelationID: scalar-default
      response:
        properties:
          expectedBodyType: java.lang.String
- id: consumes-message-types-and-resumes-backlog-after-restart
  expectedBehavior: >-
    Map native JMS body types and headers faithfully, isolate deliveries, and recover backlog and live consumption
    after restart.
  scope: Short
  deployment: jms-trigger
  invocations:
  - id: text-message
    expectedBehavior: Deliver a TextMessage as the exact expected Java string.
    driver:
      provider: jms-trigger
      sourceElementId: 5d543929-f2af-47a6-8db1-306df85ae0d4
      parameters:
        messageType: Text
    body: JMS trigger input
    expectedBody: Triggered
    expectedHeaders:
      JMSMessageID:
        $match: non-empty
      JMSRedelivered: false
      JMSPriority: 4
      JMSDeliveryMode: 2
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
      CamelDuplicateMessage: null
    interactions:
    - fixture: jms-broker
      expectedRequest:
        count: 1
        destination: jms/snapshot/trigger
        body: JMS trigger input
      response:
        properties:
          expectedBodyType: java.lang.String
  - id: json-text
    expectedBehavior: Preserve JSON text as a Java string without coercing it to a structured object.
    driver:
      provider: jms-trigger
      sourceElementId: 5d543929-f2af-47a6-8db1-306df85ae0d4
      parameters:
        messageType: Text
    body: '{"id":"order-1","active":true}'
    expectedBody: Triggered
    expectedHeaders:
      JMSMessageID:
        $match: non-empty
      JMSRedelivered: false
      JMSPriority: 4
      JMSDeliveryMode: 2
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
      CamelDuplicateMessage: null
    interactions:
    - fixture: jms-broker
      expectedRequest:
        count: 1
        destination: jms/snapshot/trigger
        body: '{"id":"order-1","active":true}'
      response:
        properties:
          expectedBodyType: java.lang.String
  - id: empty-text
    expectedBehavior: Preserve an empty TextMessage body as an empty string.
    driver:
      provider: jms-trigger
      sourceElementId: 5d543929-f2af-47a6-8db1-306df85ae0d4
      parameters:

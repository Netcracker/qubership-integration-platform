scenarios:
- id: consumes-values-keys-headers-and-isolates-exchanges
  expectedBehavior: >-
    Consume text, empty values, tombstones, keys, and headers while keeping each record exchange independent.
  reuseBroker: true
  scope: Short
  driver:
    provider: kafka-trigger
    sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
    parameters:
      topic: snapshot.kafka.trigger.one
      partition: 0
  invocations:
  - id: plain-text
    expectedBehavior: Consume the plain text value and preserve its Kafka key and content type.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
      parameters:
        topic: snapshot.kafka.trigger.one
        partition: 0
        key: order-1
    body: Kafka trigger input
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
      kafka.KEY: order-1
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: Kafka trigger input
        headers:
          Content-Type: application/json
          kafka.KEY: order-1
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: json-text
    expectedBehavior: Deliver JSON text unchanged without parsing its fields in the trigger.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
      parameters:
        topic: snapshot.kafka.trigger.one
        partition: 0
        key: order-2
    body: '{"id":"order-2","active":true}'
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
      kafka.KEY: order-2
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: '{"id":"order-2","active":true}'
        headers:
          Content-Type: application/json
          kafka.KEY: order-2
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: malformed-json-without-schema
    expectedBehavior: Accept malformed JSON as text when the chain declares no input schema.
    body: '{invalid json'
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
      kafka.KEY: null
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: '{invalid json'
        headers:
          Content-Type: application/json
          kafka.KEY: null
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: empty-value-and-key
    expectedBehavior: Preserve an empty Kafka value and an empty key as empty strings.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
      parameters:
        topic: snapshot.kafka.trigger.one
        partition: 0
        key: ''
    body: ''
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
      kafka.KEY: ''
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: ''
        headers:
          Content-Type: application/json
          kafka.KEY: ''
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: tombstone-and-null-key
    expectedBehavior: Deliver a tombstone as a null body and retain a null key.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599

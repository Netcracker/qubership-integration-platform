            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: utf8-value-key-and-header
    expectedBehavior: Preserve UTF-8 characters in the value, Kafka key, and custom header.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
      parameters:
        topic: snapshot.kafka.trigger.one
        partition: 0
        key: résumé
    body: café delivery
    headers:
      X-Snapshot-Text: naïve request
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
      kafka.KEY: résumé
      X-Snapshot-Text: naïve request
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: café delivery
        headers:
          Content-Type: application/json
          kafka.KEY: résumé
          X-Snapshot-Text: naïve request
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: custom-content-type
    expectedBehavior: Keep the incoming XML content type instead of applying the JSON default.
    body: <order id="3"/>
    headers:
      Content-Type: application/xml; charset=UTF-8
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/xml; charset=UTF-8
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:

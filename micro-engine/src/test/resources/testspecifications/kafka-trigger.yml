- id: consumes-beyond-poll-limit-from-two-topics-in-partition-order
  expectedBehavior: >-
    Drain records from both subscribed topics beyond a single poll, preserve partition order, and exclude other
    topics.
  reuseBroker: true
  scope: Long
  driver:
    provider: kafka-trigger
    sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
    parameters:
      topic: snapshot.kafka.trigger.one
      partition: 0
  invocations:
  - id: six-hundred-records-across-both-topics
    expectedBehavior: >-
      Consume and commit all 600 queued records from both subscribed topics in their declared partition order.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
      parameters:
        topic: snapshot.kafka.trigger.one
        partition: 0
        messages:
        - topic: snapshot.kafka.trigger.one
          partition: 0
          key: key-0
          body: snapshot.kafka.trigger.one-partition-0
          headers:
            X-Snapshot-Batch: bulk
          messageCount: 100
        - topic: snapshot.kafka.trigger.one
          partition: 1
          key: key-1
          body: snapshot.kafka.trigger.one-partition-1
          headers:
            X-Snapshot-Batch: bulk
          messageCount: 100
        - topic: snapshot.kafka.trigger.one
          partition: 2
          key: key-2
          body: snapshot.kafka.trigger.one-partition-2
          headers:
            X-Snapshot-Batch: bulk
          messageCount: 100
        - topic: snapshot.kafka.trigger.two
          partition: 0
          key: key-0
          body: snapshot.kafka.trigger.two-partition-0
          headers:
            X-Snapshot-Batch: bulk
          messageCount: 100
        - topic: snapshot.kafka.trigger.two
          partition: 1
          key: key-1
          body: snapshot.kafka.trigger.two-partition-1
          headers:
            X-Snapshot-Batch: bulk
          messageCount: 100
        - topic: snapshot.kafka.trigger.two
          partition: 2
          key: key-2
          body: snapshot.kafka.trigger.two-partition-2
          headers:
            X-Snapshot-Batch: bulk
          messageCount: 100
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 600
        headers:
          Content-Type: application/json
          X-Snapshot-Batch: bulk
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
          consumerAction: stop-until-published
          awaitCommit: true
          expectedCompletionHeaders:
            Content-Type: application/json
            X-Snapshot-Batch: bulk
    timeoutSeconds: 60
  - id: ignores-an-unsubscribed-topic
    expectedBehavior: Consume the subscribed record while leaving the record on the unsubscribed topic unprocessed.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
      parameters:
        topic: snapshot.kafka.trigger.two
        partition: 2
    body: subscribed-after-bulk
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
    expectedAbsentHeaders:
    - X-Snapshot-Batch
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:

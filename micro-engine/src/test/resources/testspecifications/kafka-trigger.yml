          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: empty-content-type
    expectedBehavior: Keep an explicitly empty content type as an empty string.
    body: empty-content-type
    headers:
      Content-Type: ''
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: ''
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: empty-content-type
        headers:
          Content-Type: ''
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: null-content-type
    expectedBehavior: Apply the configured JSON content type when the incoming content type is null.
    body: null-content-type
    headers:
      Content-Type: null
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: null-content-type
        headers:
          Content-Type: application/json
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: repeated-and-empty-headers
    expectedBehavior: Map repeated and empty custom headers while preserving the declared null-header behavior.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
      parameters:
        topic: snapshot.kafka.trigger.one
        partition: 0
        recordHeaders:
        - key: X-Snapshot-Repeat
          value: second
        - key: X-Snapshot-Repeat
          value: last
        - key: X-Snapshot-Empty
          value: ''
        - key: X-Snapshot-Null
          value: null
    body: header-values
    headers:
      X-Snapshot-Repeat: first
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
      X-Snapshot-Repeat: last
      X-Snapshot-Empty: ''
      X-Snapshot-Null: null
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: header-values
        headers:
          Content-Type: application/json
          X-Snapshot-Repeat: last
          X-Snapshot-Empty: ''
          X-Snapshot-Null: null
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
  - id: protected-kafka-and-camel-headers
    expectedBehavior: >-
      Retain actual Kafka metadata and allowed headers while filtering protected Kafka and Camel header names.
    driver:
      provider: kafka-trigger
      sourceElementId: 6bc40d46-ffcd-45d6-b1f3-9f32c5bf4599
      parameters:
        topic: snapshot.kafka.trigger.one
        partition: 0
        key: real-key
        timestamp: 1000
    body: protected-metadata
    headers:
      kafka.TOPIC: spoofed-topic
      kafka.PARTITION: '999'
      kafka.OFFSET: '999'
      kafka.KEY: spoofed-key
      kafka.TIMESTAMP: '999'
      CamelMessageTimestamp: '999'
      CamelSnapshot: filtered
      camelSnapshot: filtered
      org.apache.camel.snapshot: filtered
      kafka.snapshot: filtered
      X-Snapshot-Allowed: kept
    expectedBody: Triggered
    expectedHeaders:
      Content-Type: application/json
      kafka.TOPIC: snapshot.kafka.trigger.one
      kafka.PARTITION: 0
      kafka.KEY: real-key
      X-Snapshot-Allowed: kept
    expectedAbsentHeaders:
    - CamelSnapshot
    - camelSnapshot
    - org.apache.camel.snapshot
    - kafka.snapshot
    expectedProperties:
      internalProperty_sessionFailed: null
      internalProperty_elementFailed: null
    interactions:
    - fixture: kafka-broker
      expectedRequest:
        count: 1
        body: protected-metadata
        headers:
          Content-Type: application/json
          kafka.TOPIC: snapshot.kafka.trigger.one
          kafka.PARTITION: 0
          kafka.KEY: real-key
          X-Snapshot-Allowed: kept
      response:
        properties:
          expectedCompletionBody: Triggered
          expectedCompletionProperties:
            internalProperty_sessionFailed: null
            internalProperty_elementFailed: null
          expectedAbsentHeaders:
          - CamelSnapshot
          - camelSnapshot
          - org.apache.camel.snapshot
          - kafka.snapshot

# yaml-language-server: $schema=../testspecifications.schema.json
subject: "loop"
deployments:
  - id: "loop"
    route: "loop"
  - id: "loop-copy-context"
    route: "loop copy context true"
  - id: "loop-without-copy"
    route: "loop copy context false"
scenarios:
  - id: "loop-completes"
    expectedBehavior: "Execute ten iterations, increment the accumulated value to ten, and reduce the counter to zero."
    scope: Short
    endpointUri: "cip-chain:37a60fa1-2564-4c62-92e9-2b5f82fe5933"
    body: "Original"
    expectedProperties:
      increment: 10
      counter: 0

  - id: "skips-iterations-when-counter-is-zero"
    expectedBehavior: "Skip the loop body when the counter starts at zero and leave the increment and counter at zero."
    scope: Short
    endpointUri: "cip-chain:37a60fa1-2564-4c62-92e9-2b5f82fe5933"
    body: "Original"
    properties:
      counter: 0
    expectedProperties:
      increment: 0
      counter: 0

  - id: "enforces-maximum-iteration-limit"
    expectedBehavior: >-
      Permit fifteen iterations and reject the next iteration with IterationLimitException while preserving the
      observed counters.
    scope: Short
    endpointUri: "cip-chain:37a60fa1-2564-4c62-92e9-2b5f82fe5933"
    invocations:
      - id: "completes-after-fifteen-iterations"
        expectedBehavior: "Complete exactly fifteen iterations and return increment fifteen with a zero counter."
        body: "Original"
        properties:
          counter: 15
        expectedProperties:
          increment: 15
          counter: 0
      - id: "fails-before-sixteenth-iteration"
        expectedBehavior: >-
          Reject the sixteenth iteration with IterationLimitException, leaving increment fifteen and one
          iteration unconsumed.
        body: "Original"
        properties:
          counter: 16
        expectedFailure:
          type: "org.qubership.integration.platform.engine.camel.exceptions.IterationLimitException"
          message: "Maximum number of iterations reached"
          cause: null
        expectedProperties:
          increment: 15
          counter: 1

  - id: "copies-start-context-for-each-counted-iteration"
    expectedBehavior: >-
      Start each counted iteration from the copied initial context, so only the last iteration's body is
      returned.
    scope: Short
    endpointUri: "cip-chain:323784c9-d55f-491f-b0da-4cc25a002243"
    body: "Original"
    properties:
      iterations: 3
    expectedBody: "S:2"

  - id: "skips-counted-iterations-when-count-is-zero"
    expectedBehavior: "Keep the original body when a counted loop with copied context has zero iterations."
    scope: Short
    endpointUri: "cip-chain:323784c9-d55f-491f-b0da-4cc25a002243"
    body: "Original"
    properties:
      iterations: 0
    expectedBody: "S"

  - id: "reuses-context-across-counted-iterations"
    expectedBehavior: >-
      Accumulate all three iteration results in the shared context, record their order, and remove the custom
      iteration index afterward.
    scope: Short
    endpointUri: "cip-chain:84cc25ef-9aeb-424d-8162-5e8fe9cd6602"
    body: "Original"
    properties:
      iterations: 3
    expectedBody: "S:0:1:2"
    expectedProperties:
      visitedIterations: [0, 1, 2]
      iterationIndex: null

  - id: "skips-counted-iterations-without-copy-when-count-is-zero"
    expectedBehavior: >-
      Keep the original body and empty visit history for a zero-count shared-context loop, with no iteration
      index retained.
    scope: Short
    endpointUri: "cip-chain:84cc25ef-9aeb-424d-8162-5e8fe9cd6602"
    body: "Original"
    properties:
      iterations: 0
    expectedBody: "S"
    expectedProperties:
      visitedIterations: []
      iterationIndex: null

  - id: "clears-custom-iteration-index-after-script-failure"
    expectedBehavior: >-
      Propagate the script failure on the second iteration, retain preceding results and visit history, and
      clear the iteration index.
    scope: Short
    endpointUri: "cip-chain:84cc25ef-9aeb-424d-8162-5e8fe9cd6602"
    invocations:
      - id: "fails-on-second-iteration"
        expectedBehavior: >-
          Propagate the script failure on the second iteration, retain preceding results and visit history, and
          clear the iteration index.
        body: "Original"
        properties:
          iterations: 3
          failAtIteration: 1
        expectedFailure:
          type: "java.lang.IllegalStateException"
          message: "Loop failed at iteration index 1"
          cause: null
        expectedBody: "S:0"
        expectedProperties:
          visitedIterations: [0, 1]
          iterationIndex: null

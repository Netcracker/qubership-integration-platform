    driver:
      provider: routeSelector
      sourceElementId: 49e5f58d-bc48-4c85-adbd-0aa107a9a95e
    invocations:
      - id: omits-null-direct-fields-and-evaluates-the-expression
        expectedBehavior: "Omit null direct fields while evaluating the name expression and using the dictionary fallback."
        body: '{"personId":"person-null","phone":null,"firstName":null,"lastName":"Hopper","marketingConsent":null,"email":null,"countryCode":null,"city":null}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        properties:
          personId: stale-property-id
          unrelatedProperty: preserved
        expectedBody:
          customerId: person-null
          displayName: _Hopper
          residence: Planet Earth
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: person-null
          X-Unchanged-Header: preserved
        expectedProperties:
          personId: person-null
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: retains-incoming-target-metadata-when-person-id-is-null
        expectedBehavior: "Preserve the incoming target ID header and property when the source person ID is explicitly null."
        body: '{"personId":null,"phone":null,"firstName":null,"lastName":null,"marketingConsent":null,"email":null,"countryCode":null,"city":null}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        properties:
          personId: stale-property-id
          unrelatedProperty: preserved
        expectedBody:
          displayName: _
          residence: Planet Earth
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        expectedProperties:
          personId: stale-property-id
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null

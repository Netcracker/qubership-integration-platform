  - id: isolates-cached-mapping-between-invocations
    expectedBehavior: >-
      Reuse the cached mapping without retaining fields or target metadata from earlier complete or sparse
      requests.
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: 49e5f58d-bc48-4c85-adbd-0aa107a9a95e
    invocations:
      - id: maps-the-first-complete-customer
        expectedBehavior: >-
          Map every configured field of the first complete customer and replace incoming target metadata with
          its ID.
        body: '{"personId":"cache-first","phone":"first-phone","firstName":"First","lastName":"Customer","marketingConsent":true,"email":"first@example.com","countryCode":"NL","city":"First
          city"}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: first
        properties:
          personId: stale-property-id
          unrelatedProperty: first
        expectedBody:
          customerId: cache-first
          phoneNumber: first-phone
          displayName: First_Customer
          marketingAllowed: true
          emailAddress: first@example.com
          residence: Netherland
          city: First city
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: cache-first
          X-Unchanged-Header: first
        expectedProperties:
          personId: cache-first
          unrelatedProperty: first
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: does-not-reuse-fields-from-the-first-customer
        expectedBehavior: >-
          Map only fields available in the sparse customer without leaking direct fields or ID metadata from the
          first request.
        body: '{"personId":"cache-second","firstName":"Second"}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: second
        properties:
          personId: stale-property-id
          unrelatedProperty: second
        expectedBody:
          customerId: cache-second
          displayName: Second_
          residence: Planet Earth
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: cache-second
          X-Unchanged-Header: second
        expectedProperties:
          personId: cache-second
          unrelatedProperty: second
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: maps-fresh-values-after-the-sparse-customer
        expectedBehavior: >-
          Populate all mapped fields from the third customer's fresh input rather than either preceding cached-
          session result.
        body: '{"personId":"cache-third","phone":"third-phone","firstName":"Third","lastName":"Customer","marketingConsent":false,"email":"third@example.com","countryCode":"AQ","city":"Third
          city"}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: third
        properties:
          personId: stale-property-id
          unrelatedProperty: third
        expectedBody:
          customerId: cache-third
          phoneNumber: third-phone
          displayName: Third_Customer
          marketingAllowed: false
          emailAddress: third@example.com
          residence: Antarctica
          city: Third city
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: cache-third
          X-Unchanged-Header: third
        expectedProperties:
          personId: cache-third
          unrelatedProperty: third
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null

  - id: maps-body-and-metadata-sources-without-state-leakage
    expectedBehavior: >-
      Build JSON from body, header, and property sources without reusing missing metadata from prior
      invocations.
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: 2b66944e-4a13-517d-80b1-9803e27cad00
    invocations:
      - id: maps-body-header-and-property-into-the-json-body
        expectedBehavior: >-
          Combine the current body ID, region header, and correlation property into JSON while preserving
          unrelated metadata.
        body: '{"customerId":"M-1"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
          X-Region: header-region
        properties:
          unrelatedProperty: preserved
          correlationId: property-correlation
        expectedBody:
          id: M-1
          region: header-region
          correlationId: property-correlation
        expectedHeaders:
          Content-Type: application/json
          X-Unchanged-Header: preserved
          X-Region: header-region
        expectedProperties:
          unrelatedProperty: preserved
          correlationId: property-correlation
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: omits-missing-metadata-without-reusing-the-previous-input
        expectedBehavior: "Omit absent header/property source fields without retaining values from the previous request."
        body: '{"customerId":"M-2"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
        properties:
          unrelatedProperty: preserved
        expectedBody:
          id: M-2
        expectedHeaders:
          Content-Type: application/json
          X-Unchanged-Header: preserved
        expectedProperties:
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
          correlationId: null
        expectedAbsentHeaders:
          - X-Region
      - id: uses-fresh-unicode-and-empty-metadata-values
        expectedBehavior: >-
          Map the fresh Unicode region and explicitly empty correlation property without replacing them with
          previous values.
        body: '{"customerId":"M-3"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
          X-Region: café & <region>
        properties:
          unrelatedProperty: preserved
          correlationId: ''
        expectedBody:
          id: M-3
          region: café & <region>
          correlationId: ''
        expectedHeaders:
          Content-Type: application/json
          X-Unchanged-Header: preserved
          X-Region: café & <region>
        expectedProperties:
          unrelatedProperty: preserved
          correlationId: ''
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
  - id: distinguishes-schema-and-transformation-defaults-and-conditional-branches
    expectedBehavior: >-
      Distinguish missing, null, empty, and supplied inputs for both kinds of defaults and select both
      conditional branches.
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: 3ad880d6-8a3b-5ddb-a6d4-d0b4252346ee
    invocations:
      - id: uses-both-defaults-for-missing-fields
        expectedBehavior: >-
          Apply both the schema default and transformation default to missing fields and select the active
          conditional branch.
        body: '{"status":"active"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
        properties:
          unrelatedProperty: preserved
        expectedBody:
          schemaDefault: schema-default
          fallbackValue: fallback-value
          state: enabled
        expectedHeaders:
          Content-Type: application/json
          X-Unchanged-Header: preserved
        expectedProperties:
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: distinguishes-explicit-null-from-a-missing-schema-field
        expectedBehavior: >-
          Omit the explicitly null schema field, apply the transformation default to null, and select the
          inactive conditional branch.
        body: '{"schemaInput":null,"fallbackInput":null,"status":"inactive"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
        properties:
          unrelatedProperty: preserved
        expectedBody:
          fallbackValue: fallback-value
          state: disabled
        expectedHeaders:
          Content-Type: application/json
          X-Unchanged-Header: preserved
        expectedProperties:
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: preserves-an-empty-schema-value-and-applies-the-transformation-default
        expectedBehavior: >-
          Preserve the empty schema field while replacing the empty transformation input with its default and
          selecting the active branch.
        body: '{"schemaInput":"","fallbackInput":"","status":"active"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
        properties:
          unrelatedProperty: preserved
        expectedBody:
          schemaDefault: ''
          fallbackValue: fallback-value
          state: enabled
        expectedHeaders:
          Content-Type: application/json
          X-Unchanged-Header: preserved
        expectedProperties:
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: uses-supplied-values-and-the-false-condition-branch
        expectedBehavior: "Keep both supplied values rather than their defaults and select the inactive conditional branch."
        body: '{"schemaInput":"provided-schema","fallbackInput":"provided-fallback","status":"inactive"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
        properties:
          unrelatedProperty: preserved
        expectedBody:
          schemaDefault: provided-schema
          fallbackValue: provided-fallback
          state: disabled
        expectedHeaders:
          Content-Type: application/json
          X-Unchanged-Header: preserved
        expectedProperties:
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: restores-defaults-after-a-fully-populated-request
        expectedBehavior: >-
          Apply the defaults again to missing fields without retaining supplied values from the previous
          request.
        body: '{"status":"active"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
        properties:
          unrelatedProperty: preserved
        expectedBody:
          schemaDefault: schema-default
          fallbackValue: fallback-value
          state: enabled

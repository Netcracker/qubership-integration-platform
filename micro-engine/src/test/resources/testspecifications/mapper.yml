# yaml-language-server: $schema=../testspecifications.schema.json
scenarios:
  - id: "maps-customer-and-generates-values"
    expectedBehavior: >-
      Map customer fields, dictionary values, constants, and generated UUID/date-time formats; update target
      metadata and clear internal mapping properties.
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: 49e5f58d-bc48-4c85-adbd-0aa107a9a95e
    body: |-
      {"personId":"person-123","phone":"+1-202-555-0100","firstName":"Ada","lastName":"Lovelace","marketingConsent":true,"email":"ada@example.com","countryCode":"US","city":"London"}
    headers:
      "Content-Type": "text/plain"
      "X-Person-Id": "stale-person-id"
      "X-Unchanged-Header": "preserved"
    properties:
      "personId": "stale-person-id"
      "unrelatedProperty": "preserved"
    expectedBody: {
      "customerId": "person-123",
      "phoneNumber": "+1-202-555-0100",
      "preferredContactChannel": "PHONE",
      "displayName": "Ada_Lovelace",
      "marketingAllowed": true,
      "emailAddress": "ada@example.com",
      "loyaltyProgramId": {
        "$match": "uuid"
      },
      "residence": "United States",
      "registeredAt": {
        "$match": "date-time",
        "format": "uuuu-MM-dd'T'HH:mm:ss'Z'"
      },
      "city": "London"
    }
    expectedHeaders:
      "Content-Type": "application/json"
      "X-Person-Id": "person-123"
      "X-Unchanged-Header": "preserved"
    expectedProperties:
      "personId": "person-123"
      "unrelatedProperty": "preserved"
      internalProperty_mappingConfig: null
      internalProperty_mappingId: null
      internalProperty_mappingThrowException: null

  - id: maps-all-dictionary-entries-and-unknown-country-fallback
    expectedBehavior: >-
      Map each configured country dictionary entry and use its default for an unknown key while preserving
      unrelated metadata.
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: 49e5f58d-bc48-4c85-adbd-0aa107a9a95e
    invocations:
      - id: looks-up-the-netherlands
        expectedBehavior: "Map country code NL to the configured Netherland dictionary value and update the customer ID metadata."
        body: '{"personId":"person-nl","phone":"nl-phone","firstName":"Ada","lastName":"Dutch","marketingConsent":true,"email":"nl@example.com","countryCode":"NL","city":"Amsterdam"}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        properties:
          personId: stale-property-id
          unrelatedProperty: preserved
        expectedBody:
          customerId: person-nl
          phoneNumber: nl-phone
          displayName: Ada_Dutch
          marketingAllowed: true
          emailAddress: nl@example.com
          residence: Netherland
          city: Amsterdam
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: person-nl
          X-Unchanged-Header: preserved
        expectedProperties:
          personId: person-nl
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: looks-up-antarctica
        expectedBehavior: >-
          Map country code AQ to Antarctica while producing the current customer's mapped fields and generated
          value formats.
        body: '{"personId":"person-aq","phone":"aq-phone","firstName":"Grace","lastName":"Polar","marketingConsent":true,"email":"aq@example.com","countryCode":"AQ","city":"McMurdo"}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        properties:
          personId: stale-property-id
          unrelatedProperty: preserved
        expectedBody:
          customerId: person-aq
          phoneNumber: aq-phone
          displayName: Grace_Polar
          marketingAllowed: true
          emailAddress: aq@example.com
          residence: Antarctica
          city: McMurdo
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: person-aq
          X-Unchanged-Header: preserved
        expectedProperties:
          personId: person-aq
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: uses-the-dictionary-fallback-for-an-unknown-key
        expectedBehavior: "Map an unconfigured country code to Planet Earth rather than omitting the residence field."
        body: '{"personId":"person-gb","phone":"gb-phone","firstName":"Alan","lastName":"Turing","marketingConsent":true,"email":"gb@example.com","countryCode":"GB","city":"London"}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        properties:
          personId: stale-property-id
          unrelatedProperty: preserved
        expectedBody:
          customerId: person-gb
          phoneNumber: gb-phone
          displayName: Alan_Turing
          marketingAllowed: true
          emailAddress: gb@example.com
          residence: Planet Earth
          city: London
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: person-gb
          X-Unchanged-Header: preserved
        expectedProperties:
          personId: person-gb
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null

  - id: throws-on-conversion-failure-and-recovers
    expectedBehavior: >-
      Throw the exact numeric source-conversion error in strict mode without replacing the input, then map a
      fresh valid request successfully.
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: 67072068-dc19-5b48-bae0-42cd16df5a86
    invocations:
      - id: maps-valid-numeric-text
        expectedBehavior: >-
          Convert valid numeric text to a JSON number, preserve the current ID, and remove internal mapping
          properties.
        body: '{"id":"first","amount":"12.5"}'
        headers:
          Content-Type: text/plain
          X-Trace-Id: first
        properties:
          marker: first
        expectedBody:
          id: first
          amount: 12.5
        expectedHeaders:
          Content-Type: application/json
          X-Trace-Id: first
        expectedProperties:
          marker: first
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: reports-invalid-numeric-text
        expectedBehavior: >-
          Throw the exact conversion exception without a cause, retaining the original body, content type, and
          unrelated request metadata.
        body: '{"id":"invalid","amount":"not-a-number"}'
        headers:
          Content-Type: text/plain
          X-Trace-Id: invalid
        properties:
          marker: invalid
        expectedBody: '{"id":"invalid","amount":"not-a-number"}'
        expectedFailure:
          type: java.lang.Exception
          message: "Failed to perform mapping: path: /amount, message: \"Failed to convert field value 'not-a-number' into type 'NUMBER'\""
          cause: null
        expectedHeaders:
          Content-Type: text/plain
          X-Trace-Id: invalid
        expectedProperties:
          marker: invalid
      - id: recovers-with-fresh-valid-text
        expectedBehavior: >-
          Convert a fresh valid amount after the failed conversion, returning the new ID and clearing internal
          mapping properties.
        body: '{"id":"fresh","amount":"3.25"}'
        headers:
          Content-Type: text/plain
          X-Trace-Id: fresh
        properties:
          marker: fresh
        expectedBody:
          id: fresh
          amount: 3.25
        expectedHeaders:
          Content-Type: application/json
          X-Trace-Id: fresh
        expectedProperties:
          marker: fresh
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null

  - id: preserves-unicode-and-json-special-characters
    expectedBehavior: "Preserve Unicode, quotes, backslashes, and line breaks in mapped JSON fields and target metadata."
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: 49e5f58d-bc48-4c85-adbd-0aa107a9a95e
    invocations:
      - id: round-trips-quotes-backslashes-and-line-breaks
        expectedBehavior: "Preserve Unicode, quotes, backslashes, and line breaks in mapped JSON fields and target metadata."
        body: '{"personId":"person-café","phone":"+1-202-555-0199","firstName":"José \"Pepe\"","lastName":"O\\Connor
          & <family>","marketingConsent":false,"email":"jose+test@example.com","countryCode":"NL","city":"Café\nRoom
          \"A\" \\ HQ"}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        properties:
          personId: stale-property-id
          unrelatedProperty: preserved
        expectedBody:
          customerId: person-café
          phoneNumber: +1-202-555-0199
          displayName: José "Pepe"_O\Connor & <family>
          marketingAllowed: false
          emailAddress: jose+test@example.com
          residence: Netherland
          city: |-
            Café
            Room "A" \ HQ
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: person-café
          X-Unchanged-Header: preserved
        expectedProperties:
          personId: person-café
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
  - id: handles-missing-optional-fields
    expectedBehavior: >-
      Omit absent direct fields, apply the configured expression and dictionary fallback, and retain incoming
      target metadata when its source is absent.
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: 49e5f58d-bc48-4c85-adbd-0aa107a9a95e
    invocations:
      - id: maps-a-minimal-customer-with-a-missing-last-name
        expectedBehavior: >-
          Map the supplied ID and first name, use an empty last-name expression operand and country fallback,
          and omit absent direct fields.
        body: '{"personId":"person-minimal","firstName":"Grace"}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        properties:
          personId: stale-property-id
          unrelatedProperty: preserved
        expectedBody:
          customerId: person-minimal
          displayName: Grace_
          residence: Planet Earth
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: person-minimal
          X-Unchanged-Header: preserved
        expectedProperties:
          personId: person-minimal
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
      - id: maps-an-empty-object-and-retains-incoming-target-metadata
        expectedBehavior: >-
          Map an empty source object using the configured constants, expression, and dictionary fallback while
          retaining incoming target ID metadata.
        body: '{}'
        headers:
          Content-Type: text/plain
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        properties:
          personId: stale-property-id
          unrelatedProperty: preserved
        expectedBody:
          displayName: _
          residence: Planet Earth
          preferredContactChannel: PHONE
          loyaltyProgramId:
            $match: uuid
          registeredAt:
            $match: date-time
            format: uuuu-MM-dd'T'HH:mm:ss'Z'
        expectedHeaders:
          Content-Type: application/json
          X-Person-Id: stale-header-id
          X-Unchanged-Header: preserved
        expectedProperties:
          personId: stale-property-id
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null
  - id: handles-null-optional-fields
    expectedBehavior: >-
      Omit null direct fields, evaluate configured expressions and fallback, and preserve incoming target

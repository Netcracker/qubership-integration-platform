  - id: maps-nested-objects-and-collections-with-stable-item-association
    scope: Short
    driver:
      provider: routeSelector
      sourceElementId: cd429e00-0415-5441-80cd-13a24bfbd763
    invocations:
      - id: preserves-order-and-association-across-nested-array-items
        body: '{"profile":{"name":"Multiple orders","active":true},"orders":[{"id":"ORDER-B","quantity":2,"items":[{"sku":"SKU-B2","count":5},{"sku":"SKU-B1","count":0}]},{"id":"ORDER-A","quantity":0,"items":[{"sku":"SKU-A1","count":3}]}],"tags":["priority","café","priority"],"unmapped":"drop-me"}'
        headers:
          Content-Type: text/plain
          X-Unchanged-Header: preserved
        properties:
          unrelatedProperty: preserved
        expectedBody:
          customer:
            displayName: Multiple orders
            enabled: true
          purchases:
            - purchaseId: ORDER-B
              units: 2
              lines:
                - productCode: SKU-B2
                  amount: 5
                - productCode: SKU-B1
                  amount: 0
            - purchaseId: ORDER-A
              units: 0
              lines:
                - productCode: SKU-A1
                  amount: 3
          labels:
            - priority
            - café
            - priority
        expectedHeaders:
          Content-Type: application/json
          X-Unchanged-Header: preserved
        expectedProperties:
          unrelatedProperty: preserved
          internalProperty_mappingConfig: null
          internalProperty_mappingId: null
          internalProperty_mappingThrowException: null

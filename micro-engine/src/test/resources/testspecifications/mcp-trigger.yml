- id: suppresses-and-renews-native-business-keys
  expectedBehavior: >-
    Acquire business keys through the native tool, suppress duplicate business work, and reacquire an expired key.
  scope: Long
  deployment: idempotency-ignore
  driver:
    provider: mcp-trigger
    sourceElementId: ec1b8915-93c2-5b1e-97f3-79bb32a7ec95
  invocations:
  - id: acquires-the-first-business-key
    expectedBehavior: Acquire the first business key and execute the main route once.
    body:
      key: stable
    interactions:
    - fixture: idempotency-ignore-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - key: stable
    - fixture: idempotency-ignore-store
      expectedRequest:
        count: 1
        properties:
          insertionAttempts: 1
          key: snapshot-mcp-idempotency-ignore:stable
          keyExpiry: 60
          storedKeys:
          - snapshot-mcp-idempotency-ignore:stable
          updatedKeys:
          - snapshot-mcp-idempotency-ignore:stable
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: ignores-a-duplicate-business-key
    expectedBehavior: Accept the duplicate tool call without executing the main business route again.
    body:
      key: stable
    interactions:
    - fixture: idempotency-ignore-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 0
          expectedCapturedArguments:
          - key: stable
    - fixture: idempotency-ignore-store
      expectedRequest:
        count: 0
        properties:
          insertionAttempts: 1
          key: snapshot-mcp-idempotency-ignore:stable
          keyExpiry: 60
          storedKeys:
          - snapshot-mcp-idempotency-ignore:stable
          updatedKeys: []
    expectedBody:
      result:
        content:
        - type: text
          text: '{key=stable}'
        isError: false
  - id: accepts-a-distinct-business-key
    expectedBehavior: Acquire a distinct business key and execute the main route independently.
    body:
      key: other
    interactions:
    - fixture: idempotency-ignore-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - key: other
    - fixture: idempotency-ignore-store
      expectedRequest:
        count: 1
        properties:
          insertionAttempts: 1
          key: snapshot-mcp-idempotency-ignore:other
          keyExpiry: 60
          storedKeys:
          - snapshot-mcp-idempotency-ignore:other
          - snapshot-mcp-idempotency-ignore:stable
          updatedKeys:
          - snapshot-mcp-idempotency-ignore:other
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: acquires-an-expiring-business-key
    expectedBehavior: Acquire the key that is scheduled to expire and execute business work once.
    body:
      key: expires
    interactions:
    - fixture: idempotency-ignore-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - key: expires
    - fixture: idempotency-ignore-store
      expectedRequest:
        count: 1
        properties:
          insertionAttempts: 1
          key: snapshot-mcp-idempotency-ignore:expires
          keyExpiry: 60

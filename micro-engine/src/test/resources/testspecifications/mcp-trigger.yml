- id: returns-native-structured-results
  expectedBehavior: >-
    Return native structured MCP content and publish the output schema without enforcing it on chain results.
  scope: Short
  deployment: structured
  driver:
    provider: mcp-trigger
    sourceElementId: bbc3c625-8ffb-5ad7-bdf0-a5a9db833e07
  invocations:
  - id: returns-structured-content-with-an-output-schema
    expectedBehavior: Return the structured result and retain the exported output schema metadata.
    body:
      message: structured café
      items:
      - false
      - 2
      metadata:
        nested:
          value: kept
    interactions:
    - fixture: structured-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: structured café
            items:
            - false
            - 2
            metadata:
              nested:
                value: kept
          verifyMetadata: true
    expectedBody:
      result:
        isError: false
        structuredContent:
          received:
            message: structured café
            items:
            - false
            - 2
            metadata:
              nested:
                value: kept
          marker: structured
  - id: preserves-results-without-output-schema-enforcement
    expectedBehavior: Preserve the chain result even when its shape does not satisfy the advertised output schema.
    body:
      mode: wrong-output
    interactions:
    - fixture: structured-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - mode: wrong-output
    expectedBody:
      result:
        isError: false
        structuredContent:
          unexpected: 7
- id: reports-native-call-failures-and-retains-call-isolation
  expectedBehavior: >-
    Map unhandled chain failures to MCP errors and keep arguments and recovery independent across native calls.
  scope: Long
  deployment: base
  driver:
    provider: mcp-trigger
    sourceElementId: 6a834d9c-8cb2-4339-80b2-c44ab41b7fa0
  invocations:
  - id: reports-unhandled-chain-failure-and-recovers
    expectedBehavior: Return an MCP tool error containing the unhandled chain failure instead of a successful result.
    body:
      mode: fail
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - mode: fail
    expectedBody:
      result:
        content:
        - type: text
          text: MCP snapshot failure
        isError: true
  - id: recovers-after-an-unhandled-chain-failure
    expectedBehavior: Execute a successful call after the preceding unhandled chain failure.
    body:
      message: recovered
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: recovered
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: uses-the-exception-class-when-its-message-is-null
    expectedBehavior: Use the exception class as the tool error text when the exception message is null.
    body:
      mode: no-message
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - mode: no-message
    expectedBody:
      result:
        content:
        - type: text
          text: java.lang.IllegalStateException
        isError: true
  - id: recovers-after-a-message-less-failure
    expectedBehavior: Execute a successful call after the exception that has no message.
    body:
      message: recovered again
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: recovered again
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: isolates-arguments-between-sequential-calls
    expectedBehavior: Capture only the arguments supplied for the current sequential call.
    body:
      message: first
      requestTag: one
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: first
            requestTag: one
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: omits-the-previous-call-arguments
    expectedBehavior: Do not retain argument entries from the preceding call when the new map omits them.
    body: {}
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - {}
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: reports-top-level-null-before-chain-entry
    expectedBehavior: Reject a top-level null argument map before entering the business chain.
    body:
      message: null
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 0
      response:
        properties:
          expectedBusinessCount: 0
          expectedCapturedArguments: []
    expectedBody:
      error:
        code: -32603
        message: Internal error
  - id: recovers-after-a-null-argument-rejection
    expectedBehavior: Execute a valid argument map successfully after the null-argument rejection.
    body:
      message: after null
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: after null
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
- id: correlates-concurrent-native-tool-results
  expectedBehavior: Keep arguments and results correlated for overlapping native calls to the same generated MCP tool.
  scope: Long
  deployment: structured
  driver:
    provider: mcp-trigger
    sourceElementId: bbc3c625-8ffb-5ad7-bdf0-a5a9db833e07
  invocations:
  - id: correlates-concurrent-tool-calls
    expectedBehavior: >-
      Execute all three concurrent calls and associate each result with its own arguments without imposing
      completion order.
    body: {}
    interactions:
    - fixture: structured-tool
      expectedRequest:
        count: 3
      response:
        properties:
          expectedBusinessCount: 3
          expectedCapturedArguments:
          - message: parallel-0
            number: 0
          - message: parallel-1
            number: 1
          - message: parallel-2
            number: 2
          unorderedCapturedArguments: true
    expectedBody:
    - result:
        isError: false
        structuredContent:
          received:
            message: parallel-0
            number: 0
          marker: structured
    - result:
        isError: false
        structuredContent:
          received:
            message: parallel-1
            number: 1
          marker: structured
    - result:
        isError: false
        structuredContent:
          received:
            message: parallel-2
            number: 2
          marker: structured
    driver:
      provider: mcp-trigger
      sourceElementId: bbc3c625-8ffb-5ad7-bdf0-a5a9db833e07
      parameters:
        operation: concurrent
        parallelArguments:
        - message: parallel-0
          number: 0
        - message: parallel-1
          number: 1
        - message: parallel-2
          number: 2

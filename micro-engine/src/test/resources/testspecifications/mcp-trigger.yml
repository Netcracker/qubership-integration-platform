scenarios:
- id: registers-and-invokes-the-generated-tool
  expectedBehavior: >-
    Register the exported MCP tool metadata, forward call arguments to its route, and isolate rejected and
    successful calls.
  scope: Short
  deployment: base
  driver:
    provider: mcp-trigger
    sourceElementId: 6a834d9c-8cb2-4339-80b2-c44ab41b7fa0
  invocations:
  - id: registers-generated-tool-metadata
    expectedBehavior: Register the generated tool metadata and invoke its business route once.
    body: {}
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - {}
          verifyMetadata: true
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: passes-arguments-and-generated-route-identity
    expectedBehavior: Forward the supplied arguments to the generated route with the expected tool and route identity.
    body:
      message: first call
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: first call
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: preserves-utf8-and-escaped-text-arguments
    expectedBehavior: Preserve UTF-8 characters, quotes, and escaped text in the captured tool arguments.
    body:
      message: "café \"quoted\"\nnext line\tend"
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: "café \"quoted\"\nnext line\tend"
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: returns-text-without-an-output-schema
    expectedBehavior: Return native text content for a tool that declares no output schema.
    body:
      message: ''
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: ''
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: rejects-an-unknown-tool-without-chain-execution
    expectedBehavior: Return the native unknown-tool error without entering the business chain.
    body: {}
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 0
      response:
        properties:
          expectedBusinessCount: 0
          expectedCapturedArguments: []
    expectedBody:
      error:
        code: -32602
        message: 'Invalid tool name: snapshot_missing_tool'
    driver:
      provider: mcp-trigger
      sourceElementId: 6a834d9c-8cb2-4339-80b2-c44ab41b7fa0
      parameters:
        toolName: snapshot_missing_tool
  - id: recovers-after-an-unknown-tool-call
    expectedBehavior: Invoke a valid tool successfully after the unknown-tool rejection.
    body:
      message: after unknown
    interactions:
    - fixture: base-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: after unknown
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
- id: preserves-arguments-through-the-native-tool-manager
  expectedBehavior: >-
    Preserve typed and nested argument values through native MCP calls without adding schema enforcement at chain
    entry.
  scope: Short
  deployment: typed
  driver:
    provider: mcp-trigger
    sourceElementId: f9ace031-e144-5ddd-aa38-c6b11fcc3045
  invocations:
  - id: preserves-typed-and-nested-arguments
    expectedBehavior: Forward the exact typed and nested argument map and retain the exported tool metadata.
    body:
      message: typed café
      number: 3.25
      enabled: false
      items:
      - 1
      - two
      - true
      metadata:
        nested:
          value: null
        empty: []
    interactions:
    - fixture: typed-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: typed café
            number: 3.25
            enabled: false
            items:
            - 1
            - two
            - true
            metadata:
              nested:
                value: null
              empty: []
          verifyMetadata: true
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: forwards-values-without-schema-enforcement
    expectedBehavior: Forward argument values unchanged even when they do not satisfy the advertised schema.
    body:
      message: 7
      extra: undeclared
    interactions:
    - fixture: typed-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - message: 7
            extra: undeclared
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: forwards-a-missing-required-field
    expectedBehavior: Forward the supplied argument map even when an advertised required field is missing.
    body:
      enabled: true
    interactions:
    - fixture: typed-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - enabled: true
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false
  - id: accepts-an-empty-argument-map
    expectedBehavior: Accept an empty argument map and enter the business route once.
    body: {}
    interactions:
    - fixture: typed-tool
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedCapturedArguments:
          - {}
    expectedBody:
      result:
        content:
        - type: text
          text: Triggered
        isError: false

# yaml-language-server: $schema=../testspecifications.schema.json
subject: "parent"
deployments:
  - id: "parent"
    route: "nested-async-parent"
    dependsOn:
      - "child"
  - id: "child"
    route: "nested-async-child"
fixtures:
  - id: "child-branches"
    provider: "async-flow"
    deployment: "child"
  - id: "parent-branches"
    provider: "async-flow"
    deployment: "parent"
scenarios:
  - id: "returns-before-parent-and-child-branches-complete"
    endpointUri: "cip-chain:14a39104-0635-459e-9132-67267ee81748"
    body: "Original"
    headers:
      X-Test-Request: "request-value"
    expectedBody: "Original"
    expectedHeaders:
      X-Test-Request: "request-value"
    expectedAbsentHeaders:
      - "X-Parent-Branch"
      - "X-Child-Branch"
    interactions:
      - fixture: "parent-branches"
        expectedExchanges:
          - count: 1
            body: "Parent branch"
            headers:
              X-Test-Request: "request-value"
              X-Parent-Branch: "completed"
      - fixture: "child-branches"
        expectedExchanges:
          - count: 1
            body: "Child branch"
            headers:
              X-Test-Request: "request-value"
              X-Child-Branch: "completed"

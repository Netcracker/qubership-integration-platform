# yaml-language-server: $schema=../testspecifications.schema.json
fixtures:
  - id: pubsub-publisher
    provider: pubsub-grpc
    sourceElementId: f4644776-fa54-4910-9795-30854b0f2b73
scenarios:
  - id: publishes-distinct-messages-with-ordering-and-context
    expectedBehavior: >-
      Deliver distinct Pub/Sub messages with ordering keys, UTF-8 data, attributes, and restored context while
      reusing OAuth credentials.
    scope: Short
    endpointUri: cip-chain:408ab0fe-3146-477d-9cdf-35c49486cec2
    invocations:
      - id: first-message
        expectedBehavior: "Deliver the first ordered message with its attributes and request a valid OAuth token once."
        body: Order received
        headers:
          Authorization: Bearer first-snapshot-token
          X-Request-Id: incoming-first
          X-Snapshot-Header: first-value
          CamelGooglePubsubOrderingKey: ignored-header-key
          CamelGooglePubsubAttributes:
            source: snapshot
            attempt: '1'
        properties:
          outboundRequestId: outgoing-first
          orderingKey: order-101
        expectedBody: Order received
        expectedHeaders:
          Authorization: Bearer first-snapshot-token
          X-Snapshot-Header: first-value
        expectedAbsentHeaders:
          - X-Request-Id
          - CamelGooglePubsubOrderingKey
        expectedProperties:
          internalProperty_overrideContextParams: null
        interactions:
          - fixture: pubsub-publisher
            expectedRequest:
              count: 1
              destination: topicName
              key: order-101
              body: Order received
              headers:
                X-Request-Id: outgoing-first
                CamelGooglePubsubOrderingKey: null
                Authorization: null
                X-Snapshot-Header: first-value
                CamelGooglePubsubAttributes: null
                source: snapshot
                attempt: '1'
            response:
              properties:
                expectedTokenRequests: 1
      - id: second-message-with-utf8
        expectedBehavior: "Preserve UTF-8 payload bytes and ordering while reusing the cached OAuth token."
        body: "Order received - caf\u00e9"
        headers:
          Authorization: Bearer second-snapshot-token
          X-Request-Id: incoming-second
          X-Snapshot-Header: second-value
        properties:
          outboundRequestId: outgoing-second
          orderingKey: order-202
        expectedBody: "Order received - caf\u00e9"
        expectedHeaders:
          Authorization: Bearer second-snapshot-token
          X-Snapshot-Header: second-value
        expectedAbsentHeaders:
          - X-Request-Id
          - CamelGooglePubsubAttributes
          - CamelGooglePubsubOrderingKey
        expectedProperties:
          internalProperty_overrideContextParams: null
        interactions:
          - fixture: pubsub-publisher
            expectedRequest:
              count: 1
              destination: topicName
              key: order-202
              body: "Order received - caf\u00e9"
              headers:
                X-Request-Id: outgoing-second
                CamelGooglePubsubOrderingKey: null
                Authorization: null
                X-Snapshot-Header: second-value
                source: null
                attempt: null
            response:
              properties:
                expectedTokenRequests: 0

scenarios:
- id: consumes-values-attributes-and-metadata-with-auto-ack
  expectedBehavior: >-
    Preserve message bytes and attributes while providing native metadata and isolated AUTO-mode deliveries.
  reuseBroker: true
  scope: Short
  deployment: auto
  driver:
    provider: pubsub-trigger
    sourceElementId: d9d4b792-23bd-4438-ae92-58f840fe84f6
  invocations:
  - id: utf8-values
    expectedBehavior: >-
      Consume the UTF-8 payload with its expected attributes and native message metadata.
    body: Hello from the café
    expectedBody: Triggered
    headers:
      source: snapshot
      businessKey: first
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties: {}
  - id: json-as-raw-bytes
    expectedBehavior: >-
      Consume the JSON message as the expected raw bytes with its published attributes.
    body: '{"order":{"id":42,"status":"RECEIVED"}}'
    expectedBody: Triggered
    headers:
      Content-Type: application/json
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties: {}
  - id: binary-invalid-utf8
    expectedBehavior: >-
      Preserve binary bytes that do not form valid UTF-8 while consuming the message once.
    body:
    - 0
    - 255
    - 128
    - 254
    - 10
    - 13
    - 127
    expectedBody: Triggered
    headers:
      encoding: binary
    driver:
      provider: pubsub-trigger
      sourceElementId: d9d4b792-23bd-4438-ae92-58f840fe84f6
      parameters:
        dataEncoding: bytes
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties: {}
  - id: empty-with-attributes
    expectedBehavior: >-
      Consume an empty payload without losing its published message attributes.
    body: ''
    expectedBody: Triggered
    headers:
      empty: ''
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties: {}
  - id: null-as-empty-with-attributes
    expectedBehavior: >-
      Treat the null publication as empty bytes while preserving its attributes.
    body: null
    expectedBody: Triggered
    headers:
      empty: null-source
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties: {}
  - id: same-payload-distinct-message-ids
    expectedBehavior: >-
      Consume all five publications independently despite identical payloads, with distinct broker message
      IDs.
    body: same-payload
    expectedBody:
    - Triggered
    - Triggered
    - Triggered
    - Triggered
    - Triggered
    driver:
      provider: pubsub-trigger
      sourceElementId: d9d4b792-23bd-4438-ae92-58f840fe84f6
      parameters:
        messageCount: 5
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 5
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties: {}
  - id: attributes-cannot-forge-metadata
    expectedBehavior: >-
      Preserve native message metadata and exclude internal context headers that application attributes cannot
      replace.
    body: metadata
    expectedBody: Triggered
    headers:
      Authorization: Bearer attribute-only
      X-Request-Id: attribute-only
      CamelGooglePubsubMessageId: forged-id
      CamelGooglePubsubPublishTime: forged-time
      snapshotPrevious: attribute-only
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties:
          expectedAbsentHeaders:
          - Authorization
          - X-Request-Id
          - snapshotPrevious
  - id: clean-message-after-attributed-message
    expectedBehavior: >-
      Consume a fresh message without retaining context headers or attributes from the previous delivery.
    body: clean
    expectedBody: Triggered
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties:
          expectedAbsentHeaders:
          - Authorization
          - X-Request-Id
          - snapshotPrevious
- id: consumes-repeated-publications-with-auto-ack
  expectedBehavior: >-
    Consume and acknowledge each repeated publication once with an independent first delivery attempt.
  reuseBroker: true
  scope: Short
  deployment: auto
  driver:
    provider: pubsub-trigger
    sourceElementId: d9d4b792-23bd-4438-ae92-58f840fe84f6
  invocations:
  - id: repeated-publication
    expectedBehavior: >-
      Acknowledge both repeated publications once and report their first delivery attempt.
    repeat: 2
    body: repeated-payload
    headers:
      source: repeated-publication
    expectedBody: Triggered
    expectedHeaders:
      snapshotDeliveryAttempt: 1
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 2
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
        headers:
          CamelGooglePubsubAttributes:
            source: repeated-publication
      response:
        properties:
          expectedAcknowledgments: 2
          expectedNegativeAcknowledgments: 0
          expectedCompletions:
          - count: 2
            body: Triggered
            headers:
              snapshotDeliveryAttempt: 1
- id: redelivers-each-repeated-publication-after-script-failure
  expectedBehavior: >-
    Negatively acknowledge each failed publication, redeliver it successfully, and keep later publications
    independent.
  reuseBroker: true
  scope: Long
  deployment: auto
  driver:
    provider: pubsub-trigger
    sourceElementId: d9d4b792-23bd-4438-ae92-58f840fe84f6
  invocations:
  - id: repeated-failure-and-redelivery
    expectedBehavior: >-
      Record each initial script failure, NACK both messages, and acknowledge their successful second delivery
      attempts.
    repeat: 2
    body: repeated-failure
    headers:
      snapshotFailOnce: 'true'
    expectedBody: Triggered
    expectedHeaders:
      snapshotDeliveryAttempt: 2
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 4
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
        headers:
          CamelGooglePubsubAttributes:
            snapshotFailOnce: 'true'
      response:
        properties:
          expectedCompletionCounts: [2, 2]
          expectedAcknowledgments: 2
          expectedNegativeAcknowledgments: 2
          expectedCompletions:
          - headers:
              snapshotDeliveryAttempt: 1
            expectedFailure:
              type: java.lang.IllegalStateException
              message: Pub/Sub snapshot script failure
              cause: null
          - body: Triggered
            headers:
              snapshotDeliveryAttempt: 2
          - headers:
              snapshotDeliveryAttempt: 1
            expectedFailure:
              type: java.lang.IllegalStateException
              message: Pub/Sub snapshot script failure
              cause: null
          - body: Triggered
            headers:
              snapshotDeliveryAttempt: 2
  - id: repeated-publication-after-recovery
    expectedBehavior: >-
      Acknowledge fresh repeated publications once each without inheriting earlier failure or delivery counts.
    repeat: 2
    body: recovered
    expectedBody: Triggered
    expectedHeaders:
      snapshotDeliveryAttempt: 1
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 2
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties:
          expectedCompletionCounts: [1, 1]
          expectedAcknowledgments: 2
          expectedNegativeAcknowledgments: 0
          expectedCompletions:
          - count: 2
            body: Triggered
            headers:
              snapshotDeliveryAttempt: 1
- id: deduplicates-repeated-publications-with-unequal-delivery-counts
  expectedBehavior: >-
    Retain a failed business key and suppress repeated business work across redelivery and separate
    publications.
  reuseBroker: true
  scope: Long
  deployment: idempotency-ignore
  driver:
    provider: pubsub-trigger
    sourceElementId: 800be329-a255-5d52-8abd-7e2d04b587f4
  invocations:
  - id: repeated-key-after-first-script-failure
    expectedBehavior: >-
      Retain the failed business key and suppress business work for its redelivery and repeated publication.
    repeat: 2
    body: repeated-payload
    headers:
      businessContext: orders
      businessKey: repeated-failed
      snapshotFailOnce: 'true'
    expectedBody: repeated-payload
    expectedHeaders:
      snapshotMainExecuted: null
      snapshotDuplicateHandler: null
    expectedProperties:
      CamelDuplicateMessage: true
      systemProperty_idempotencyKey: repeated-failed
      systemProperty_idempotencyContext: orders
      systemProperty_keyExpiry: '600'
    interactions:
    - fixture: pubsub-idempotency-ignore
      expectedRequest:
        count: 3
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-idempotency-ignore
        headers:
          CamelGooglePubsubAttributes:
            businessContext: orders
            businessKey: repeated-failed
            snapshotFailOnce: 'true'
      response:
        properties:
          expectedCompletionCounts: [2, 1]
          expectedAcknowledgments: 2
          expectedNegativeAcknowledgments: 1
          expectedCompletions:
          - body: repeated-payload
            headers:
              snapshotMainExecuted: true
              snapshotDuplicateHandler: null
              snapshotDeliveryAttempt: 1
            properties:
              CamelDuplicateMessage: null
              systemProperty_idempotencyKey: repeated-failed
              systemProperty_idempotencyContext: orders
              systemProperty_keyExpiry: '600'
            expectedFailure:
              type: java.lang.IllegalStateException
              message: Pub/Sub snapshot script failure
              cause: null
          - count: 2
            body: repeated-payload
            headers:
              snapshotMainExecuted: null
              snapshotDuplicateHandler: null
              snapshotDeliveryAttempt: null
            properties:
              CamelDuplicateMessage: true
              systemProperty_idempotencyKey: repeated-failed
              systemProperty_idempotencyContext: orders
              systemProperty_keyExpiry: '600'
    - fixture: pubsub-idempotency-store-ignore
      expectedRequest:
        count: 1
        properties:
          insertionAttempts: 3
          key: orders:repeated-failed
          keyExpiry: 600
          storedKeys:
          - orders:repeated-failed
          updatedKeys:
          - orders:repeated-failed
          records:
          - key: orders:repeated-failed
            data:
              status: RECEIVED
            keyExpiry: 600
            active: true
  - id: repeated-duplicates-in-next-invocation
    expectedBehavior: >-
      Acknowledge both later duplicate publications without new business work or negative acknowledgments.
    repeat: 2
    body: duplicate-payload
    headers:
      businessContext: orders
      businessKey: repeated-failed
    expectedBody: duplicate-payload
    expectedHeaders:
      snapshotMainExecuted: null
      snapshotDuplicateHandler: null
    expectedProperties:
      CamelDuplicateMessage: true
      systemProperty_idempotencyKey: repeated-failed
      systemProperty_idempotencyContext: orders
      systemProperty_keyExpiry: '600'
    interactions:
    - fixture: pubsub-idempotency-ignore
      expectedRequest:
        count: 2
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-idempotency-ignore
        headers:
          CamelGooglePubsubAttributes:
            businessContext: orders
            businessKey: repeated-failed
      response:
        properties:
          expectedCompletionCounts: [1, 1]
          expectedAcknowledgments: 2
          expectedNegativeAcknowledgments: 0
          expectedCompletions:
          - count: 2
            body: duplicate-payload
            headers:
              snapshotMainExecuted: null
              snapshotDuplicateHandler: null
              snapshotDeliveryAttempt: null
            properties:
              CamelDuplicateMessage: true
              systemProperty_idempotencyKey: repeated-failed
              systemProperty_idempotencyContext: orders
              systemProperty_keyExpiry: '600'
    - fixture: pubsub-idempotency-store-ignore
      expectedRequest:
        count: 0
        properties:
          insertionAttempts: 2
          key: orders:repeated-failed
          keyExpiry: 600
          storedKeys:
          - orders:repeated-failed
          updatedKeys: []
          records:
          - key: orders:repeated-failed
            data:
              status: RECEIVED
            keyExpiry: 600
            active: true
- id: recovers-after-failure-restart-connection-loss-and-subscription-recreation

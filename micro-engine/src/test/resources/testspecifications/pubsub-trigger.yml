- id: acknowledges-and-redelivers-with-manual-ack
  expectedBehavior: >-
    Apply explicit ACK or NACK in manual mode and avoid automatic acknowledgment when the chain omits it.
  reuseBroker: true
  scope: Long
  deployment: manual
  driver:
    provider: pubsub-trigger
    sourceElementId: f4993db3-60da-5429-96c0-116344123146
  invocations:
  - id: explicit-ack
    expectedBehavior: >-
      Complete processing and explicitly acknowledge the manually handled delivery.
    body: manual-ack
    expectedBody: Triggered
    headers:
      snapshotAckAction: ack
    interactions:
    - fixture: pubsub-manual
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-manual
      response:
        properties: {}
  - id: explicit-nack-redelivers-same-message
    expectedBehavior: >-
      Explicitly NACK the first delivery, then ACK the same message on its second attempt.
    body: manual-nack
    expectedBody: Triggered
    headers:
      snapshotAckAction: nack-once
    interactions:
    - fixture: pubsub-manual
      expectedRequest:
        count: 2

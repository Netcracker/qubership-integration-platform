    recreation.
  scope: Long
  deployment: auto
  driver:
    provider: pubsub-trigger
    sourceElementId: d9d4b792-23bd-4438-ae92-58f840fe84f6
  invocations:
  - id: healthy-before-failure
    expectedBehavior: >-
      Consume and acknowledge the initial message before injecting downstream and lifecycle failures.
    body: before
    expectedBody: Triggered
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties: {}
  - id: script-failure-redelivers-same-message
    expectedBehavior: >-
      NACK the failed first attempt and ACK the same broker message on its successful second attempt.
    body: fail-once
    expectedBody: Triggered
    headers:
      snapshotFailOnce: 'true'
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 2
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties:
          expectedAcknowledgments: 1
          expectedNegativeAcknowledgments: 1
          expectedCompletions:
          - headers:
              snapshotDeliveryAttempt: 1
            expectedFailure:
              type: java.lang.IllegalStateException
              message: Pub/Sub snapshot script failure
              cause: null
          - body: Triggered
            headers:
              snapshotDeliveryAttempt: 2
    expectedHeaders:
      snapshotDeliveryAttempt: 2
  - id: backlog-after-consumer-stop
    expectedBehavior: >-
      Consume all five messages queued while the subscriber was stopped.
    body: backlog
    expectedBody:
    - Triggered
    - Triggered
    - Triggered

- id: recovers-after-failure-restart-connection-loss-and-subscription-recreation
  scope: Long
  deployment: auto
  driver:
    provider: pubsub-trigger
    sourceElementId: d9d4b792-23bd-4438-ae92-58f840fe84f6
  invocations:
  - id: healthy-before-failure
    body: before
    expectedBody: Triggered
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 1
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties: {}
  - id: script-failure-redelivers-same-message
    body: fail-once
    expectedBody: Triggered
    headers:
      snapshotFailOnce: 'true'
    interactions:
    - fixture: pubsub-auto
      expectedRequest:
        count: 2
        destination: projects/sandbox-messaging/subscriptions/snapshot-pubsub-trigger-auto
      response:
        properties:
          expectedAcknowledgments: 1
          expectedNegativeAcknowledgments: 1
          expectedCompletions:
          - headers:
              snapshotDeliveryAttempt: 1
            expectedFailure:
              type: java.lang.IllegalStateException
              message: Pub/Sub snapshot script failure
              cause: null
          - body: Triggered
            headers:
              snapshotDeliveryAttempt: 2
    expectedHeaders:
      snapshotDeliveryAttempt: 2
  - id: backlog-after-consumer-stop
    body: backlog
    expectedBody:
    - Triggered
    - Triggered
    - Triggered
    - Triggered
    - Triggered
    driver:
      provider: pubsub-trigger
      sourceElementId: d9d4b792-23bd-4438-ae92-58f840fe84f6
      parameters:
        messages:
        - body: backlog-0
          attributes:
            index: '0'
        - body: backlog-1
          attributes:
            index: '1'
        - body: backlog-2
          attributes:
            index: '2'
        - body: backlog-3
          attributes:
            index: '3'
        - body: backlog-4
          attributes:
            index: '4'
    interactions:

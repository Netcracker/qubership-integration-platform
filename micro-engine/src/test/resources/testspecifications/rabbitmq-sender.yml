      message: 'com.rabbitmq.client.AuthenticationFailureException: ACCESS_REFUSED - Login was refused using authentication
        mechanism PLAIN. For details see the broker logfile.'
      cause:
        type: com.rabbitmq.client.AuthenticationFailureException

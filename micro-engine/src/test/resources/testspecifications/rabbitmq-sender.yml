  expectedBehavior: >-
    Recover RabbitMQ publication after credential changes, access revocation, connection closure, broker
    restart, and channel errors.
  scope: Long
  deployment: rabbitmq-sender-broker
  endpointUri: cip-chain:68ef6d16-3fe7-4cfc-b9a9-5248b34f56fb
  invocations:
  - id: before-password-change
    expectedBehavior: "Deliver a baseline message before changing the broker account password."
    body: Accepted with configured credentials
    headers:
      Authorization: Bearer snapshot-before-password-change
      X-Request-Id: incoming-before-password-change
      X-Snapshot-Header: before-password-change
    expectedBody: Accepted with configured credentials
    expectedHeaders:
      X-Snapshot-Header: before-password-change
    expectedAbsentHeaders:
    - Authorization
    - X-Request-Id
    expectedProperties:
      internalProperty_overrideContextParams: null
      internalProperty_enableAuthRestore: null
    interactions:

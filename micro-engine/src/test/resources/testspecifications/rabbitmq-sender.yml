    expectedAbsentHeaders:
    - Authorization
    - X-Request-Id
    expectedProperties:
      internalProperty_overrideContextParams: null
      internalProperty_enableAuthRestore: null
    interactions:
    - fixture: rabbitmq-broker
      expectedRequest:
        count: 1
        destination: test

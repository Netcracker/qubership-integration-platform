      expectedRequest:
        count: 1
        destination: test
        body: Accepted with configured credentials
        headers:
          Authorization: null
          X-Request-Id: incoming-before-password-change
          X-Snapshot-Header: before-password-change
  - id: invalid-password
    expectedBehavior: "Propagate RabbitMQ authentication rejection and deliver no message with the stale password."
    body: Rejected with the old password
    headers:
      Authorization: Bearer snapshot-invalid-password
      X-Request-Id: incoming-invalid-password
      X-Snapshot-Header: invalid-password

scenarios:
- id: consumes-basic-payloads-headers-and-routing
  expectedBehavior: >-
    Preserve RabbitMQ payload bytes, content types, AMQP metadata, and typed headers while respecting direct
    routing bindings.
  reuseBroker: true
  scope: Short
  deployment: auto
  driver:
    provider: rabbitmq-trigger
    sourceElementId: 94164c82-e1a7-493c-877b-46f00f286c08
  invocations:
  - id: consumes-text-json-utf8-and-empty-payloads
    expectedBehavior: >-
      Consume the plain-text delivery once with its declared headers and no failure or redelivery.
    body: RabbitMQ text
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: RabbitMQ text
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: consumes-json-text
    expectedBehavior: >-
      Consume the JSON payload as the expected raw content with no redelivery.
    body: '{"order":7,"active":true}'
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: '{"order":7,"active":true}'
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: consumes-utf8-text
    expectedBehavior: >-
      Preserve the UTF-8 payload content while completing one business invocation.
    body: café
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: café
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: consumes-empty-bytes
    expectedBehavior: >-
      Consume an empty byte payload with exact zero length and no failed completion.
    body: ''
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: ''
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          expectedBodyLength: 0
  - id: preserves-binary-payloads-and-content-types
    expectedBehavior: >-
      Preserve the exact binary payload bytes and application content-type metadata.
    driver:
      provider: rabbitmq-trigger
      sourceElementId: 94164c82-e1a7-493c-877b-46f00f286c08
      parameters:
        bodyBase64: AAECf4D+/wA=
        amqpProperties:
          contentType: application/octet-stream
          contentEncoding: binary
    body: null
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        headers:
          CamelSpringRabbitmqContentType: application/octet-stream
          CamelSpringRabbitmqContentEncoding: binary
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          expectedBodyBase64: AAECf4D+/wA=
  - id: defaults-missing-content-type-and-preserves-explicit-values
    expectedBehavior: >-
      Apply the configured default when the published message has no content type.
    body: missing-content-type
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: missing-content-type
        headers:
          Content-Type: application/json
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: preserves-explicit-text-content-type
    expectedBehavior: >-
      Preserve the explicitly supplied text content type on the consumed message.
    body: explicit-text
    headers:
      Content-Type: text/plain
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: explicit-text
        headers:
          Content-Type: text/plain
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: preserves-explicit-binary-content-type
    expectedBehavior: >-
      Preserve the explicitly supplied binary content type on the consumed message.
    body: explicit-binary
    headers:
      Content-Type: application/octet-stream
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: explicit-binary
        headers:
          Content-Type: application/octet-stream
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: maps-amqp-properties-and-typed-headers
    expectedBehavior: >-
      Map the published AMQP properties and typed user headers without changing their expected values.
    driver:
      provider: rabbitmq-trigger
      sourceElementId: 94164c82-e1a7-493c-877b-46f00f286c08
      parameters:
        amqpProperties:
          contentType: text/plain
          contentEncoding: UTF-8
          deliveryMode: 2
          priority: 3
          correlationId: correlation-1
          replyTo: snapshot.reply
          expiration: '60000'
          messageId: message-1
          timestamp: 1735689600000
          type: order.created
          userId: snapshot
          appId: snapshot-tests
          clusterId: snapshot-cluster
        headersBase64:
          binary: AAH+/w==
    body: metadata
    headers:
      text: café
      integer: 7
      boolean: true
      decimal: 1.25
      array:
      - one
      - 2
      - false
      table:
        name: nested
        enabled: true
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: metadata
        headers:
          CamelSpringRabbitmqContentType: text/plain
          CamelSpringRabbitmqContentEncoding: UTF-8
          CamelSpringRabbitmqDeliveryMode: PERSISTENT
          CamelSpringRabbitmqPriority: 3
          CamelSpringRabbitmqCorrelationId: correlation-1
          CamelSpringRabbitmqReplyTo: snapshot.reply
          CamelSpringRabbitmqExpiration: '60000'
          CamelSpringRabbitmqMessageId: message-1
          CamelSpringRabbitmqTimestamp: 1735689600000
          CamelSpringRabbitmqType: order.created
          CamelSpringRabbitmqUserId: snapshot
          CamelSpringRabbitmqAppId: snapshot-tests
          CamelSpringRabbitmqClusterId: snapshot-cluster
          text: café
          integer: 7
          boolean: true
          decimal: 1.25
          array:
          - one
          - 2
          - false
          table:
            name: nested
            enabled: true
          binary: AAH+/w==
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: filters-routing-through-direct-bindings
    expectedBehavior: >-
      Consume the message delivered through a matching direct-exchange routing binding.
    body: routed
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: routed
        destination: snapshot.rabbitmq.trigger
        key: snapshot.rabbitmq.trigger
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: does-not-consume-an-unbound-routing-key
    expectedBehavior: >-
      Produce no completion or business execution for a routing key without a matching direct binding.
    driver:
      provider: rabbitmq-trigger
      sourceElementId: 94164c82-e1a7-493c-877b-46f00f286c08
      parameters:
        routingKey: snapshot.unbound
        expectedCompletions: 0
    body: unrouted
    expectedBody: null
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 0
      response:
        properties:
          expectedBusinessCount: 0
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
- id: recovers-through-consumer-and-broker-lifecycle
  expectedBehavior: >-
    Preserve per-message isolation and acknowledgment semantics through route, connection, queue, broker, and
    deployment changes.
  scope: Long
  deployment: auto
  driver:
    provider: rabbitmq-trigger
    sourceElementId: 94164c82-e1a7-493c-877b-46f00f286c08
  invocations:
  - id: isolates-message-headers-and-exchanges
    expectedBehavior: >-
      Consume the first message with its own application headers and Camel exchange.
    body: first
    headers:
      firstOnly: first
      X-Request-Id: request-one
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: first
        headers:
          firstOnly: first
          X-Request-Id: request-one
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: does-not-retain-previous-application-headers
    expectedBehavior: >-
      Consume the next message without leaking application headers from the previous exchange.
    body: second
    headers:
      X-Request-Id: request-two
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: second
        headers:
          X-Request-Id: request-two
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          expectedAbsentHeaders:
          - firstOnly
  - id: consumes-large-payloads-with-exact-length-and-digest
    expectedBehavior: >-
      Consume the full large payload with the expected byte length and SHA-256 digest.
    driver:
      provider: rabbitmq-trigger
      sourceElementId: 94164c82-e1a7-493c-877b-46f00f286c08
      parameters:
        bodyRepeat: 32768
    body: abcdefgh
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          expectedBodyLength: 262144
          expectedBodySha256: 45392302e4a0844d5162e25bce073a22832e7939b77eecc052bd0b8dd614d1dc
  - id: acknowledges-successful-auto-deliveries-before-route-restart
    expectedBehavior: >-
      Complete and acknowledge the AUTO-mode delivery before restarting the route.
    body: before-route-restart
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: before-route-restart
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
  - id: does-not-replay-acknowledged-messages-after-route-restart
    expectedBehavior: >-
      Consume a fresh message after route restart without replaying acknowledged deliveries.
    body: after-route-restart
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: after-route-restart
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          consumerAction: restart-route
    timeoutSeconds: 90
  - id: resumes-backlog-after-consumer-stop-and-start
    expectedBehavior: >-
      Consume the queued message after the stopped consumer route starts again.
    body: queued-during-stop
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: queued-during-stop
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          consumerAction: stop-until-published
    timeoutSeconds: 90
  - id: completes-in-flight-processing-during-graceful-stop
    expectedBehavior: >-
      Finish the in-flight delivery while the consumer route stops gracefully.
    body: held-during-stop
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: held-during-stop
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          consumerAction: stop-during-processing
    timeoutSeconds: 90
  - id: recovers-durable-backlog-after-broker-restart
    expectedBehavior: >-
      Consume the durable message retained across a RabbitMQ broker restart.
    body: persistent-backlog
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: persistent-backlog
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          consumerAction: restart-broker-with-backlog
    timeoutSeconds: 90
  - id: recovers-after-queue-deletion-and-recreation
    expectedBehavior: >-
      Resume consumption after deleting and recreating the input queue.
    body: after-queue-recreation
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: after-queue-recreation
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          consumerAction: delete-recreate-queue
    timeoutSeconds: 90
  - id: recreates-consumer-state-after-redeployment
    expectedBehavior: >-
      Replace the old deployed consumer and consume a fresh message successfully.
    body: after-redeployment
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: after-redeployment
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0
          consumerAction: redeploy
    timeoutSeconds: 90
  - id: redelivers-unacknowledged-auto-messages-after-connection-loss
    expectedBehavior: >-
      Redeliver the unacknowledged AUTO-mode message after connection loss and observe two business
      completions.
    body: interrupted-delivery
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 2
        body: interrupted-delivery
      response:
        properties:
          expectedBusinessCount: 2
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 1
          consumerAction: close-during-processing
    timeoutSeconds: 90
  - id: continues-after-transport-redelivery
    expectedBehavior: >-
      Consume the next fresh message once after recovering from transport redelivery.
    body: fresh-after-redelivery
    expectedBody: Triggered
    interactions:
    - fixture: auto-broker
      expectedRequest:
        count: 1
        body: fresh-after-redelivery
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRedeliveryCount: 0

scenarios:
- id: fires-native-cron-and-preserves-scheduling-metadata
  expectedBehavior: >-
    Execute repeated native cron firings with distinct exchanges and request contexts while preserving generated
    scheduling metadata.
  scope: Short
  deployment: base
  driver:
    provider: scheduler
    sourceElementId: 93468365-eb30-49f5-9077-cbe535f5edd3
  invocations:
  - id: first-native-fire
    expectedBehavior: >-
      Fire the native cron job once and preserve the exported cron, job registration, and delete-job setting.
    expectedBody: Triggered
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCron: 0/1 * * ? * *
          expectedDeleteJob: false
          expectedRegistered: true
          expectedCompletionBody: Triggered
  - id: second-native-fire
    expectedBehavior: Fire the same native job again with a fresh exchange and request context.
    expectedBody: Triggered
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCompletionBody: Triggered
  - id: third-native-fire
    expectedBehavior: Complete a third independent native firing with the expected generated route result.
    expectedBody: Triggered
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCompletionBody: Triggered
- id: accepts-seven-field-quartz-cron
  expectedBehavior: Register and fire the exported seven-field Quartz cron expression.
  scope: Short
  deployment: seven-field
  driver:
    provider: scheduler
    sourceElementId: cffb3cf1-4d4e-5f82-9138-ddf75084006b
  invocations:
  - id: seven-field-native-fire
    expectedBehavior: >-
      Fire the native job with the exact exported seven-field cron and return the generated route result.
    expectedBody: Triggered
    interactions:
    - fixture: seven-field-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCron: 0/1 * * ? * * *
          expectedCompletionBody: Triggered
- id: preserves-cron-steps-ranges-and-lists
  expectedBehavior: >-
    Retain list, step, and range syntax in registered native Quartz triggers without business execution during
    inspection.
  scope: Short
  deployment: lists
  driver:
    provider: scheduler
    sourceElementId: 0fdf51e6-caeb-5230-b769-59f7bb717806
  invocations:
  - id: inspects-generated-native-cron
    expectedBehavior: >-
      Inspect the exact generated list and step/range cron expressions and registered jobs without firing either
      route.
    expectedBody: null
    interactions:
    - fixture: lists-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          expectedCron: 0,15,30,45 * * ? * *
          expectedRegistered: true
          inspectionOnly: true
    - fixture: steps-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          expectedCron: 0/2 * * ? * SUN-SAT
          expectedRegistered: true
          inspectionOnly: true
- id: rejects-malformed-cron-before-firing
  expectedBehavior: Reject the malformed cron expression at startup before any native business firing.
  scope: Short
  deployment: invalid
  expectedStartupFailure:
    type: org.apache.camel.FailedToStartRouteException
    ignoreMessage: true
    cause:
      type: java.lang.RuntimeException
      message: CronExpression '0/50 ** ** ?' is invalid.
      cause:
        type: java.text.ParseException
        message: Unexpected end of expression.
        cause: null
  driver:
    provider: scheduler
    sourceElementId: aff2541a-b602-53e8-941f-5611d4d651c4
  invocations:
  - id: invalid-cron-has-no-business-execution
    expectedBehavior: Start no business execution for the generated route with the invalid Quartz cron expression.
    expectedBody: null
    interactions:
    - fixture: invalid-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          action: observe
- id: observes-expired-cron-at-the-native-commit-boundary
  expectedBehavior: >-
    Observe the native commit rejection for an expired cron expression and retain no registered job or business
    execution.
  scope: Long
  deployment: expired
  driver:
    provider: scheduler
    sourceElementId: e2117318-b553-5dcf-8251-a5336b399ead
  invocations:
  - id: expired-cron-registers-no-job
    expectedBehavior: Report the expired schedule commit failure, register no native job, and execute no business work.
    expectedBody: null
    interactions:
    - fixture: expired-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          expectedCron: 0 0 0 1 1 ? 1970
          expectedRegistered: false
          expectedStartupCommitFailure: true
- id: continues-after-an-unhandled-script-failure
  expectedBehavior: >-
    Report an unhandled scheduled script failure and execute the next native cron firing with a fresh request
    context.
  scope: Long
  deployment: unhandled-failure
  driver:
    provider: scheduler
    sourceElementId: 780b450e-fddb-5078-bd59-87f2a548eeb9
  invocations:
  - id: fails-first-native-fire
    expectedBehavior: >-
      Report the configured IllegalStateException from the first native firing and retain its request-context
      checks.
    expectedBody: null
    interactions:
    - fixture: unhandled-failure-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          snapshotSchedulerFail: true
          verifyRequestContext: true
    expectedFailure:
      type: java.lang.IllegalStateException
      message: Scheduled script failure
      cause: null
  - id: recovers-on-the-next-native-fire
    expectedBehavior: >-
      Complete the next native firing successfully with an independent request context after the script failure.
    expectedBody: Triggered
    interactions:
    - fixture: unhandled-failure-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          snapshotSchedulerFail: false
          verifyRequestContext: true
          expectedCompletionBody: Triggered
- id: continues-after-a-handled-script-failure
  expectedBehavior: >-
    Return the generated fallback for a handled script failure and return to the normal branch on the next native
    firing.
  scope: Long
  deployment: handled-failure
  driver:
    provider: scheduler
    sourceElementId: 10ce5c3a-786d-57a8-aafc-8089eb880860
  invocations:
  - id: handles-first-native-failure
    expectedBehavior: Handle the scheduled script failure, execute the fallback branch, and return its Fallback result.
    expectedBody: Fallback
    interactions:
    - fixture: handled-failure-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          snapshotSchedulerFail: true
          expectedCompletionBody: Fallback
    expectedProperties:
      snapshotSchedulerFallbackReached: true
      snapshotSchedulerScriptReached: true
  - id: succeeds-after-the-handled-failure
    expectedBehavior: >-
      Return the normal Triggered result on the next firing without retaining the previous fallback marker.
    expectedBody: Triggered
    interactions:
    - fixture: handled-failure-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          snapshotSchedulerFail: false
          expectedCompletionBody: Triggered
    expectedProperties:
      snapshotSchedulerFallbackReached: null
      snapshotSchedulerScriptReached: true

- id: removes-old-jobs-during-deployment-replacement
  expectedBehavior: >-
    Replace a generated scheduler deployment without retaining its old jobs or interrupting an independent
    deployment.
  scope: Long
  deployment: replacement
  driver:
    provider: scheduler
    sourceElementId: 30a1b65f-fec5-516d-8832-920e7fb5af37
  invocations:
  - id: fires-original-before-replacement
    expectedBehavior: >-
      Fire the original and independent deployments while the deferred replacement has no registered job.
    expectedBody: null
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCompletionBody: Triggered
    - fixture: replacement-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          deferRoutesUntilInvocation: true
          expectedRegistered: false
    - fixture: second-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCompletionBody: Triggered
  - id: replaces-the-original-generated-deployment
    expectedBehavior: >-
      Remove the original job, load the replacement, and retain successful independent deployment firing.
    expectedBody: Replacement
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          action: remove
          expectedRegistered: false
    - fixture: replacement-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          action: reload
          expectedRegistered: true
          expectedCompletionBody: Replacement
    - fixture: second-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCompletionBody: Triggered
  - id: keeps-the-replacement-independent
    expectedBehavior: >-
      Continue firing the replacement and independent deployment while the removed original job stays absent.
    expectedBody: Replacement
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          expectedRegistered: false
    - fixture: replacement-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCompletionBody: Replacement
    - fixture: second-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          expectedCompletionBody: Triggered
- id: controls-native-firing-through-blue-green-transitions
  scope: Long
  expectedBehavior: Retain registered jobs and alternate native firing and standby with the blue-green activation state.
  deployment: base
  driver:
    provider: scheduler
    sourceElementId: 93468365-eb30-49f5-9077-cbe535f5edd3
  invocations:
  - id: starts-with-an-inactive-scheduler
    expectedBehavior: Keep the registered job in standby without starting any native firing.
    expectedBody: null
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          initialInactive: true
          action: blue-green
          blueGreenState: INACTIVE
          expectedRegistered: true
  - id: fires-after-activation
    expectedBehavior: Leave standby and complete one native firing after activation.
    expectedBody: Triggered
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          action: blue-green
          blueGreenState: ACTIVE
  - id: fires-after-repeated-active-state
    expectedBehavior: Complete one native firing after receiving the active state again.
    expectedBody: Triggered
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          action: blue-green
          blueGreenState: ACTIVE
  - id: suspends-after-deactivation
    expectedBehavior: Enter standby without starting any new native firing after deactivation.
    expectedBody: null
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          action: blue-green
          blueGreenState: INACTIVE
  - id: stays-suspended-after-repeated-inactive-state
    expectedBehavior: Stay in standby without starting any native firing after receiving the inactive state again.
    expectedBody: null
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 0
      response:
        properties:
          action: blue-green
          blueGreenState: INACTIVE
  - id: fires-after-reactivation
    expectedBehavior: Leave standby and complete one native firing after reactivation.
    expectedBody: Triggered
    interactions:
    - fixture: base-schedule
      expectedRequest:
        count: 1
      response:
        properties:
          action: blue-green
          blueGreenState: ACTIVE

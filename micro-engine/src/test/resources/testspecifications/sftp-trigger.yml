scenarios:
- id: consumes-content-metadata-and-selected-files
  expectedBehavior: >-
    Consume supported file content and native metadata while excluding files outside the configured selection.
  scope: Short
  deployment: base
  driver:
    provider: sftp-trigger
    sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
  invocations:
  - id: polls-an-empty-directory-and-consumes-later-files
    expectedBehavior: >-
      Poll an empty directory without business work, failed completions, or retained file keys.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        publish: false
        expectedCompletions: 0
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 0
      response:
        properties:
          expectedBusinessCount: 0
          expectedFailureCompletions: 0
          expectedFileNames: []
          expectedRetainedKeyCount: 0
  - id: consumes-text-json-utf8-and-empty-files
    expectedBehavior: >-
      Consume all seven selected files with exact text, UTF-8 and binary bytes, empty content, and native file
      headers.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        files:
        - fileName: plain.txt
          body: SFTP text
        - fileName: order.json.txt
          body: '{"order":7,"active":true}'
        - fileName: utf8.txt
          body: café
        - fileName: empty.txt
          body: ''
        - fileName: binary.txt
          bodyBase64: AP+ACg1B
        - fileName: metadata.txt
          body: metadata-content
          mtimeSeconds: 1700000000
        - fileName: order report café.txt
          body: named-content
        expectedCompletions: 7
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 7
      expectedExchanges:
      - count: 7
        body: Triggered
      response:
        properties:
          expectedBusinessCount: 7
          expectedFailureCompletions: 0
          expectedFileNames:
          - plain.txt
          - order.json.txt
          - utf8.txt
          - empty.txt
          - binary.txt
          - metadata.txt
          - order report café.txt
          expectedStreamDownload: true
          verifyFileHeaders: true
          expectedInputsByFile:
            plain.txt:
              body: SFTP text
            order.json.txt:
              body: '{"order":7,"active":true}'
            utf8.txt:
              body: café
              bodyLength: 5
            empty.txt:
              body: ''
              bodyLength: 0
            binary.txt:
              bodyLength: 6
              bodySha256: 3e1184bc6a8b6e20e85992c10f7f60cb6b5082dc4099d5dea1b744139fb757e7
            metadata.txt:
              body: metadata-content
            order report café.txt:
              body: named-content
  - id: filters-files-with-ant-include
    expectedBehavior: >-
      Consume only the file matching the Ant mask and leave excluded remote files untouched.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        files:
        - fileName: selected.txt
          body: matching-file
        - fileName: excluded.csv
          body: excluded-csv
        - fileName: extensionless
          body: excluded-name
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedFileNames:
          - selected.txt
          expectedRemoteFiles:
            selected.txt: matching-file
            excluded.csv: excluded-csv
            extensionless: excluded-name
  - id: excludes-files-outside-the-polled-directory
    expectedBehavior: >-
      Consume the file in the polling directory without consuming its sibling-directory file.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        files:
        - fileName: inside.txt
          body: inside-content
        - fileName: ../sibling/sibling.txt
          body: outside-content
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedFileNames:
          - inside.txt
          expectedRemoteFiles:
            ../sibling/sibling.txt: outside-content
  - id: ignores-subdirectories-with-native-recursion-disabled
    expectedBehavior: >-
      Consume the root file while leaving a nested child file untouched when recursion is disabled.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        files:
        - fileName: root-only.txt
          body: root-content
        - fileName: nested/child.txt
          body: nested-content
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedFileNames:
          - root-only.txt
          expectedRemoteFiles:
            nested/child.txt: nested-content
  - id: ignores-dot-prefixed-files
    expectedBehavior: >-
      Consume the visible file without processing the dot-prefixed file.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        files:
        - fileName: visible.txt
          body: visible-content
        - fileName: .hidden.txt
          body: hidden-content
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedFileNames:
          - visible.txt
          expectedRemoteFiles:
            .hidden.txt: hidden-content
  - id: consumes-a-batch-without-assuming-file-order
    expectedBehavior: >-
      Complete all three batch files exactly once without requiring a particular polling order.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        files:
        - fileName: batch-a.txt
          body: batch-a
        - fileName: batch-b.txt
          body: batch-b
        - fileName: batch-c.txt
          body: batch-c
        expectedCompletions: 3
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 3
      response:
        properties:
          expectedBusinessCount: 3
          expectedFailureCompletions: 0
          expectedFileNames:
          - batch-a.txt
          - batch-b.txt
          - batch-c.txt
- id: streams-large-files-and-recovers-after-an-interrupted-download
  expectedBehavior: >-
    Preserve complete large-file bytes and retry a file after its initial download is interrupted.
  scope: Long
  deployment: base
  driver:
    provider: sftp-trigger
    sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
  invocations:
  - id: streams-large-files-without-truncation
    expectedBehavior: >-
      Stream the large file with its exact byte length and SHA-256 digest, then complete one business
      invocation.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        fileName: large.txt
        bodyRepeat: 131072
    body: SFTP-large-block-
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedStreamDownload: true
          expectedBodyLength: 2228224
          expectedBodySha256: d3f59b3727139265f52bd0e078a2e746da234900a4fbdb04281e5b0440b01169
          expectedFileNames:
          - large.txt
  - id: retries-after-a-connection-is-lost-during-download
    expectedBehavior: >-
      Record one interrupted download, retry the same file, and complete once with the full expected byte
      length and digest.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        fileName: interrupted.txt
        bodyRepeat: 524288
        expectedCompletions: 2
    body: SFTP-large-block-
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 1
          consumerAction: interrupted-download
          expectedStreamDownload: true
          expectedBodyLength: 8912896
          expectedBodySha256: 1e5abe4326fd2662a66fe0c55fb3afa157ec15f9f36a08a33fcf029a1753bb4f
          expectedFileNames:
          - interrupted.txt

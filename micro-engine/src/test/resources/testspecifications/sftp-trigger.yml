          body: matching-file
        - fileName: excluded.csv
          body: excluded-csv
        - fileName: extensionless
          body: excluded-name
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedFileNames:
          - selected.txt
          expectedRemoteFiles:
            selected.txt: matching-file
            excluded.csv: excluded-csv
            extensionless: excluded-name

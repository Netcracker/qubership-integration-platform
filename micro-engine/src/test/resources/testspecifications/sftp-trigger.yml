- id: consumes-content-metadata-and-selected-files
  scope: Short
  deployment: base
  driver:
    provider: sftp-trigger
    sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
  invocations:
  - id: polls-an-empty-directory-and-consumes-later-files
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        publish: false
        expectedCompletions: 0
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 0
      response:
        properties:
          expectedBusinessCount: 0
          expectedFailureCompletions: 0
          expectedFileNames: []
          expectedRetainedKeyCount: 0
  - id: consumes-text-json-utf8-and-empty-files
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        files:
        - fileName: plain.txt
          body: SFTP text
        - fileName: order.json.txt
          body: '{"order":7,"active":true}'
        - fileName: utf8.txt
          body: café
        - fileName: empty.txt
          body: ''
        - fileName: binary.txt
          bodyBase64: AP+ACg1B
        - fileName: metadata.txt
          body: metadata-content
          mtimeSeconds: 1700000000
        - fileName: order report café.txt
          body: named-content
        expectedCompletions: 7
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 7
      expectedExchanges:
      - count: 7
        body: Triggered
      response:
        properties:
          expectedBusinessCount: 7
          expectedFailureCompletions: 0
          expectedFileNames:
          - plain.txt
          - order.json.txt
          - utf8.txt
          - empty.txt
          - binary.txt
          - metadata.txt
          - order report café.txt
          expectedStreamDownload: true
          verifyFileHeaders: true
          expectedInputsByFile:
            plain.txt:
              body: SFTP text
            order.json.txt:
              body: '{"order":7,"active":true}'
            utf8.txt:
              body: café
              bodyLength: 5
            empty.txt:
              body: ''
              bodyLength: 0
            binary.txt:
              bodyLength: 6
              bodySha256: 3e1184bc6a8b6e20e85992c10f7f60cb6b5082dc4099d5dea1b744139fb757e7
            metadata.txt:
              body: metadata-content
            order report café.txt:
              body: named-content

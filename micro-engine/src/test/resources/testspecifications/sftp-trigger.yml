- id: preserves-native-file-key-semantics
  expectedBehavior: >-
    Deduplicate unchanged files, acquire changed native keys, and retain keys across route restart.
  scope: Long
  deployment: base
  driver:
    provider: sftp-trigger
    sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
  invocations:
  - id: consumes-the-first-file-key
    expectedBehavior: >-
      Consume the first file and retain its native idempotency key.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        fileName: same-name.txt
        mtimeSeconds: 1700000000
    body: first-size
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
        body: first-size
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRetainedKeyCount: 1
  - id: suppresses-an-unchanged-file-on-later-polls
    expectedBehavior: >-
      Leave the unchanged remote file in place without another completion or business execution.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        publish: false
        expectedCompletions: 0
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 0
      response:
        properties:
          expectedBusinessCount: 0
          expectedFailureCompletions: 0
          expectedRetainedKeyCount: 1
          expectedFileNames: []
          expectedRemoteFiles:
            same-name.txt: first-size
  - id: consumes-the-same-name-after-a-size-change
    expectedBehavior: >-
      Consume the same file name with its changed size and retain a second distinct native key.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        fileName: same-name.txt
        mtimeSeconds: 1700000000
    body: second-with-new-size
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
        body: second-with-new-size
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRetainedKeyCount: 2
          verifyFileHeaders: true
          expectedFileNames:
          - same-name.txt
  - id: consumes-the-same-name-after-a-modification-time-change
    expectedBehavior: >-
      Consume the same file name after its modification time changes and retain the new key.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        fileName: same-name.txt
        mtimeSeconds: 1700000005
    body: second-with-new-size
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
        body: second-with-new-size
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRetainedKeyCount: 3
          verifyFileHeaders: true
          expectedFileNames:
          - same-name.txt
  - id: retains-file-keys-across-stop-and-start-of-the-same-endpoint
    expectedBehavior: >-
      Restart the same endpoint without reprocessing files whose native keys are already retained.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        publish: false
        expectedCompletions: 0
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 0
      response:
        properties:
          expectedBusinessCount: 0
          expectedFailureCompletions: 0
          consumerAction: restart-route
          expectedRetainedKeyCount: 3
          expectedFileNames: []
  - id: consumes-a-new-file-after-retaining-earlier-keys
    expectedBehavior: >-
      Consume a new file after restart while preserving all previously retained keys.
    driver:
      provider: sftp-trigger
      sourceElementId: 2c238544-21f9-466d-a51f-1098b99a7c12
      parameters:
        fileName: new-after-restart.txt
    body: new-after-restart
    expectedBody: Triggered
    interactions:
    - fixture: base-server
      expectedRequest:
        count: 1
        body: new-after-restart
      response:
        properties:
          expectedBusinessCount: 1
          expectedFailureCompletions: 0
          expectedRetainedKeyCount: 4
          expectedFileNames:
          - new-after-restart.txt

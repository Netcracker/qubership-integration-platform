# yaml-language-server: $schema=../testspecifications.schema.json
subject: "try-catch-finally"
deployments:
  - id: "try-catch-finally"
    route: "try-catch-finally"
  - id: "try-catch-finally-errors"
    route: "try-catch-finally unexpected errors"
scenarios:
  - id: "completes-try-and-runs-finally"
    expectedBehavior: "Complete Try successfully, execute Finally, and leave the element warning flag false."
    scope: Short
    endpointUri: "cip-chain:7bb7fece-7b9e-440b-abe7-ac736163df59"
    body: "Original"
    properties:
      exceptionType: ""
    expectedBody: "Chain completed successful"
    expectedHeaders:
      X-Finally-Step: "true"
    expectedProperties:
      internalProperty_element_warning: "false"
  - id: "handles-arithmetic-exception-and-runs-finally"
    expectedBehavior: "Handle ArithmeticException in its matching Catch, execute Finally, and set the element warning flag."
    scope: Short
    endpointUri: "cip-chain:7bb7fece-7b9e-440b-abe7-ac736163df59"
    body: "Original"
    properties:
      exceptionType: "arithmetic"
    expectedBody: "ArithmeticException occurred"
    expectedHeaders:
      X-Finally-Step: "true"
    expectedProperties:
      internalProperty_element_warning: "true"
  - id: "handles-index-out-of-bounds-exception-and-runs-finally"
    expectedBehavior: "Handle IndexOutOfBoundsException in its matching Catch, execute Finally, and set the element warning flag."
    scope: Short
    endpointUri: "cip-chain:7bb7fece-7b9e-440b-abe7-ac736163df59"
    body: "Original"
    properties:
      exceptionType: "index"
    expectedBody: "IndexOutOfBoundsException occurred"
    expectedHeaders:
      X-Finally-Step: "true"
    expectedProperties:
      internalProperty_element_warning: "true"
  - id: "handles-generic-exception-and-runs-finally"
    expectedBehavior: >-
      Handle the generic exception in Catch, execute Finally, and return the configured handled-error body and
      warning flag.
    scope: Short
    endpointUri: "cip-chain:7bb7fece-7b9e-440b-abe7-ac736163df59"
    body: "Original"
    properties:
      exceptionType: "other"
    expectedBody: "Exception occurred"
    expectedHeaders:
      X-Finally-Step: "true"
    expectedProperties:
      internalProperty_element_warning: "true"
  - id: "handles-missing-exception-type-and-runs-finally"
    expectedBehavior: "Use the Catch with no exception type to handle the failure, execute Finally, and set the warning flag."
    scope: Short
    endpointUri: "cip-chain:7bb7fece-7b9e-440b-abe7-ac736163df59"
    body: "Original"
    expectedBody: "Exception occurred"
    expectedHeaders:
      X-Finally-Step: "true"
    expectedProperties:
      internalProperty_element_warning: "true"

  - id: "propagates-unmatched-exception-and-runs-finally"
    expectedBehavior: >-
      Propagate an unmatched ArrayIndexOutOfBoundsException without entering Catch and execute Finally exactly
      once.
    scope: Short
    endpointUri: "cip-chain:9632d452-1209-4922-b1a7-7303fbd15f14"
    invocations:
      - id: "fails-in-try"
        expectedBehavior: >-
          Propagate an unmatched ArrayIndexOutOfBoundsException without entering Catch and execute Finally
          exactly once.
        body: "Original"
        properties:
          exceptionType: "index"
          catchError: false
          finallyError: false
        expectedFailure:
          type: "java.lang.ArrayIndexOutOfBoundsException"
          message: "Index 8 out of bounds for length 2"
          cause: null
        expectedBody: "Original"
        expectedHeaders:
          X-Finally-Step: "true"
        expectedProperties:
          atCatch: null
          finallyCount: 1

  - id: "propagates-catch-failure-and-runs-finally"
    expectedBehavior: "Propagate the exception thrown inside Catch and execute Finally exactly once after Catch is entered."
    scope: Short
    endpointUri: "cip-chain:9632d452-1209-4922-b1a7-7303fbd15f14"
    invocations:
      - id: "fails-in-catch"
        expectedBehavior: "Propagate the exception thrown inside Catch and execute Finally exactly once after Catch is entered."
        body: "Original"
        properties:
          exceptionType: "arithmetic"
          catchError: true
          finallyError: false
        expectedFailure:
          type: "java.lang.Exception"
          message: "catchError"
          cause: null
        expectedBody: "Original"
        expectedHeaders:
          X-Finally-Step: "true"
        expectedProperties:
          atCatch: true
          finallyCount: 1

  - id: "propagates-finally-failure-after-successful-try"
    expectedBehavior: >-
      Propagate the exception thrown by Finally after successful Try, without entering Catch or losing the
      completed body.
    scope: Short
    endpointUri: "cip-chain:9632d452-1209-4922-b1a7-7303fbd15f14"
    invocations:
      - id: "fails-in-finally"
        expectedBehavior: >-
          Propagate the exception thrown by Finally after successful Try, without entering Catch or losing the
          completed body.
        body: "Original"
        properties:
          exceptionType: ""
          catchError: false
          finallyError: true
        expectedFailure:
          type: "java.lang.Exception"
          message: "finallyError"
          cause: null
        expectedBody: "Chain completed successful"
        expectedAbsentHeaders:
          - "X-Finally-Step"
        expectedProperties:
          atCatch: null
          finallyCount: 1

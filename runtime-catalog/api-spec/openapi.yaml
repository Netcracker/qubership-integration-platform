- name: live-exchanges-controller
  description: Live Exchanges Controller
paths:
  /v1/export/system:
    get:
      tags:
      - system-export-import-controller
      description: Export services as an archive
      operationId: exportSystems
      parameters:
      - name: systemIds
        in: query
        description: "List of service ids, separated by comma"
        required: false
        schema:
          type: array
          items:
            type: string
      - name: usedSystemModelIds
        in: query
        description: "If specified, only these specifications will be exported"
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
    post:
      tags:
      - system-export-import-controller
      description: Export services as an archive
      operationId: exportSystems_1
      parameters:
      - name: systemIds
        in: query
        description: "List of service ids, separated by comma"
        required: false
        schema:
          type: array
          items:
            type: string
      - name: usedSystemModelIds
        in: query
        description: "If specified, only these specifications will be exported"
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
  /v1/catalog/context-system/export:
    get:
      tags:
      - context-system-controller
      description: Export services as an archive
      operationId: exportSystems_2
      parameters:
      - name: systemIds
        in: query
        description: "List of context ids, separated by comma"
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
    post:
      tags:
      - context-system-controller
      description: Export services as an archive
      operationId: exportSystems_3
      parameters:
      - name: systemIds
        in: query
        description: "List of context ids, separated by comma"
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
  /v3/rollout-import/{snapshotId}:
    put:
      tags:
      - rollout-import
      summary: Rollout package to catalog
      operationId: rolloutImportSnapshot
      parameters:
      - name: snapshotId
        in: path
        description: Rollout snapshot
        required: true
        schema:
          type: string
      - name: X-Callback-Url
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolloutImportConfigurationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloutImportSnapshotClientResponse"
  /v2/folders/{id}:
    get:
      tags:
      - folder-controller-v-2
      description: Get folder
      operationId: getFolder
      parameters:
      - name: id
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderItem"
    put:
      tags:
      - folder-controller-v-2
      description: Update folder
      operationId: updateFolder
      parameters:
      - name: id
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderItem"
    delete:
      tags:
      - folder-controller-v-2
      description: Delete folder
      operationId: deleteFolder
      parameters:
      - name: id
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /v1/systems/{systemId}:
    get:
      tags:
      - system-controller
      description: Get specific service
      operationId: getSystem
      parameters:
      - name: systemId
        in: path
        description: Service id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDTO"
    put:
      tags:
      - system-controller
      description: Modify specified service
      operationId: updateSystem
      parameters:
      - name: systemId
        in: path
        description: Service id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDTO"
    delete:
      tags:
      - system-controller
      description: Delete specified service
      operationId: deleteSystem
      parameters:
      - name: systemId
        in: path
        description: Service id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
    patch:
      tags:
      - system-controller
      description: Partially update service
      operationId: updateSyncStatus
      parameters:
      - name: systemId
        in: path
        description: Service id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDTO"
  /v1/systems/{systemId}/environments/{environmentId}:
    get:
      tags:
      - environment-controller
      description: Get specific environment from service
      operationId: getEnvironment
      parameters:
      - name: systemId
        in: path
        description: Service id
        required: true
        schema:
          type: string
      - name: environmentId
        in: path
        description: Environment id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDTO"
    put:
      tags:
      - environment-controller
      description: Update existing environment of a service
      operationId: updateEnvironment
      parameters:
      - name: systemId
        in: path
        description: Service id
        required: true
        schema:
          type: string
      - name: environmentId
        in: path
        description: Environment id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDTO"
    delete:
      tags:
      - environment-controller
      description: Delete existing environment
      operationId: deleteEnvironment
      parameters:
      - name: systemId
        in: path
        description: Service id
        required: true
        schema:
          type: string
      - name: environmentId
        in: path
        description: Environment id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /v1/folders/{folderId}:
    get:
      tags:
      - folder-controller
      description: Get specific folder
      operationId: findById
      parameters:
      - name: folderId
        in: path
        description: Folder id
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Content filter object for a folder item request
        required: false
        schema:
          $ref: "#/components/schemas/FolderContentFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResponse"
    put:
      tags:
      - folder-controller
      description: Update specified folder
      operationId: update
      parameters:
      - name: folderId
        in: path
        description: Folder id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderItemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResponse"
    delete:
      tags:
      - folder-controller
      description: Delete specified folder
      operationId: deleteByIdIn
      parameters:
      - name: folderId
        in: path
        description: Folder id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /v1/detailed-design/templates:
    get:
      tags:
      - detailed-design-controller
      description: Get all detailed design templates
      operationId: getTemplates
      parameters:
      - name: includeContent
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DDSTemplateResponse"
    put:
      tags:
      - detailed-design-controller
      description: Create detailed design template
      operationId: createTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DDSTemplateCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DDSTemplateResponse"
    delete:
      tags:
      - detailed-design-controller
      description: Delete detailed design template
      operationId: deleteTemplates
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
  /v1/chains/{chainId}:
    get:
      tags:
      - chain-controller
      description: Find chain with its elements
      operationId: findById_1
      parameters:
      - name: chainId
        in: path
        description: Chain id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainDTO"
    put:
      tags:
      - chain-controller
      description: Update existing chain
      operationId: update_1
      parameters:
      - name: chainId
        in: path
        description: Chain id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChainRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainDTO"
    delete:
      tags:
      - chain-controller
      description: Delete chain
      operationId: deleteById
      parameters:
      - name: chainId
        in: path
        description: Chain id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
    head:
      tags:
      - chain-controller
      description: Find chain by id if it exists
      operationId: findExistingChain
      parameters:
      - name: chainId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chain"
      x-api-kind: bwc
  /v1/chains/{chainId}/masking/field/{fieldId}:
    put:
      tags:
      - masked-fields-controller
      description: Update specified masked field in a chain
      operationId: updateField
      parameters:
      - name: chainId
        in: path
        description: Chain id
        required: true
        schema:
          type: string
      - name: fieldId
        in: path
        description: Masked field id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaskedFieldDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MaskedFieldDTO"
    delete:
      tags:
      - masked-fields-controller
      description: Delete specified masked field from a chain
      operationId: deleteField
      parameters:
      - name: chainId
        in: path
        description: Chain id
        required: true
        schema:
          type: string
      - name: fieldId
        in: path
        description: Masked field id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /v1/chains/{chainId}/elements/properties-modification:
    put:
      tags:
      - element-modification-controller
      description: Change specified http triggers type to implemented with specified
        specification group
      operationId: modifyHttpTriggerProperties
      parameters:
      - name: chainId
        in: path
        description: "Chain id (deprecated, not used)"
        required: true
        deprecated: true
        schema:
          type: string
      - name: specificationGroupId
        in: query
        description: Specification group id
        required: true
        schema:
          type: string
      - name: httpTriggerIds
        in: query
        description: List of http trigger elements separated by comma
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
  /v1/catalog/mcp-system/{id}:
    get:
      tags:
      - mcp-system-controller
      description: Get MCP system by ID
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPSystemResponseDTO"
    put:
      tags:
      - mcp-system-controller
      description: Update MCP system
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPSystemRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPSystemResponseDTO"
    delete:
      tags:
      - mcp-system-controller
      description: Delete MCP system
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /v1/catalog/context-system/{contextId}:
    get:
      tags:
      - context-system-controller
      description: Get all context systems by context Id
      operationId: getContextSystemById
      parameters:
      - name: contextId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSystemResponseDTO"
    put:
      tags:
      - context-system-controller
      description: Update context system
      operationId: updateContextSystem
      parameters:
      - name: contextId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextSystemUpdateRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSystemResponseDTO"
    delete:
      tags:
      - context-system-controller
      description: Delete context system
      operationId: deleteContextSystemById
      parameters:
      - name: contextId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
    patch:
      tags:
      - context-system-controller
      description: Partially update context system
      operationId: patchContextSystem
      parameters:
      - name: contextId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextSystemUpdateRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSystemResponseDTO"
  /v1/catalog/chains/{chainId}/snapshots/{snapshotId}:
    get:
      tags:
      - snapshot-controller
      description: Get particular snapshot
      operationId: findById_2
      parameters:
      - name: chainId
        in: path
        description: Chain id
        required: true
        schema:
          type: string
      - name: snapshotId
        in: path
        description: Snapshot id
        required: true
        schema:
          type: string
      - name: light
        in: query
        description: Whether response should not include xml definition of the chain
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
    put:
      tags:
      - snapshot-controller
      description: Update information for particular snapshot
      operationId: updateSnapshot
      parameters:
      - name: chainId
        in: path
        description: Chain id
        required: true
        schema:
          type: string
      - name: snapshotId
        in: path
        description: Snapshot id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
    delete:
      tags:
      - snapshot-controller
      description: Delete specified snapshot
      operationId: deleteById_1
      parameters:
      - name: chainId
        in: path
        description: Chain id
        required: true
        schema:
          type: string
      - name: snapshotId
        in: path
        description: Snapshot id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /v1/catalog/chains/access-control/redeploy:
    put:
      tags:
      - chain-roles-controller
      description: Make a bulk redeploy for chains specified in the request
      operationId: bulkRedeploy
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Http trigger roles update request object
              items:
                $ref: "#/components/schemas/UpdateRolesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainRolesResponse"
  /v1/catalog/chains/roles/redeploy:
    put:
      tags:
      - chain-roles-controller
      description: Make a bulk redeploy for chains specified in the request
      operationId: bulkRedeploy_1
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Http trigger roles update request object
              items:
                $ref: "#/components/schemas/UpdateRolesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainRolesResponse"
  /v1/catalog/chains/access-control:
    put:
      tags:
      - chain-roles-controller
      description: Make a bulk update on roles configuration for http triggers
      operationId: updateRoles
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Http trigger roles update request object
              items:
                $ref: "#/components/schemas/UpdateRolesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainRolesResponse"
    post:
      tags:
      - chain-roles-controller
      description: Get all chains with http trigger roles
      operationId: findBySearchRequest
      parameters:
      - name: isImplementedOnly
        in: query
        description: Whether include only http triggers with selected implemented
          service
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChainElementSearchCriteria"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainRolesResponse"
  /v1/catalog/chains/roles:
    put:
      tags:
      - chain-roles-controller
      description: Make a bulk update on roles configuration for http triggers
      operationId: updateRoles_1
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Http trigger roles update request object
              items:
                $ref: "#/components/schemas/UpdateRolesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainRolesResponse"
    post:
      tags:
      - chain-roles-controller
      description: Get all chains with http trigger roles
      operationId: findBySearchRequest_1
      parameters:
      - name: isImplementedOnly
        in: query
        description: Whether include only http triggers with selected implemented
          service
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:

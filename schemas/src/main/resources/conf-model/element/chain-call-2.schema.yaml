---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/chain-call-2
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: Chain Call
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: chain-call-2
  properties:
    type: object
    properties:
      elementId:
        type: string
        title: Chain trigger
      timeout:
        allOf:
          - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/integer-or-variable-placeholder"
        title: Timeout (ms)
        default: 30000
      block:
        type: boolean
        title: Block until a consumer is available
        const: true
        default: true
        readOnly: true
      failIfNoConsumers:
        type: boolean
        title: Fail if no consumers are available
        const: false
        default: false
        readOnly: true
    dependencies:
      failIfNoConsumers:
        - timeout
    required:
      - elementId
required:
  - type

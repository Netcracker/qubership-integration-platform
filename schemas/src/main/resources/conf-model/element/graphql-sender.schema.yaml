---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/graphql-sender
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: GraphQL Sender
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: graphql-sender
  properties:
    type: object
    allOf:
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/correlation-id"
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/context-propagation"
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/http-call-common"
    properties:
      operationName:
        type: string
        title: Operation name
        description: >
          The query or mutation name.
          Optional if query contains single operation
      query:
        type: string
        title: Query
        description: The query text
      queryHeader:
        type: string
        title: Query header
        default: CamelGraphQLQuery
      variablesHeader:
        type: string
        title: Variables header
        default: CamelGraphQLVariables
      variablesJSON:
        type: string
        title: Variables JSON
        description: Operation variables in JSON format.
      uri:
        title: GraphQL server URI
    required:
      - query
required:
  - type

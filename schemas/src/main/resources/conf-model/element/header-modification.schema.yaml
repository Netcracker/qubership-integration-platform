---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/header-modification
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: Header Modification
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: header-modification
  properties:
    type: object
    properties:
      headerModificationToAdd:
        title: Add/Keep Headers
        description: >
          List of header names and values which we need to add or keep.
        $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/headers"
      headerModificationToRemove:
        type: array
        title: Remove Headers
        description: List of header names which we need to remove.
        items:
          type: string
    additionalProperties: false
required:
  - type

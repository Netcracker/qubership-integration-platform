---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/http-sender
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: Http Sender
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: http-sender
  properties:
    type: object
    allOf:
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/correlation-id"
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/context-propagation"
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/http-call-common"
    properties:
      httpMethod:
        title: HTTP Method
        description: HTTP method
        $ref: "#/definitions/HttpMethod"
      connectTimeout:
        allOf:
          - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/integer-or-variable-placeholder"
        title: Connection timeout (ms)
        description: >
          Specifies connection timeout in millis
          (default value will be used if nothing is given).
        default: 120000
      uri:
        title: URI
    required:
      - httpMethod
definitions:
  HttpMethod:
    enum:
      - POST
      - GET
      - PUT
      - DELETE
      - PATCH
      - HEAD
      - OPTIONS
required:
  - type

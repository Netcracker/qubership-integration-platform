---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/if
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/container-element-properties"
title: If
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: if
  properties:
    type: object
    properties:
      condition:
        type: string
        title: Condition
        description: Predicate written using Simple language
      priority:
        type: integer
        title: Priority
        description: >
          Determines the order of the if blocks.
          The lower the number, the earlier the exception will be handled.
          For general exception classes such as Exception, you need to set
          a big number.
        minimum: 0
        default: 0
    required:
      - condition
    additionalProperties: false
required:
  - type

---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/log-record
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: Log Record
description: >
  Log Record element allows to configure a message that will be logged
  for selected logging level.
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: log-record
  properties:
    type: object
    properties:
      logLevel:
        title: Log as
        description: >
          Specifies the type of the message that
          will be logged to microservice log.
        enum:
          - Error
          - Warning
          - Info
        default: Error
      sender:
        type: string
        title: Sender
        description: Specifies custom system name that sends a request.
      receiver:
        type: string
        title: Receiver
        description: Specifies custom system name that accepts a request.
      businessIdentifiers:
        type: object
        title: Business Identifiers
        description: List of business identifiers to be logged.
        patternProperties:
          "^.+$":
            type: string
      message:
        type: string
        title: Message
        description: A custom message to be logged
    additionalProperties: false
required:
  - type

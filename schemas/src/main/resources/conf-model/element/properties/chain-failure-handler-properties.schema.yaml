---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/chain-failure-handler-properties
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - if:
      properties:
        handleChainFailureAction:
          const: default
      required:
        - handleChainFailureAction
    then:
      properties: {}
  - if:
      properties:
        handleChainFailureAction:
          const: script
      required:
        - handleChainFailureAction
    then:
      required:
        - chainFailureHandlerContainer
      properties:
        chainFailureHandlerContainer:
          $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/resource-reference-script"
  - if:
      properties:
        handleChainFailureAction:
          const: mapper-2
      required:
        - handleChainFailureAction
    then:
      required:
        - chainFailureHandlerContainer
      properties:
        chainFailureHandlerContainer:
          $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/resource-reference-mapper"
  - if:
      properties:
        handleChainFailureAction:
          const: chain-call
    then:
      required:
        - chainFailureHandlerContainer
      properties:
        chainFailureHandlerContainer:
          type: object
          properties:
            elementId:
              type: string
              title: "Chain trigger"
          required:
            - elementId
title: Chain Failure Handler
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  handleChainFailureAction:
    type: string
    oneOf:
      - const: default
        title: Default
      - const: script
        title: Scripting
      - const: mapper-2
        title: Mapper
      - const: chain-call
        title: Sub-Chain
    default: default
    title: Action

---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/http-call-common
$schema: http://json-schema.org/draft-07/schema
type: object
title: Common HTTP call properties
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  isExternalCall:
    type: boolean
    title: External call
    description: >
      External - http and https requests allowed (through egress gateway).
      Internal - only http, direct call.
    default: true
  m2m:
    type: boolean
    title: Enable M2M security
    description: >
      Specifies whether M2M token should be used
      to make a call.
    default: false
  reuseEstablishedConnection:
    type: boolean
    title: Reuse established connection
    description: >
      If checked - HTTP client will use the connection
      for multiple requests.
    default: true
  uri:
    type: string
    title: Server URI
    description: "Server URI, format: https://example.com/foo/bar"
required:
  - uri

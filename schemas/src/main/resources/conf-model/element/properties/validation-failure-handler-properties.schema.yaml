---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/validation-failure-handler-properties
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - if:
      properties:
        handleValidationAction:
          const: default
    then:
      properties: {}
  - if:
      properties:
        handleValidationAction:
          const: script
      required:
        - handleValidationAction
    then:
      required:
        - handlerContainer
      properties:
        handlerContainer:
          $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/resource-reference-script"
  - if:
      properties:
        handleValidationAction:
          const: mapper-2
      required:
        - handleValidationAction
    then:
      required:
        - handlerContainer
      properties:
        handlerContainer:
          $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/resource-reference-mapper"
title: Validation Failure Handler
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  handleValidationAction:
    type: string
    oneOf:
      - const: default
        title: Default
      - const: script
        title: Scripting
      - const: mapper-2

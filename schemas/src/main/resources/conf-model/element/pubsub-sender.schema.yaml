---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/pubsub-sender
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: PubSub Sender
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: pubsub-sender
  properties:
    type: object
    allOf:
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/context-propagation"
    properties:
      projectId:
        type: string
        title: Project id
        description: The Google Cloud PubSub Project ID.
      destinationName:
        type: string
        title: Destination name
        description: Subscription name
      serviceAccountKey:
        type: string
        title: Service account key
        description: >
          The Service account key that can be used as credentials for
          the PubSub publisher/subscriber. Must be specified as a base64
          encoded ServiceAccount json file.
      lazyStartProducer:
        type: boolean
        title: Lazy start producer
        description: >
          Whether the producer should be started lazy
          (on the first message).
        default: false
      messageOrderingEnabled:
        type: boolean
        title: Message ordering enabled
        description: Should message ordering be enabled.
        default: false
    if:
      properties:
        messageOrderingEnabled:
          const: true
    then:
      properties:
        orderingKey:
          type: string
          title: Message ordering key
          description: >
            Identifies related messages for which publish order should be
            respected.
    required:
      - projectId
      - destinationName
      - serviceAccountKey
required:
  - type

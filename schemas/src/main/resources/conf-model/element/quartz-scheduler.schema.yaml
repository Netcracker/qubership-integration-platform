---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/quartz-scheduler
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: Scheduler
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: quartz-scheduler
  properties:
    type: object
    properties:
      cron:
        type: string
        title: Cron expression
        description: >
          Quartz cron expression.
          Example (every 5 minutes): 0 */5 * ? * *
      deleteJob:
        type: boolean
        title: Delete job
        default: false
    required:
      - cron
    additionalProperties: false
required:
  - type

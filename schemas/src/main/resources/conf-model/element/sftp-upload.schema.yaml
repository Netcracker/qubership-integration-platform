---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/sftp-upload
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: SFTP Upload
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: sftp-upload
  properties:
    type: object
    properties:
      connectUrl:
        type: string
        title: Host:Port/Directory
        description: Connection url
      fileName:
        type: string
        title: File Name (mask supported)
        description: >
          Use Expression such as File Language to dynamically set
          the file name.
      autoCreate:
        type: boolean
        title: Create directory to file
      username:
        type: string
        title: Username
      password:
        type: string
        title: Password
        description: >
          For security purposes, use reference to secured variables when
          entering passwords.
      allowNullBody:
        type: boolean
        title: Allow null body
        default: true
      binary:
        type: boolean
        title: Binary
        description: >
          Specifies the file transfer mode, BINARY or ASCII.
          Default is ASCII (false).
        default: true
      throwExceptionOnConnectFailed:
        type: boolean
        title: Throw exception if Connection fails
        default: true
      useUserKnownHostsFile:
        type: boolean
        default: false
        title: User knows hosts file
    required:
      - connectUrl
    additionalProperties: false
required:
  - type

---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/specification
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/common-properties/top-level-entity-properties"
title: Specification
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
  fileExtension: specification.cip
properties:
  content:
    type: object
    allOf:
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/common-properties/description-property"
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/common-properties/labels-property"
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/common-properties/parent-property"
    properties:
      deprecated:
        type: boolean
        title: Specifies whether the specification is deprecated
      version:
        type: string
        title: Version of the specification
      source:
        $ref: "#/definitions/SpecificationSourceType"
      operations:
        type: array
        items:
          $ref: "#/definitions/Operation"
      specificationSources:
        type: array
        items:
          $ref: "#/definitions/SpecificationSource"
    required:
      - deprecated
      - version
      - source
required:
  - content
definitions:
  SpecificationSourceType:
    enum:
      - MANUAL
      - DISCOVERED
      - CUSTOMER_MANUAL
  SpecificationSource:
    type: object
    allOf:
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/common-properties/description-property"
    properties:
      id:
        type: string
        title: Identifier
      name:
        type: string
        title: Name
      sourceHash:
        type: string
        title: Source hash
      mainSource:
        type: boolean
        title: Main source
      fileName:
        type: string
        subtype: resourceReference
        title: File name
    required:
      - id
      - mainSource
      - fileName
  Operation:
    type: object
    allOf:
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/common-properties/description-property"
    properties:
      id:
        type: string
        title: Identifier
      name:
        type: string
        title: Name
      method:
        type: string
        title: Operation method
      path:
        type: string
        title: Operation path
      specification:
        type: object
      requestSchema:
        type: object
      responseSchemas:
        type: object
    required:
      - id
      - name
      - method
      - path

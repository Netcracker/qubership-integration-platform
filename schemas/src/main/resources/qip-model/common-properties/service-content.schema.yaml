---
$id: http://qubership.org/schemas/product/qip/common-properties/service-content.schema.yaml
$schema: http://json-schema.org/draft-07/schema
type: object
title: Service content properties
metaInfo:
  application: Qubership Integration Platform
  labels:
    - QIP
properties:
  activeEnvironmentId:
    type: string
    title: Active environment ID
definitions:
  SourceType:
    enum:
      - MANUAL
      - MAAS_BY_CLASSIFIER
  Environment:
    type: object
    allOf:
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/description-property.schema.yaml"
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/labels-property.schema.yaml"
      - if:
          properties:
            sourceType:
              const: MANUAL
        then:
          required:
            - address
    properties:
      id:
        type: string
        title: Identifier
      name:
        type: string
        title: Name
      address:
        type: string
      sourceType:
        $ref: "http://qubership.org/schemas/product/qip/common-properties/service-content.schema.yaml#/definitions/SourceType"
      properties:
        type: object
    additionalProperties: true
    required:
      - id
      - name
      - sourceType

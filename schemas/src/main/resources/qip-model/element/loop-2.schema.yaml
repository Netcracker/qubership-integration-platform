---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/loop-2
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/container-element-properties"
title: Loop
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: loop-2
  properties:
    type: object
    properties:
      expression:
        type: string
        title: Value
      doWhile:
        type: boolean
        title: Expression is used
      copy:
        type: boolean
        title: Copy start context each iteration
      loopIndexPropertyName:
        type: string
        title: Loop iteration index property
        description: >
          If set, holds a name of the property storing zero-based index
          of the current iteration. The property holding iteration index
          is removing after loop exits.
      maxLoopIteration:
        oneOf:
          - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/integer-or-variable-placeholder"
          - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/simple-expression"
        title: Maximum iteration count
        description: >
          When specified number of iterations is reached, chain stops
          processing and throw an error.
        default: 1500
    required:
      - expression
    additionalProperties: false
required:
  - type

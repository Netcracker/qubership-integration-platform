---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/integer-or-variable-placeholder
$schema: http://json-schema.org/draft-07/schema
title: Integer or Variable Placeholder
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
oneOf:
  - type: integer
    minimum: 0
  - type: string
    pattern: "^[0-9]+$"
  - type: string
    pattern: "^#\\{[a-zA-Z0-9:._-]+\\}$"

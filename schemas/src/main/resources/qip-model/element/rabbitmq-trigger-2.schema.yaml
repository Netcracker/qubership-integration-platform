---
$id: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/rabbitmq-trigger-2
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/common-element-properties"
title: RabbitMQ Trigger
metaInfo:
  application: Cloud Integration Platform
  labels:
    - CIP
properties:
  type:
    type: string
    const: rabbitmq-trigger-2
  properties:
    type: object
    allOf:
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/rabbitmq-connection-parameters"
      - $ref: "http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/properties/idempotency"
    properties:
      queues:
        type: string
        title: Queue(s) Name
        description: >
          The queue(s) to use for consuming messages (separated by comma).
      routingKey:
        type: string
        title: Routing Key
        description: >
          The routing key that binds the queue to the exchange. The chain does not create the
          binding; declare it through MaaS or on the broker.
      acknowledgeMode:
        $ref: "#/definitions/AcknowledgeMode"
      exchangeType:
        $ref: "#/definitions/ExchangeType"
        title: Exchange Type
        description: >
          The type the exchange is declared with. The chain does not create the exchange; declare it
          through MaaS or on the broker.
      deadLetterExchange:
        type: string
        title: Dead Letter Exchange
        description: >
          The exchange rejected messages are routed to. Dead lettering is an argument of the queue,
          set when the queue is declared, so declare the queue with it through MaaS or on the broker.
      deadLetterExchangeType:
        $ref: "#/definitions/ExchangeType"
        title: Dead Letter Exchange Type
        description: >
          The type the dead letter exchange is declared with. The chain does not create the exchange;
          declare it through MaaS or on the broker.
      deadLetterQueue:
        type: string
        title: Dead Letter Queue
        description: >
          The queue rejected messages are routed to. The chain does not create it; declare it through
          MaaS or on the broker.
      deadLetterRoutingKey:
        type: string
        title: Dead Letter Routing Key
        description: >
          The routing key that binds the dead letter queue to the dead letter exchange. The chain
          does not create the binding; declare it through MaaS or on the broker.
    required:
      - queues
definitions:
  AcknowledgeMode:
    enum:
      - NONE
      - MANUAL
      - AUTO
    default: AUTO
    title: Acknowledge Mode
    description: >
      NONE - no acknowledgment will be sent.
      MANUAL - immediately send an acknowledgment (normal or negative)
      when message is taken.
      AUTO - send an acknowledgment (normal or negative)
      after the end of the chain.
  ExchangeType:
    enum:
      - direct
      - fanout
      - headers
      - topic
    default: direct
    title: Exchange type
required:
  - type

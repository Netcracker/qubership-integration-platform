---
$id: http://qubership.org/schemas/product/qip/implemented-service.schema.yaml
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://qubership.org/schemas/product/qip/common-properties/top-level-entity-properties.schema.yaml"
title: Implemented Service
metaInfo:
  application: Qubership Integration Platform
  labels:
    - QIP
  fileExtension: implemented-service.qip
properties:
  content:
    type: object
    allOf:
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/description-property.schema.yaml"
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/labels-property.schema.yaml"
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/migrations-property.schema.yaml"
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/service-content.schema.yaml"
    # The file name states the type, so the document must not restate it.
    # additionalProperties would not do: in draft-07 it does not see properties contributed through allOf $refs.
    not:
      required:
        - integrationSystemType
    properties:
      protocol:
        title: Protocol
        $ref: "#/definitions/Protocol"
      environments:
        type: array
        title: Environments
        maxItems: 1
        items:
          $ref: "http://qubership.org/schemas/product/qip/common-properties/service-content.schema.yaml#/definitions/Environment"
required:
  - content
definitions:
  Protocol:
    enum:
      - HTTP
      - SOAP
      - GRAPHQL

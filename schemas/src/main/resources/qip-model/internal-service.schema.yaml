---
$id: http://qubership.org/schemas/product/qip/internal-service.schema.yaml
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://qubership.org/schemas/product/qip/common-properties/top-level-entity-properties.schema.yaml"
title: Internal Service
metaInfo:
  application: Qubership Integration Platform
  labels:
    - QIP
  # All three plain service types share one file name; the type is stated by $schema.
  fileExtension: service.qip
properties:
  content:
    type: object
    allOf:
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/typed-service-content.schema.yaml"
    properties:
      # The deployed name an internal service is addressed by. The exporter writes the column whatever the type, so a
      # document of another type can carry it undeclared.
      internalServiceName:
        type: string
        title: Internal service name
      protocol:
        title: Protocol
        $ref: "#/definitions/Protocol"
      environments:
        maxItems: 1
required:
  - content
definitions:
  Protocol:
    enum:
      - HTTP
      - AMQP
      - KAFKA
      - SOAP
      - GRAPHQL
      - METAMODEL
      - GRPC

---
# The pre-#553 service document, where the type sits in the body rather than in the file name.
#
# Superseded by the per-type schemas, one per value of the integrationSystemType enum below:
#   EXTERNAL     -> external-service.schema.yaml
#   INTERNAL     -> internal-service.schema.yaml
#   IMPLEMENTED  -> implemented-service.schema.yaml
# Their shared content is common-properties/typed-service-content.schema.yaml.
#
# Frozen, not dead: every archive older than #553 uses this format, and V105RevertMigration restores it under
# qip.export.legacy-format.
$id: http://qubership.org/schemas/product/qip/service.schema.yaml
$schema: http://json-schema.org/draft-07/schema
type: object
allOf:
  - $ref: "http://qubership.org/schemas/product/qip/common-properties/top-level-entity-properties.schema.yaml"
title: Service
metaInfo:
  application: Qubership Integration Platform
  labels:
    - QIP
  fileExtension: service.qip
properties:
  content:
    type: object
    allOf:
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/description-property.schema.yaml"
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/labels-property.schema.yaml"
      - $ref: "http://qubership.org/schemas/product/qip/common-properties/migrations-property.schema.yaml"
    properties:
      activeEnvironmentId:
        type: string
        title: Active environment ID
      integrationSystemType:
        title: Integration system type
        $ref: "http://qubership.org/schemas/product/qip/common-properties/service-type.schema.yaml"
      protocol:
        title: Protocol
        $ref: "#/definitions/Protocol"
      environments:
        type: array
        title: Environments
        items:
          $ref: "http://qubership.org/schemas/product/qip/common-properties/environment.schema.yaml"
    required:
      - integrationSystemType
required:
  - content
definitions:
  Protocol:
    enum:
      - HTTP
      - AMQP
      - KAFKA
      - SOAP
      - GRAPHQL
      - METAMODEL
      - GRPC

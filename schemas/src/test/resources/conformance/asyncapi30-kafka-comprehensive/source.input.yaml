asyncapi: 3.0.0
info:
  title: Kafka Comprehensive Test Spec
  version: 2.0.0
  description: Covers all Kafka parsing cases
  license:
    name: MIT
  tags:
    - name: kafka
    - name: test
  externalDocs:
    url: https://example.com/kafka-docs

servers:
  production:
    host: kafka-broker-1.internal:9092
    protocol: kafka
  staging:
    host: kafka-staging.internal:9092
    protocol: kafka

channels:
  # Case 1: inline payload with headers
  orderCommands:
    address: orders.commands
    messages:
      CreateOrder:
        headers:
          type: object
          properties:
            correlationId:
              type: string
            source:
              type: string
        payload:
          type: object
          required:
            - customerId
            - items
          properties:
            customerId:
              type: string
              format: uuid
            items:
              type: array
              items:
                type: object
                required:
                  - productId
                  - quantity
                properties:
                  productId:
                    type: string
                  quantity:
                    type: integer
                    minimum: 1
            comment:
              type: string

  # Case 2: payload $ref to component schema
  paymentEvents:
    address: payments.events
    messages:
      PaymentProcessed:
        $ref: '#/components/messages/PaymentProcessed'

  # Case 3: multiple messages (oneOf via operation)
  auditLog:
    address: audit.log
    messages:
      UserAction:
        $ref: '#/components/messages/UserAction'
      SystemEvent:
        $ref: '#/components/messages/SystemEvent'
      DataChange:
        $ref: '#/components/messages/DataChange'

  # Case 4: reply pattern
  queryRequests:
    address: query.requests
    messages:
      QueryRequest:
        payload:
          type: object
          required:
            - queryType
            - filters
          properties:
            queryType:
              type: string
              enum: [search, aggregate, count]
            filters:
              type: object
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 0
                  default: 0
                size:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 20

  queryResponses:
    address: query.responses
    messages:
      QueryResponse:
        $ref: '#/components/messages/QueryResponse'

  # Case 5: deeply nested $ref chain
  catalogSync:
    address: catalog.sync
    messages:
      CatalogUpdate:
        $ref: '#/components/messages/CatalogUpdate'

  # Case 6: schema with allOf/oneOf inside properties
  userProfiles:
    address: users.profiles
    messages:
      ProfileUpdate:
        $ref: '#/components/messages/ProfileUpdate'

operations:
  # send inline payload with headers
  sendCreateOrder:
    action: send
    channel:
      $ref: '#/channels/orderCommands'
    x-maas-classifier-name: order-commands
    messages:
      - $ref: '#/channels/orderCommands/messages/CreateOrder'

  # receive — payload $ref to component schema
  receivePaymentProcessed:
    action: receive
    channel:
      $ref: '#/channels/paymentEvents'
    messages:
      - $ref: '#/channels/paymentEvents/messages/PaymentProcessed'

  # receive oneOf (3 message types)
  receiveAuditLog:
    action: receive
    channel:
      $ref: '#/channels/auditLog'
    messages:
      - $ref: '#/channels/auditLog/messages/UserAction'
      - $ref: '#/channels/auditLog/messages/SystemEvent'
      - $ref: '#/channels/auditLog/messages/DataChange'

  # send with reply
  sendQuery:
    action: send
    channel:
      $ref: '#/channels/queryRequests'
    messages:
      - $ref: '#/channels/queryRequests/messages/QueryRequest'
    reply:
      channel:
        $ref: '#/channels/queryResponses'
      messages:
        - $ref: '#/channels/queryResponses/messages/QueryResponse'

  # receive — deep $ref chain
  receiveCatalogUpdate:
    action: receive
    channel:
      $ref: '#/channels/catalogSync'
    x-maas-classifier-name: catalog-sync
    messages:
      - $ref: '#/channels/catalogSync/messages/CatalogUpdate'

  # send — schema with allOf/oneOf
  sendProfileUpdate:
    action: send
    channel:
      $ref: '#/channels/userProfiles'
    messages:
      - $ref: '#/channels/userProfiles/messages/ProfileUpdate'

components:
  messages:
    # payload $ref to component schema (with nested refs inside)
    PaymentProcessed:
      payload:
        $ref: '#/components/schemas/PaymentEvent'

    UserAction:
      payload:
        $ref: '#/components/schemas/UserAction'

    SystemEvent:
      payload:
        type: object
        required:
          - eventType
          - timestamp
        properties:
          eventType:
            type: string
          timestamp:
            type: string
            format: date-time
          details:
            type: string

    DataChange:
      payload:
        type: object
        required:
          - entity
          - operation
        properties:
          entity:
            type: string
          operation:
            type: string
            enum: [INSERT, UPDATE, DELETE]
          before:
            type: object
          after:
            type: object

    QueryResponse:
      payload:
        type: object
        properties:
          data:
            type: array
            items:
              type: object
          totalCount:
            type: integer
          hasMore:
            type: boolean

    # deep $ref chain: CatalogUpdate -> Product -> Category + Price -> Currency
    CatalogUpdate:
      payload:
        $ref: '#/components/schemas/CatalogUpdate'

    # allOf/oneOf inside schema
    ProfileUpdate:
      payload:
        $ref: '#/components/schemas/ProfileUpdate'

  schemas:
    # nested $ref: PaymentEvent -> PaymentMethod + Address
    PaymentEvent:
      type: object
      required:
        - paymentId
        - amount
        - currency
        - status
      properties:
        paymentId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        method:
          $ref: '#/components/schemas/PaymentMethod'
        billingAddress:
          $ref: '#/components/schemas/Address'

    PaymentMethod:
      type: object
      properties:
        type:
          type: string
          enum: [card, bank_transfer, wallet]
        last4:
          type: string
          pattern: "^\\d{4}$"
        provider:
          type: string

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
        postalCode:
          type: string

    UserAction:
      type: object
      required:
        - userId
        - action
        - timestamp
      properties:
        userId:
          type: string
        action:
          type: string
        timestamp:
          type: string
          format: date-time
        resource:
          type: string
        ip:
          type: string
          format: ipv4

    # deep chain: CatalogUpdate -> Product -> Category, Price -> Currency
    CatalogUpdate:
      type: object
      required:
        - action
        - products
      properties:
        action:
          type: string
          enum: [upsert, delete]
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        batchId:
          type: string

    Product:
      type: object
      required:
        - sku
        - name
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        price:
          $ref: '#/components/schemas/Price'
        attributes:
          type: object

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string

    Price:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          format: double
        currency:
          $ref: '#/components/schemas/Currency'
        discount:
          type: number
          minimum: 0
          maximum: 100

    Currency:
      type: object
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 3
        symbol:
          type: string

    # allOf + oneOf inside properties
    ProfileUpdate:
      type: object
      required:
        - userId
        - changes
      properties:
        userId:
          type: string
          format: uuid
        changes:
          type: object
          properties:
            displayName:
              type: string
            contactInfo:
              oneOf:
                - $ref: '#/components/schemas/EmailContact'
                - $ref: '#/components/schemas/PhoneContact'
            preferences:
              type: object
              properties:
                locale:
                  type: string
                timezone:
                  type: string

    EmailContact:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        verified:
          type: boolean

    PhoneContact:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
        countryCode:
          type: string

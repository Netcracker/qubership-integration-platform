# $schema: http://netcracker.com/schemas/product/cloud-integration-platform/conf-model/element/http-trigger
id: "id"
name: "HTTP Trigger"
type: "http-trigger"
properties:
  accessControlType: "RBAC"
  chunked: true
  connectTimeout: 120000
  contextPath: "xxx"
  externalRoute: true
  handleChainFailureAction: "default"
  handleValidationAction: "default"
  httpBinding: "handlingHttpBinding"
  killSessionOnTimeout: false
  privateRoute: false
  rejectRequestIfNonNullBodyGetDelete: true
  roles:
    - "role1"

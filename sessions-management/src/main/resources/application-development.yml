server:
  port: 8080

logging:
  level:
    root: ${ROOT_LOG_LEVEL:WARN}
    org.qubership.integration.platform: DEBUG

spring:
  config:
    import: optional:consul:${CONSUL_URL:http://consul:8500}
  cloud:
    consul:
      config:
        m2m:
          enabled: false
        # Deprecated: the token is read from the file CONSUL_ADMIN_TOKEN_FILE points at. Removed in release 27.3.
        acl-token: ${CONSUL_ADMIN_TOKEN:}

cip:
  standalone: true
  internal-services:
    runtime-catalog: qip-runtime-catalog
  logging:
    format: ${LOG_FORMAT:text}

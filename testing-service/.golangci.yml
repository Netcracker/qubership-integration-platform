# Pinned to golangci-lint v1.64.8, the last release of the v1 configuration
# schema. CI installs that exact version; a v2 binary will not read this file.
run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gofmt
    - goimports
    - gosec
    - misspell
    - nolintlint
    - unconvert

linters-settings:
  goimports:
    local-prefixes: github.com/Netcracker/qubership-integration-platform/testing-service
  misspell:
    locale: US

issues:
  exclude-dirs:
    # Generated by swag; regenerate it rather than fix it.
    - docs
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - gosec

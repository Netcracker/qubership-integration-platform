definitions:
  EndpointMock:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      endpointReference:
        $ref: '#/definitions/EndpointReference'
      id:
        type: string
      name:
        type: string
      requestMatchers:
        items:
          $ref: '#/definitions/Matcher'
        type: array
      responseSettings:
        $ref: '#/definitions/ResponseSettings'
      updatedAt:
        type: string
      updatedBy:
        type: string
    type: object
  EndpointReference:
    properties:
      chainId:
        type: string
      elementId:
        type: string
    type: object
  ErrorMessage:
    properties:
      errorDate:
        description: Time of the error, formatted as yyyy-mm-dd hh:mm:ss.mmm.
        example: "2024-05-17 11:33:23.038"
        type: string
      errorMessage:
        description: The error itself, which may be a custom message or an internal
          failure.
        example: Something went wrong.
        type: string
      serviceName:
        description: Name of the service that produced the message.
        example: testing-service
        type: string
      stacktrace:
        description: The stack trace, when one is available; otherwise "No Stacktrace
          Available".
        example: No Stacktrace Available
        type: string
    type: object
  Filter:
    properties:
      condition:
        type: string
      feature:
        type: string
      values:
        items:
          type: string
        type: array
    type: object
  Header:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  ImportResult:
    properties:
      archive:
        type: string
      entityId:
        type: string
      entityName:
        type: string
      fileName:
        type: string
      message:
        type: string
      result:
        type: string
    type: object
  Matcher:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      entityName:
        type: string
      entityType:
        type: string
      id:
        type: string
      name:
        type: string
      parameters:
        items:
          $ref: '#/definitions/MatcherParameter'
        type: array
      type:
        type: string
    type: object
  MatcherParameter:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  Message:
    properties:
      body:
        type: string
      headers:
        items:
          $ref: '#/definitions/Header'
        type: array
    type: object
  PathParameter:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  QueryParameter:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  RequestSettings:
    properties:
      message:
        $ref: '#/definitions/Message'
      method:
        type: string
      pathParameters:
        items:
          $ref: '#/definitions/PathParameter'
        type: array
      queryParameters:
        items:
          $ref: '#/definitions/QueryParameter'
        type: array
      timeout:
        type: integer
    type: object
  ResponseSettings:
    properties:
      delay:
        type: integer
      message:
        $ref: '#/definitions/Message'
      status:
        type: integer
    type: object
  SelectionSpecification:
    properties:
      filters:
        items:
          $ref: '#/definitions/Filter'
        type: array
      ids:
        items:
          type: string
        type: array
      searchText:
        type: string
    type: object
  ServiceMode:
    properties:
      production:
        type: boolean
    type: object
  TestCase:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      requestSettings:
        $ref: '#/definitions/RequestSettings'
      responseValidationRules:
        items:
          $ref: '#/definitions/Matcher'
        type: array
      triggerReference:
        $ref: '#/definitions/TriggerReference'
      updatedAt:
        type: string
      updatedBy:
        type: string
    type: object
  TestCaseRunView:
    properties:
      chainId:
        type: string
      errors:
        type: integer
      finish:
        type: string
      id:
        type: string
      ordinal:
        type: integer
      sessionId:
        type: string
      start:
        type: string
      status:
        type: string
      testCaseDescription:
        type: string
      testCaseId:
        type: string
      testCaseName:
        type: string
      testsRunId:
        type: string
    type: object
  TestCaseView:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      enabledRuleCount:
        type: integer
      id:
        type: string
      name:
        type: string
      requestSettings:
        $ref: '#/definitions/RequestSettings'
      responseValidationRules:
        items:
          $ref: '#/definitions/Matcher'
        type: array
      triggerReference:
        $ref: '#/definitions/TriggerReference'
      updatedAt:
        type: string
      updatedBy:
        type: string
      validationRuleCount:
        type: integer
    type: object
  TestsRunView:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      errors:
        type: integer
      finish:
        type: string
      id:
        type: string
      start:
        type: string
      status:
        type: string
      testCases:
        type: integer
      updatedAt:
        type: string
      updatedBy:
        type: string
    type: object
  TriggerReference:
    properties:
      chainId:
        type: string
      elementId:
        type: string
    type: object
  ValidationError:
    properties:
      id:
        type: string
      matcher:
        $ref: '#/definitions/Matcher'
      matcherId:
        type: string
      message:
        type: string
      testCaseRunId:
        type: string
    type: object
info:
  contact: {}
  description: API of the testing service of the Qubership Integration Platform.
  title: Testing Service API

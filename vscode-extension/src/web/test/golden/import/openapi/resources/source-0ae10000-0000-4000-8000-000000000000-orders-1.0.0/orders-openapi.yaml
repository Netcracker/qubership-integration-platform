# The OpenAPI import fixture. Three operations over two paths, so the golden records a path with two
# methods and a path parameter; one `servers` entry, which is where the environment the import
# creates takes its address from; a query parameter with an inline enum, a request body and two
# response schemas, one of them an array of a `$ref`. `components.schemas` is referenced rather than
# inlined, because `createRequestSchema` and `createResponseSchemas` resolve a reference and the
# golden shows what they resolved it to.
#
# The extension is `.yaml` and not `.openapi`: `detectProtocolByExtension` knows no such extension,
# so the protocol is detected from the parsed content, which is the only way an OpenAPI document is
# detected at all. The server's `description` is what `extractOpenApiServers` names the
# environment after, so it reads as an environment name rather than as prose.
openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
  description: The orders API the import fixture describes.
servers:
  - url: http://orders.qip.test/api/v1
    description: Orders test stand
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - NEW
              - SHIPPED
      responses:
        "200":
          description: The orders that match the filter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: The order that was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Read one order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No order carries that id.
components:
  schemas:
    Order:
      type: object
      required:
        - orderId
        - total
      properties:
        orderId:
          type: string
        total:
          type: number
          format: double
        customer:
          type: string
    OrderRequest:
      type: object
      required:
        - customer
      properties:
        customer:
          type: string
        lines:
          type: array
          items:
            type: string

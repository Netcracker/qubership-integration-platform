version: "1.0"

configs:
  acme:
    extensions:
      chain: .chain.${appName}.yaml
      contextService: .context-service.${appName}.yaml
      mcpService: .mcp-service.${appName}.yaml
      service: .service.${appName}.yaml
      externalService: .external-service.${appName}.yaml
      internalService: .internal-service.${appName}.yaml
      implementedService: .implemented-service.${appName}.yaml
      specificationGroup: .specification-group.${appName}.yaml
      apiGroup: .api-group.${appName}.yaml
      specification: .specification.${appName}.yaml
      api: .api.${appName}.yaml
    schemaUrls:
      contextService: http://acme.example.com/schemas/${appName}/context-service
      mcpService: http://acme.example.com/schemas/${appName}/mcp-service
      service: http://acme.example.com/schemas/${appName}/service
      externalService: http://acme.example.com/schemas/${appName}/external-service
      internalService: http://acme.example.com/schemas/${appName}/internal-service
      implementedService: http://acme.example.com/schemas/${appName}/implemented-service
      chain: http://acme.example.com/schemas/${appName}/chain
      specification: http://acme.example.com/schemas/${appName}/specification
      specificationGroup: http://acme.example.com/schemas/${appName}/specification-group
      apiGroup: http://acme.example.com/schemas/${appName}/api-group
      api: http://acme.example.com/schemas/${appName}/api

cache:
  ttl: 60000
